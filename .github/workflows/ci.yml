name: 테스트 (3모듈)

# 이슈 #73 · 역할표 §인프라 8.9. 소유: 오준서
#
# 이 워크플로가 생기기 전까지 세 모듈의 테스트는 CI 에서 한 번도 돌지 않았다.
#
# ── 설계에서 가장 중요한 두 가지 ─────────────────────────────────────────────
#
# ① **skip 을 실패로 취급한다.** 이 레포의 테스트에는 데이터 파일이 없으면 조용히
#    건너뛰는 것들이 있다(`Assumptions.assumeTrue`, `pytest.mark.skipif`). 로컬에서는
#    그게 옳다 — `fetch_timeseries.py` 를 안 돌린 사람을 막지 않으려는 것이다. **CI 에서는
#    정반대다.** data/ 4종이 전부 커밋돼 있으므로(timeseries·misconception_library·
#    documents·dispute_cases) 러너에서 skip 이 나온다는 것은 "검산이 안 돌았다"는 뜻이고,
#    그런데도 로그는 초록으로 남는다. 이슈 #73 이 *"지금 초록이 초록이 아니다"* 라고 부른
#    상태가 이것이다. 그래서 개별 테스트를 고치라고 하는 대신 **CI 가 skip 수를 세서
#    막는다** — 이러면 앞으로 누가 어떤 이유로 skip 을 추가해도 같은 그물에 걸린다.
#
# ② **경로 필터는 모듈 경계와 다르다.** 문서만 고친 PR 이 3모듈을 다 돌 이유는 없지만,
#    "server/ 를 안 고쳤으니 server 테스트를 건너뛴다"는 틀렸다. 세 모듈의 테스트가
#    자기 디렉토리 밖을 읽는다.
#
#      server    ← contracts/**  · CLAUDE.md  (build.gradle 이 test 의 inputs 로 선언)
#                  data/timeseries/**
#      ai-service ← contracts/** · data/**
#                  web/src/lib/survey.ts   ← 교차 언어 검사(test_survey_contract.py)
#      web        ← web/**
#                  data/timeseries/VERSION   ← 기초자산 표기표(이슈 #219)
#
#    특히 마지막 줄이 조용하다. `web/src/lib/survey.ts` 의 문항 문면이 바뀌면 ai-service 의
#    `AXIS_BY_QUESTION` 과 어긋나 **에러 없이 틀린 축으로 판정**될 수 있고, 그걸 잡는
#    테스트가 ai-service 쪽에 있다. web 만 고친 PR 에서 ai-service 를 건너뛰면 그 검사가
#    안 돈다. 그 테스트 주석이 *"CI 가 없어서 교차 언어 검사를 CI 에 넣을 수 없다"* 고
#    적어둔 자리가 여기다.
#
#    `data/timeseries/VERSION` → web 도 같은 모양이다(이슈 #219). S-04 가 기초자산 키를
#    화면 표기로 바꾸는 표를 갖고 있는데 그 근거가 저 파일이고, **web 에는 테스트 러너가
#    없어서 어긋나도 아무도 말하지 않는다.** 그래서 ③ 이 필요하다.
#
# ③ **web 에는 테스트 러너가 없다 — 그래서 CI 가 대조를 대신 한다.**
#    러너를 넣는 것은 3주 타임박스 밖이라(역할표 §인프라) `tsc + build` 가 전부인데,
#    타입이 안 잡는 종류의 어긋남이 하나 있다: **web 이 서버 쪽 표를 옮겨 적은 자리.**
#    지금 하나 남아 있고(`INDEX_LABEL`), 여기서 `VERSION` 과 대조한다. 필터에
#    `data/timeseries/VERSION` 을 넣은 이유가 이것이다 — 기초자산이 늘어나는 PR 은
#    `web/` 을 안 건드리므로, 안 넣으면 **정작 갈리는 그 PR 에서 이 검사가 안 돈다.**
# ────────────────────────────────────────────────────────────────────────────
#
# 린터는 넣지 않는다 — 역할표 §인프라 가 3주 타임박스에서 범위 밖으로 정했고 뒤집을 근거가
# 아직 없다. `pr-review-guard.yml` 은 별개다(승인 집계, 테스트와 무관).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # 같은 PR 에 새 커밋이 오면 옛 실행은 의미가 없다. pr-review-guard 와 반대로 여기서는
  # 취소가 옳다 — 저건 커밋 상태를 쓰므로 늦게 끝난 옛 실행이 새 결과를 덮을 수 있지만,
  # 이건 체크 런이라 최신 실행만 표시된다.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ❗**잡이 하나다 — 넷이 아니다.** GitHub 는 **잡 단위로 1분 미만을 1분으로 올림** 과금해서
  # 4초짜리 판별 잡도 1분이 나가고, 스킵된 잡만 0분이다. 넷으로 갈라 두면 실측 총합보다
  # 훨씬 많이 나간다 — 이슈 #276 실측으로 **99 실행에 실측 108분 · 과금 341분**이었고,
  # 한 잡으로 합치면 **211분**이다(실행별로 올림해서 더한 값. 평균으로 추정하면 안 된다).
  #
  # 합치면서 **잃지 않으려고 붙잡은 것 셋**이 아래 `if:` 들의 이유다.
  #
  # ① **경로 필터를 그대로 둔다.** 없애자는 안이 있었는데 실측에서 손해였다(#276: 반사실
  #    둘 다 +19~50분). 스킵된 잡은 0분이라 **게이트 1분이 세 잡의 판정을 대신 사 준다.**
  #    이제는 별도 잡이 아니라 같은 잡의 첫 스텝이라 올림 대상도 아니다 — 게이트가 공짜가 됐다.
  #
  # ② **한 모듈이 깨져도 나머지가 돈다.** 잡이 갈려 있을 때는 공짜로 얻던 성질이다. 스텝은
  #    앞이 실패하면 멈추므로, 모듈 블록마다 `!cancelled() && <선택됨>` 을 걸어 **서로
  #    독립**으로 만들었다. server 가 빨개도 web 빌드 결과를 같은 실행에서 본다.
  #    모듈 *안에서는* 원래대로 순차다 — 설치가 실패하면 그 모듈의 테스트는 안 돈다.
  #
  # ③ **어느 모듈이 돌았는지 한눈에 보인다.** 갈려 있을 때는 체크 목록에 `skipping` 이 떠서
  #    그냥 보였다. 합치면 로그를 열어야 하므로 **마지막 스텝이 요약(`$GITHUB_STEP_SUMMARY`)
  #    에 적는다.** 이게 없으면 "web 이 안 돈 것"과 "web 이 통과한 것"이 같아 보인다.
  #
  # ❗`always()` 가 아니라 `!cancelled()` 다. `always()` 는 **취소된 실행에서도** 남은 스텝을
  # 계속 돌린다. 이 워크플로는 `cancel-in-progress: true` 라 새 커밋마다 취소가 나고, 그때
  # 스텝이 끝까지 도는 것은 정확히 우리가 줄이려던 그 분이다.
  # job id 는 ASCII 다 — `[A-Za-z_][A-Za-z0-9_-]*` 를 벗어나면 워크플로 스키마 검증에서
  # 걸리고, 그 실패는 **잡 0건 · 로그 없음 · 목록에서 name 자리에 파일 경로**로 나타난다
  # (정세현 #130 리뷰). YAML 은 정상이라 로컬 파서로는 안 잡힌다. `name:` 과 스텝 이름은
  # 제약이 없어서 이 레포의 다른 워크플로 셋이 한글로 돌고 있다 — id 만 규칙이 다르다.
  test:
    name: 테스트 (3모듈)
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        # data/ 는 전부 커밋돼 있으므로 checkout 만으로 충분하다(이슈 #37 코멘트 ②).
        # LFS 도 서브모듈도 쓰지 않는다. 세 모듈이 한 잡이라 **한 번만** 받는다.

      - name: 변경 모듈 판별
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # push(main)·수동 실행은 판별 대상이 없다 — 전부 돈다.
          if [ -z "${PR:-}" ]; then
            echo "PR 이 아니다 — 3모듈 전부 실행"
            { echo "server=true"; echo "ai_service=true"; echo "web=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 변경 파일은 API 로 받는다. git diff 로 하면 merge-base 를 얻으려고 전체 히스토리를
          # 받아야 하고(fetch-depth: 0), 이 판별만 하려고 그 비용을 낼 이유가 없다.
          files=$(gh api "/repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          echo "── 변경 파일 ──"; printf '%s\n' "$files"

          # 워크플로 자신이 바뀌면 판별을 믿을 수 없다 — 전부 돈다.
          if printf '%s\n' "$files" | grep -qE '^\.github/workflows/ci\.yml$'; then
            echo "워크플로 변경 — 3모듈 전부 실행"
            { echo "server=true"; echo "ai_service=true"; echo "web=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          hit() { printf '%s\n' "$files" | grep -qE "$1"; }

          # 각 모듈이 **실제로 읽는** 경로다. 파일 위치가 아니라 의존을 기준으로 적었다 —
          # 근거는 이 파일 상단 ②.

          # ❗`server/` 밖인데 **server 테스트가 지키는** 파일들이다. 정본은
          # `server/build.gradle` 의 `inputs.file` 목록이고 여기는 그 사본이다(이슈 #285).
          #
          #   web/src/api/types.ts                     ErrorCodeContractTest
          #   web/src/lib/survey.ts                    SurveyIsOptionOnlyTest
          #   web/docker-entrypoint.d/15-demo-mode.sh  DemoModeAccountMapTest
          #   ai-service/app/scoring.py                EchoCapBelowR05Test
          #
          # 두 목록이 막는 것이 다르다. `inputs.file` 은 **Gradle 이 UP-TO-DATE 로 건너뛰는
          # 것**을 막고, 이 줄은 **잡 자체가 안 뜨는 것**을 막는다. 한쪽만 있으면 대조
          # 테스트가 정작 갈리는 순간에 안 돈다 — `#270`(지도를 고치는데 `DemoModeAccountMapTest`
          # 가 CI 에서 안 돌았다)이 그 실측이다.
          #
          # `^web/` 통짜로 넓히지 않는다. 화면만 고치는 PR 에 JUnit 이 붙으면 `#276`(잡
          # 개수에 비례하는 올림 과금)이 도로 는다. `survey.ts` 가 `ai-service` 필터에
          # 이름으로 박혀 있는 것은 이 단정과 무관하다 — 그 파일을 지키는 것은 JUnit 이다.
          server_extra='web/src/api/types\.ts$|web/src/lib/survey\.ts$|web/docker-entrypoint\.d/15-demo-mode\.sh$|ai-service/app/scoring\.py$'
          server=false;    hit '^(server/|contracts/|data/timeseries/|CLAUDE\.md$|'"$server_extra"')' && server=true
          ai=false;        hit '^(ai-service/|contracts/|data/|web/src/lib/survey\.ts$)' && ai=true
          # `data/timeseries/VERSION` 이 여기 있는 이유는 상단 ③ 이다. 기초자산이 늘거나
          # label 이 바뀌는 PR 은 web/ 을 안 건드린다 — 빼면 그 PR 에서 표기표 대조가 안 돈다.
          web=false;       hit '^(web/|data/timeseries/VERSION$)' && web=true

          echo "── 판별 ── server=$server ai-service=$ai web=$web"
          { echo "server=$server"; echo "ai_service=$ai"; echo "web=$web"; } >> "$GITHUB_OUTPUT"

      # ── server ──────────────────────────────────────────────────────────────
      - name: server · JDK 17 고정
        if: ${{ !cancelled() && steps.filter.outputs.server == 'true' }}
        uses: actions/setup-java@v4
        with:
          # build.gradle 이 toolchain languageVersion=17 로 박아두는데 그 값이 README·
          # CLAUDE.md 어디에도 없었다. 러너에서는 여기가 그 근거다. 21 로 올리면
          # 툴체인이 17 JDK 를 찾다가 실패한다 — 버전을 올릴 거면 build.gradle 과 함께 올린다.
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: server · 테스트
        id: server_test
        if: ${{ !cancelled() && steps.filter.outputs.server == 'true' }}
        working-directory: server
        run: ./gradlew test --console=plain
      - name: server · skip 검사 — 건너뛴 테스트가 있으면 실패로 본다
        id: server_skip
        if: ${{ !cancelled() && steps.filter.outputs.server == 'true' }}
        working-directory: server
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          total = failed = errors = skipped = 0
          names = []
          for p in glob.glob("build/test-results/test/*.xml"):
              r = ET.parse(p).getroot()
              total   += int(r.get("tests", 0))
              failed  += int(r.get("failures", 0))
              errors  += int(r.get("errors", 0))
              skipped += int(r.get("skipped", 0))
              for tc in r.iter("testcase"):
                  if tc.find("skipped") is not None:
                      names.append(f"{tc.get('classname','').split('.')[-1]}.{tc.get('name')}")
          print(f"총 {total}건 · 실패 {failed} · 에러 {errors} · skip {skipped}")
          if skipped:
              print("::error::건너뛴 테스트가 있다 — data/ 는 커밋돼 있으므로 러너에서 skip 은 "
                    "'검산이 안 돌았다'는 뜻이다. 아래 테스트의 전제 조건을 확인한다.")
              for n in names:
                  print(f"::error::skip → {n}")
              sys.exit(1)
          if total == 0:
              print("::error::테스트 결과가 비어 있다 — test 태스크가 실제로 돌았는지 확인한다.")
              sys.exit(1)
          PY
      - name: server · 기동 스모크 — GET /products 200
        id: server_smoke
        if: ${{ !cancelled() && steps.filter.outputs.server == 'true' && steps.server_test.outcome == 'success' && steps.server_skip.outcome == 'success' }}
        working-directory: server
        run: |
          set -uo pipefail
          # `./gradlew test` 가 전부 초록인데 서버가 안 뜨는 상태가 실제로 있었다(#82).
          # 원인이 devtools 의 리소스 경로 변환기였고 devtools 는 developmentOnly 라
          # **테스트 클래스패스에 없다** — ApplicationBootTest 를 넣어도 그 결함을 못 잡는다.
          # bootRun 은 developmentOnly 를 포함하므로 여기서만 잡힌다(강희진 #73 코멘트).
          # /products 200 까지 보면 컨텍스트 초기화와 요청 처리를 둘 다 덮는다.
          ./gradlew bootRun --console=plain > bootrun.log 2>&1 &
          GRADLE_PID=$!
          ok=0
          for _ in $(seq 1 90); do
            if curl -fsS -o /dev/null http://localhost:8000/products; then ok=1; break; fi
            kill -0 "$GRADLE_PID" 2>/dev/null || break   # 기동 중 죽었으면 더 기다리지 않는다
            sleep 2
          done
          # gradle 을 끊어도 포크된 java 가 남을 수 있어 셋 다 건다. 러너는 곧 사라지지만
          # 다음 스텝이 8000 을 다시 쓸 수 있으므로 여기서 정리한다.
          kill "$GRADLE_PID" 2>/dev/null || true
          pkill -f 'SphinxApplication' 2>/dev/null || true
          ./gradlew --stop >/dev/null 2>&1 || true

          if [ "$ok" != 1 ]; then
            echo "::error::서버가 기동하지 못했거나 GET /products 가 200 이 아니다. 아래는 기동 로그 끝부분."
            tail -n 80 bootrun.log
            exit 1
          fi
          grep -q "Started SphinxApplication" bootrun.log \
            && echo "기동 확인 — Started SphinxApplication · GET /products 200" \
            || echo "GET /products 200 (기동 로그 문구는 못 찾음)"
      - name: server · 실패 시 리포트 보존
        if: ${{ !cancelled() && (steps.server_test.outcome == 'failure' || steps.server_skip.outcome == 'failure' || steps.server_smoke.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: server-test-results
          path: |
            server/build/reports/tests/test/
            server/build/test-results/test/
            server/bootrun.log
          retention-days: 7

      # ── ai-service ──────────────────────────────────────────────────────────
      - name: ai-service · Python 3.11 고정
        if: ${{ !cancelled() && steps.filter.outputs.ai_service == 'true' }}
        uses: actions/setup-python@v5
        with:
          # 로컬 실측 기준이다(3.11 에서 244건 통과). requirements 에 상한이 없어서
          # 러너 기본 파이썬을 따라가면 어느 날 조용히 버전이 올라가는데, pdfplumber·
          # reportlab 은 새 파이썬에서 휠이 늦다 — 그날 CI 만 깨지고 아무도 안 고쳤다.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.txt
            ai-service/requirements-dev.txt
      - name: ai-service · 의존성 설치
        id: ai_deps
        if: ${{ !cancelled() && steps.filter.outputs.ai_service == 'true' }}
        working-directory: ai-service
        # requirements-dev.txt 가 첫 줄에서 requirements.txt 를 당긴다. 테스트 전용
        # 의존성(jsonschema·reportlab)을 런타임과 섞지 않으려는 분리다.
        run: pip install -r requirements-dev.txt
      - name: ai-service · 테스트
        id: ai_test
        if: ${{ !cancelled() && steps.filter.outputs.ai_service == 'true' && steps.ai_deps.outcome == 'success' }}
        working-directory: ai-service
        # LLM 키 없이 돌아야 한다 — 외부 호출이 있는 테스트는 그 자체로 결함이다.
        run: pytest -q --junitxml=pytest-results.xml
      - name: ai-service · skip 검사 — 건너뛴 테스트가 있으면 실패로 본다
        id: ai_skip
        if: ${{ !cancelled() && steps.filter.outputs.ai_service == 'true' && steps.ai_deps.outcome == 'success' }}
        working-directory: ai-service
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET, pathlib
          p = pathlib.Path("pytest-results.xml")
          if not p.exists():
              print("::error::pytest 결과 파일이 없다 — 수집 단계에서 죽었는지 확인한다.")
              sys.exit(1)
          r = ET.parse(p).getroot()
          s = r if r.tag == "testsuite" else r.find("testsuite")
          total = int(s.get("tests", 0)); skipped = int(s.get("skipped", 0))
          print(f"총 {total}건 · skip {skipped}")
          if skipped:
              print("::error::건너뛴 테스트가 있다. data/documents/ 는 커밋돼 있으므로 "
                    "러너에서 실문서 테스트가 skip 될 이유가 없다(#37 코멘트 ②).")
              for tc in s.iter("testcase"):
                  if tc.find("skipped") is not None:
                      print(f"::error::skip → {tc.get('classname')}::{tc.get('name')}")
              sys.exit(1)
          PY
      - name: ai-service · 실패 시 리포트 보존
        if: ${{ !cancelled() && (steps.ai_test.outcome == 'failure' || steps.ai_skip.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-service-test-results
          path: ai-service/pytest-results.xml
          retention-days: 7

      # ── web ─────────────────────────────────────────────────────────────────
      - name: web · Node 20 고정
        if: ${{ !cancelled() && steps.filter.outputs.web == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web · 의존성 설치
        id: web_deps
        if: ${{ !cancelled() && steps.filter.outputs.web == 'true' }}
        working-directory: web
        # npm ci 다 — package-lock.json 이 커밋돼 있고, install 은 락을 갱신해 버려서
        # "러너에서만 다른 버전"이 생긴다.
        run: npm ci
      - name: web · 타입 검사 + 빌드
        id: web_build
        if: ${{ !cancelled() && steps.filter.outputs.web == 'true' && steps.web_deps.outcome == 'success' }}
        working-directory: web
        # `npm run build` 가 `tsc --noEmit && vite build` 다. 타입만 보면 **빌드 단계에서만
        # 나는 실패**(에셋 해석·번들 크기·플러그인)가 안 걸린다 — #81 이 폰트를 자체
        # 호스팅으로 바꾸면서 CSS 가 12KB → 250KB 가 됐는데 그런 변경은 tsc 를 안 탄다
        # (강희진 #130 리뷰). 타입 쪽은 그대로다: 계약 타입이 camelCase 로 정합한지(#25),
        # 봉투 해제 계층이 서 있는지가 앞단 tsc 에 걸린다.
        run: npm run build
      - name: web · 기초자산 표기표 대조 — VERSION 과 S-04 가 갈리면 실패 (이슈 #219)
        id: web_table
        if: ${{ !cancelled() && steps.filter.outputs.web == 'true' && steps.web_build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys, pathlib

          VERSION = pathlib.Path("data/timeseries/VERSION")
          SCREEN  = pathlib.Path("web/src/pages/S04_Simulator.tsx")

          # ── 근거: data/timeseries/VERSION 의 series.<키>.label ──────────────
          # 이 파일이 P2 재현성의 근거라 기초자산이 늘거나 이름이 바뀌면 여기가 먼저 바뀐다.
          text = VERSION.read_text(encoding="utf-8")
          block = text.split("series:", 1)
          if len(block) != 2:
              print("::error::data/timeseries/VERSION 에 `series:` 블록이 없다. "
                    "형식이 바뀌었으면 이 검사도 같이 고친다 — 안 고치면 대조가 눈을 감는다.")
              sys.exit(1)
          truth = {}
          key = None
          for line in block[1].splitlines():
              m = re.match(r"^  ([A-Za-z0-9_]+):\s*$", line)
              if m:
                  key = m.group(1); continue
              m = re.match(r"^\s+label:\s*(.+?)\s*$", line)
              if m and key:
                  truth[key] = m.group(1)

          # ── 옮겨 적은 쪽: S04_Simulator.tsx 의 INDEX_LABEL ──────────────────
          src = SCREEN.read_text(encoding="utf-8")
          m = re.search(r"const INDEX_LABEL[^=]*=\s*\{(.*?)^\};", src, re.S | re.M)
          if not m:
              print("::error::S04_Simulator.tsx 에서 INDEX_LABEL 을 못 찾았다. "
                    "표를 옮기거나 이름을 바꿨으면 이 검사도 같이 고친다.")
              sys.exit(1)
          screen = dict(re.findall(r'([A-Za-z0-9_]+)\s*:\s*"([^"]*)"', m.group(1)))

          # 둘 다 비면 정규식이 헛돈 것이다. **조용히 통과시키지 않는다** — 같은 모양의
          # 결함이 PR #217 에서 실제로 났다(가드가 형식 변경과 함께 눈을 감았다).
          if not truth or not screen:
              print(f"::error::표를 못 읽었다 (VERSION {len(truth)}건 · 화면 {len(screen)}건). "
                    "형식이 바뀌었는지 확인한다.")
              sys.exit(1)

          # 접미어 `지수` 는 화면에서 뺀다 — `최저 EuroStoxx50 지수 70.5%` 가 문장 안에서
          # 겹쳐 읽히기 때문이고, 그 판단은 S04_Simulator.tsx 주석에 적혀 있다.
          def expected(label: str) -> str:
              return label[:-len(" 지수")] if label.endswith(" 지수") else label

          bad = []
          for k, label in sorted(truth.items()):
              want = expected(label)
              if k not in screen:
                  bad.append(f"{k}: 화면에 없다 (VERSION: {label!r} → {want!r})")
              elif screen[k] != want:
                  bad.append(f"{k}: 화면 {screen[k]!r} ≠ VERSION {want!r}")
          for k in sorted(set(screen) - set(truth)):
              bad.append(f"{k}: VERSION 에 없는 키가 화면에 있다 ({screen[k]!r})")

          print(f"VERSION {len(truth)}종 · 화면 {len(screen)}종")
          for k, label in sorted(truth.items()):
              print(f"  {k:14s} {label!r} → {expected(label)!r}")
          if bad:
              print("::error::기초자산 표기표가 근거와 갈렸다 (이슈 #219). "
                    "근거는 data/timeseries/VERSION 이고 화면이 따라간다.")
              for b in bad:
                  print(f"::error::{b}")
              sys.exit(1)
          print("표기표 일치")
          PY

      # ── 어느 모듈이 돌았는지 남긴다 ──────────────────────────────────────────
      - name: 실행 요약
        # ❗잡이 갈려 있을 때는 체크 목록에 `server · JUnit  skipping` 이 떠서 **어느 모듈이
        # 안 돌았는지가 그냥 보였다.** 한 잡이 되면 체크가 하나뿐이라 그 정보가 사라진다 —
        # 초록만 보고 "web 도 통과했다" 로 읽으면 안 되는데 구별이 안 된다. 그래서 요약에
        # 적는다. 이게 이 합치기에서 유일하게 **의도적으로 되사는** 성질이다.
        #
        # `!cancelled()` 라 실패한 실행에서도 남는다 — 오히려 그때 제일 필요하다.
        if: ${{ !cancelled() }}
        env:
          SERVER: ${{ steps.filter.outputs.server }}
          AI: ${{ steps.filter.outputs.ai_service }}
          WEB: ${{ steps.filter.outputs.web }}
          SERVER_TEST: ${{ steps.server_test.outcome }}
          SERVER_SKIP: ${{ steps.server_skip.outcome }}
          SERVER_SMOKE: ${{ steps.server_smoke.outcome }}
          AI_TEST: ${{ steps.ai_test.outcome }}
          AI_SKIP: ${{ steps.ai_skip.outcome }}
          WEB_BUILD: ${{ steps.web_build.outcome }}
          WEB_TABLE: ${{ steps.web_table.outcome }}
        run: |
          set -euo pipefail
          # 선택되지 않은 모듈과 실패한 모듈이 문면으로 갈려야 한다. `skipped` 를 그냥
          # 찍으면 "안 돌았다" 와 "앞 스텝이 실패해서 못 돌았다" 가 같아 보인다.
          mark() {   # $1=모듈 선택 여부  $2..=스텝 결과들
            local sel="$1"; shift
            [ "$sel" = "true" ] || { echo "⏭ 경로 필터에서 제외 — 이 PR 이 안 건드린다"; return; }
            for r in "$@"; do
              case "$r" in
                failure) echo "❌ 실패"; return ;;
                skipped) echo "⚠ 앞 스텝이 실패해 못 돌았다"; return ;;
              esac
            done
            echo "✅ 통과"
          }
          {
            echo "## 모듈별 결과"
            echo
            echo "| 모듈 | 결과 |"
            echo "|---|---|"
            echo "| server · JUnit + 스모크 | $(mark "$SERVER" "$SERVER_TEST" "$SERVER_SKIP" "$SERVER_SMOKE") |"
            echo "| ai-service · pytest | $(mark "$AI" "$AI_TEST" "$AI_SKIP") |"
            echo "| web · tsc + build + 표기표 | $(mark "$WEB" "$WEB_BUILD" "$WEB_TABLE") |"
            echo
            echo "경로 필터 근거는 \`.github/workflows/ci.yml\` 머리말 ② 다 — 파일 위치가 아니라"
            echo "**각 모듈이 실제로 읽는 경로**로 정한다."
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
