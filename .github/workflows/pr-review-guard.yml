name: PR 리뷰 확인

# 현재 org 플랜(free + private)에서는 브랜치 보호를 쓸 수 없어 머지를 강제로 막지 못한다.
# 이 워크플로는 승인이 덜 된 PR에 빨간 X를 띄워 실수 머지를 눈에 보이게 만드는 용도다.
#
# 판정 기준: **요청된 리뷰어가 전원 승인**해야 초록이다(승인 1건이 아니다).
# 1건으로 두면 초록이 "봐야 할 사람이 다 봤다"를 뜻하지 않는다 — 여러 사람의 결정이
# 섞인 PR에서 한 명만 승인해도 통과하고, 다른 사람 몫이 확인 없이 들어간다.
# 그 대신 리뷰어 지정이 장식이 아니라 게이트가 되므로, **꼭 봐야 할 사람만** 건다.
# Team 플랜으로 올리면 이 커밋 상태를 required status check으로 걸어 실제 차단이 된다.
#
# 판정 결과는 잡의 종료 코드가 아니라 `소유자 승인 여부` 커밋 상태로 낸다.
# 종료 코드로 내면 이벤트마다 별도 체크 런이 생겨 옛 실패가 덮이지 않는다 —
# PR 을 열 때 pull_request 로 돈 실패가 남고, 나중에 승인이 와서
# pull_request_review 로 성공해도 다른 체크라서 빨간 X 가 그대로 있었다.
# 새 커밋을 푸시해야만 사라졌다. 커밋 상태는 context 가 같으면 어떤 이벤트에서
# 왔든 덮어쓰므로 줄이 하나만 남고 승인 순간 빨강→초록으로 뒤집힌다.

# ❗집계와 상태 기록을 스텝으로 가른 이유 (이슈 #180)
#
# 한 스텝이었을 때는 `set -euo pipefail` 이라 **조회가 한 번 실패하면 상태를 쓰는
# 자리까지 못 갔다.** 그러면 사람이 보는 줄은 직전 값 그대로 선다 — 갱신에 실패했다는
# 사실이 화면에 아무 흔적도 남기지 않는다. 실제로 `#176` 에서 승인 직후 실행이
# `unexpected end of JSON input` 으로 죽어 03:03 의 빨강이 승인 뒤에도 그대로 서 있었다.
#
# 이번엔 *"가드는 빨강인데 실제로는 승인 완료"* 방향이라 결과가 무해했지만, 반대 방향이
# 위험하다 — 승인 철회(`DISMISSED`)나 새 변경요청 이벤트에서 같은 에러가 나면 **초록이
# 그대로 서 있고 아무도 모른다.** 브랜치 보호가 없어 그 초록이 머지를 막는 유일한
# 장치인데, 낡았다는 사실 자체가 안 보인다.
#
# 그래서 셋을 건다.
#
#   1. 조회를 세 번까지 다시 부른다      — 일시적 API 실패가 상태를 낡게 두지 않는다
#   2. 집계 스텝은 `continue-on-error`   — 죽어도 잡을 실패로 만들지 않는다(위 문단의
#                                          "덮이지 않는 옛 실패"가 돌아오면 안 된다)
#   3. 상태 기록은 `if: always()`        — 집계가 죽어도 줄은 반드시 갱신된다.
#                                          그때 `error` 를 써서 *"판정을 못 했다"* 와
#                                          *"승인이 부족하다"* 를 구별할 수 있게 한다
#
# 3번이 이 이슈의 본체다. 재시도(1번)는 빈도를 줄일 뿐이고, **실패가 조용하지 않게
# 만드는 것**은 상태를 반드시 쓰는 쪽이다.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: read
  statuses: write

concurrency:
  # 리뷰 이벤트가 몰릴 때 늦게 시작한 실행이 먼저 끝나 옛 결과로 상태를 덮으면 안 된다.
  group: pr-review-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  require-approval:
    name: 승인 집계
    runs-on: ubuntu-latest
    steps:
      - name: 승인 집계
        id: aggregate
        # ❗집계가 죽어도 잡은 성공으로 끝난다. 여기서 잡이 실패하면 이벤트마다 빨간
        # 체크 런이 생겨 덮이지 않는다 — 이 워크플로가 커밋 상태를 쓰는 이유가 그것이다.
        # 판정 불가는 아래 스텝이 `error` 상태로 전달한다.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          join() { printf '%s' "$(printf '%s\n' "$1" | sed '/^$/d' | sort -u | paste -sd ',' - | sed 's/,/, /g')"; }

          # GitHub API 는 이따금 빈 응답을 준다(이슈 #180 의 `unexpected end of JSON input`).
          # 한 번의 조회 실패로 상태 줄이 낡지 않도록 세 번까지 다시 부른다. 그래도 실패하면
          # 여기서 죽고, 위 continue-on-error 덕에 아래 스텝이 `error` 를 쓴다.
          gh_retry() {
            local attempt=1 out
            while :; do
              if out=$(gh "$@"); then
                # 명령치환이 이미 끝의 개행을 지웠다. **비어 있지 않을 때만** 하나를 되돌린다 —
                # 이 함수의 출력이 `{ ... }` 로 묶여 한 파일에 이어 붙는 자리가 있어서,
                # 개행을 안 붙이면 앞 호출의 마지막 줄과 뒤 호출의 첫 줄이 한 줄로 뭉친다.
                [ -z "$out" ] || printf '%s\n' "$out"
                return 0
              fi
              if [ "$attempt" -ge 3 ]; then
                # 워크플로 명령(`::error::`)은 **한 줄이어야** 한다. `$*` 를 쓰면 여러 줄짜리
                # --jq 인자가 통째로 들어가 주석이 첫 줄에서 끊긴다 — 부르는 쪽(`api`)과
                # 대상(`/repos/...`)만 적는다.
                echo "::error::gh $1 ${2-} — 3회 모두 실패했다" >&2
                return 1
              fi
              echo "::warning::gh $1 ${2-} 실패(${attempt}회) — $((attempt * 3))초 뒤 다시 시도한다" >&2
              sleep $((attempt * 3))
              attempt=$((attempt + 1))
            done
          }

          # 사용자별 최신 리뷰 상태. COMMENTED는 승인을 취소하지 않으므로 판정 대상에서 빼고
          # (APPROVED 뒤에 코멘트를 달아도 승인은 유지된다), 그 셋 중 가장 최근 것으로 본다.
          latest=$(gh_retry api "/repos/$REPO/pulls/$PR/reviews" --paginate --jq '
            [ .[] | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED") ]
            | group_by(.user.login)[]
            | max_by(.submitted_at)
            | "\(.user.login)\t\(.state)"
          ')
          approvers=$(printf '%s\n' "$latest" | awk -F'\t' '$2=="APPROVED"{print $1}')
          changes=$(printf '%s\n' "$latest" | awk -F'\t' '$2=="CHANGES_REQUESTED"{print $1}')

          # 요구 대상 = 리뷰 요청 중인 사람 ∪ 리뷰를 남긴 사람.
          #
          # reviewRequests 만 보면 안 된다 — GitHub은 리뷰를 제출하는 순간 그 사람을 요청
          # 목록에서 뺀다. 그래서 "코멘트만 달고 승인하지 않은 사람"이 어느 목록에도 안 남고
          # 조용히 통과한다. 리뷰를 남긴 사람도 요구 대상에 넣어야 그 구멍이 닫힌다.
          # (DISMISSED도 미승인으로 잡힌다 — 승인이 취소된 상태다.)
          requested=$(gh_retry pr view "$PR" --repo "$REPO" --json reviewRequests --jq '.reviewRequests[].login')
          reviewed=$(gh_retry api "/repos/$REPO/pulls/$PR/reviews" --paginate --jq '.[].user.login')
          required=$(printf '%s\n%s\n' "$requested" "$reviewed" | sed '/^$/d' | sort -u)
          missing=$(comm -23 <(printf '%s\n' "$required" | sed '/^$/d') \
                             <(printf '%s\n' "$approvers" | sed '/^$/d' | sort -u))

          echo "요구 대상: $(join "$required")"
          echo "승인: $(join "$approvers")"
          echo "변경 요청: $(join "$changes")"
          echo "미승인: $(join "$missing")"

          if [ -n "$(join "$changes")" ]; then
            state=failure
            desc="변경 요청이 해소되지 않았습니다 ($(join "$changes")). 머지하지 마세요."
          elif [ -z "$(join "$approvers")" ]; then
            # 리뷰어를 아무도 안 걸면 요구 대상이 비어 "전원 승인"이 공허하게 참이 된다.
            # 이 가드가 그 구멍을 막는다.
            state=failure
            desc="승인이 0건입니다. CODEOWNERS 기준 소유자 리뷰 후 머지하세요."
          elif [ -n "$(join "$missing")" ]; then
            state=failure
            desc="아직 승인하지 않은 리뷰어가 있습니다 ($(join "$missing")). 전원 승인이 필요합니다."
          else
            state=success
            desc="전원 승인 확인 — $(join "$approvers")"
          fi

          # description 은 140자 제한이 있다. **바이트가 아니라 글자로 자른다** —
          # `cut -c` 는 GNU 구현에서 바이트 단위라 한글 중간을 끊어 깨진 UTF-8 을 만들고,
          # 그러면 아래 POST 가 거절당해 **상태를 못 쓴 채 죽는다.** 이 이슈가 고치려는
          # 실패 방식이 정확히 그것이라 같이 막는다. 지금은 리뷰어 4명에 137바이트로
          # 한계에 붙어 있어 이름이 하나만 길어져도 닿는다.
          desc="${desc:0:140}"
          echo "::notice::$desc"

          {
            echo "state=$state"
            echo "desc<<GUARD_DESC_EOF"
            echo "$desc"
            echo "GUARD_DESC_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 커밋 상태 기록
        # ❗집계가 죽어도 반드시 돈다. 이 스텝이 안 돌면 사람이 보는 줄이 **직전 값 그대로**
        # 선다 — 그게 이슈 #180 이다.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATE: ${{ steps.aggregate.outputs.state }}
          DESC: ${{ steps.aggregate.outputs.desc }}
        run: |
          set -euo pipefail

          # 집계가 값을 못 남겼다 = 판정을 못 했다. `failure` 로 쓰지 않는다 —
          # 그러면 "승인이 부족하다"와 구별이 안 되고, 사람이 승인을 더 받으러 간다.
          # `error` 는 화면에서 빨강이지만 문면이 다르다.
          state="${STATE:-error}"
          desc="${DESC:-}"
          if [ "$state" = "error" ] || [ -z "$desc" ]; then
            state=error
            desc="승인 집계에 실패했습니다 — 판정 없음. 실행 로그를 보고 다시 돌리세요."
          fi
          desc="${desc:0:140}"

          # context 가 같은 상태는 서로를 덮어쓴다 — 이벤트가 달라도 줄은 하나만 남는다.
          #
          # 여기서도 재시도한다. 그래도 실패하면 **잡을 실패시킨다** — 상태를 못 쓴 이상
          # 남길 통로가 잡의 빨강밖에 없다. 위 집계 실패와 취급이 다른 이유가 이것이다:
          # 거기는 대신 말해 줄 자리(이 스텝)가 있고, 여기는 없다.
          attempt=1
          while :; do
            if gh api --method POST "/repos/$REPO/statuses/$SHA" \
                 -f state="$state" \
                 -f context="소유자 승인 여부" \
                 -f description="$desc" \
                 -f target_url="$RUN_URL" >/dev/null; then
              echo "커밋 상태 기록: $state — $desc"
              break
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "::error::커밋 상태를 3회 모두 못 썼다 — 이 잡의 실패가 유일한 신호다" >&2
              exit 1
            fi
            echo "::warning::커밋 상태 기록 실패(${attempt}회) — $((attempt * 3))초 뒤 다시 시도한다" >&2
            sleep $((attempt * 3))
            attempt=$((attempt + 1))
          done
