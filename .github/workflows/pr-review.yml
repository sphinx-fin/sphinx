name: PR 리뷰

# `pr-review-guard.yml` · `pr-reviewer-label.yml` · `pr-author-assignee.yml` **셋을 합친 것**이다
# (이슈 #276 2번). 합친 이유가 둘인데, 분(分)보다 뒤엣것이 크다.
#
# ① **올림 과금이 잡 개수에 비례한다.** GitHub 은 잡 단위로 1분 미만을 1분으로 올림한다.
#    셋 다 실측 4초짜리인데 각각 1분씩 나갔다 — 실측 12.9분에 과금 119분(#276).
#
# ② ❗**같은 판정을 두 파일이 각자 구현하면 어긋난다.** CLAUDE.md 가 이걸 두 번 경고하고
#    실제로 네 번 났다(#90·#91 · #135/#140 · #180). 다섯 번째가 이미 와 있었다 —
#    가드는 판정 입력으로 `reviewRequests` 를 쓰면서 그 값이 바뀌는 이벤트
#    (`review_requested`·`review_request_removed`)를 **안 들었다.** 그래서 초록인 PR 에
#    리뷰어를 새로 붙이면 **라벨은 `리뷰대기:` 로 바뀌는데 가드는 초록인 채로 남았다.**
#    `#180` 절이 적은 *"낡은 초록이 머지를 열어 뒀을 것이다"* 가 그 모양이다.
#
# **한 잡·한 계산이면 ②는 구조적으로 못 난다.** 아래 `판정` 스텝이 사실을 한 번만 만들고,
# 커밋 상태와 라벨이 **그 하나를 각자 표현**한다. 두 표현이 갈릴 자리가 없다.

# ❗트리거는 **라벨 쪽 8종 합집합**이다 — 가드 쪽 4종으로 맞추면 안 된다.
#
# 4종으로 좁히면 `review_requested` 를 다시 잃어 ②가 그대로 돌아오고, 라벨은 눌어붙는다
# (#135/#140 이 그거였다). 넓은 쪽으로 맞추는 것이 두 문제를 같이 푸는 방향이다.
#
# `synchronize` 는 라벨을 바꾸는 사건이 아니라 **복구 경로**다(#135). PR 이 충돌 상태이면
# `pull_request_review` 가 통째로 유실되는데, 다음 푸시에 아래 계산이 timeline·reviews 를
# 새로 읽어 스스로 낫는다. 그래서 재실행이 언제나 안전하고, 결과가 같으면 API 쓰기가
# 한 건도 안 나간다.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - review_requested
      - review_request_removed
      - closed
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: write   # 라벨·담당자
  issues: write          # 라벨이 저장소에 없을 때 생성 (라벨은 저장소 리소스다)
  statuses: write        # 커밋 상태

concurrency:
  # 리뷰 이벤트가 몰릴 때 늦게 시작한 실행이 먼저 끝나 옛 결과로 덮으면 안 된다.
  # 취소하지 않고 줄을 세운다 — 마지막 실행이 마지막 사실을 쓴다.
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    name: PR 리뷰 상태
    runs-on: ubuntu-latest
    steps:
      # ── ❶ 사실을 한 번만 만든다 ─────────────────────────────────────────────
      - name: 판정
        id: verdict
        # ❗판정이 죽어도 잡은 여기서 멈추지 않는다. 잡을 실패시키면 이벤트마다 빨간 체크
        # 런이 생겨 옛 실패가 덮이지 않는다 — 가드가 종료 코드가 아니라 **커밋 상태**로
        # 말하는 이유가 그것이다(아래 ❷). 판정 불가는 ❷가 `error` 로 전달한다.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_STATE: ${{ github.event.pull_request.state }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          TMP="${RUNNER_TEMP:-/tmp}"

          join() { printf '%s' "$(printf '%s\n' "$1" | sed '/^$/d' | sort -u | paste -sd ',' - | sed 's/,/, /g')"; }

          # GitHub API 는 이따금 빈 응답을 준다(#180 의 `unexpected end of JSON input`).
          # 한 번의 조회 실패로 상태 줄이 낡지 않도록 세 번까지 다시 부른다. 그래도 실패하면
          # 여기서 죽고, 위 continue-on-error 덕에 ❷가 `error` 를 쓴다.
          gh_retry() {
            local attempt=1 out
            while :; do
              if out=$(gh "$@"); then
                # 명령치환이 이미 끝의 개행을 지웠다. **비어 있지 않을 때만** 하나를 되돌린다.
                [ -z "$out" ] || printf '%s\n' "$out"
                return 0
              fi
              if [ "$attempt" -ge 3 ]; then
                # 워크플로 명령(`::error::`)은 **한 줄이어야** 한다. `$*` 를 쓰면 여러 줄짜리
                # --jq 인자가 통째로 들어가 주석이 첫 줄에서 끊긴다.
                echo "::error::gh $1 ${2-} — 3회 모두 실패했다" >&2
                return 1
              fi
              echo "::warning::gh $1 ${2-} 실패(${attempt}회) — $((attempt * 3))초 뒤 다시 시도한다" >&2
              sleep $((attempt * 3))
              attempt=$((attempt + 1))
            done
          }

          # GitHub 로그인 → 표시 이름. CODEOWNERS 가 로그인으로만 쓰므로 여기서 한 번 옮긴다.
          # 팀원이 바뀌면 .github/CODEOWNERS 와 이 표를 같이 고친다.
          name_of() {
            case "$1" in
              gitIt-sehyeon) echo "정세현" ;;
              hd0rable)      echo "강희진" ;;
              yoonjiseok)    echo "윤지석" ;;
              junseo2323)    echo "오준서" ;;
              *)             echo "$1" ;;   # 모르는 계정은 로그인 그대로 — 조용히 빠지는 것보다 낫다
            esac
          }

          # ── 읽기는 두 번뿐이다. 아래 모든 판단이 이 둘에서만 나온다 ──────────────
          #
          # `reviews` 는 COMMENTED 까지 **전부** 받는다. 승인 유효성에는 안 쓰지만
          # *"뭔가 내긴 냈다"*(= 리뷰중)를 가르는 데 필요하다.
          reviews=$(gh_retry api "/repos/$REPO/pulls/$PR/reviews" --paginate \
                      --jq '.[] | [.user.login, .state, .submitted_at] | @tsv')
          rr=$(gh_retry pr view "$PR" --repo "$REPO" --json reviewRequests)

          requested=$(printf '%s' "$rr" | jq -r '.reviewRequests[]? | select(.login != null) | .login')

          # 팀 배정은 판정하지 않는다 — 팀의 "전원 승인" 을 셀 방법이 없다. 이 레포는
          # CODEOWNERS 가 전부 개인 로그인이고 팀 요청 이력이 0건이라 지금은 안 걸린다.
          # 걸리면 조용히 빠지는 대신 경고로 드러낸다.
          teams=$(printf '%s' "$rr" | jq -r '.reviewRequests[]? | select(.login == null) | (.slug // .name // "?")')
          if [ -n "$(printf '%s' "$teams" | tr -d "[:space:]")" ]; then
            echo "::warning::팀 리뷰 요청은 판정 대상이 아니다 — $(join "$teams")"
          fi

          # 사용자별 최신 **유효** 상태. COMMENTED 는 승인을 취소하지 않으므로 유효 상태
          # 계산에서 뺀다(APPROVED 뒤에 코멘트를 달아도 승인은 유지된다). `submitted_at` 은
          # ISO8601 이라 문자열 비교가 곧 시간 비교다.
          printf '%s\n' "$reviews" | awk -F'\t' '
            $1 != "" {
              submitted[$1] = 1
              if ($2 == "APPROVED" || $2 == "CHANGES_REQUESTED" || $2 == "DISMISSED")
                if ($3 > t[$1]) { t[$1] = $3; eff[$1] = $2 }
            }
            END {
              for (u in submitted) print "SUBMITTED\t" u
              for (u in eff)       print "EFF\t" u "\t" eff[u]
            }
          ' > "$TMP/rev"

          submitted=$(awk -F'\t' '$1=="SUBMITTED"{print $2}'                "$TMP/rev" | sort -u)
          approvers=$(awk -F'\t' '$1=="EFF" && $3=="APPROVED"{print $2}'    "$TMP/rev" | sort -u)
          changes=$(awk  -F'\t' '$1=="EFF" && $3=="CHANGES_REQUESTED"{print $2}' "$TMP/rev" | sort -u)

          # 요구 대상 = 리뷰 요청 중인 사람 ∪ 리뷰를 남긴 사람.
          #
          # `reviewRequests` 만 보면 안 된다 — GitHub 은 리뷰를 제출하는 순간 그 사람을 요청
          # 목록에서 뺀다. 그래서 "코멘트만 달고 승인하지 않은 사람"이 어느 목록에도 안 남고
          # 조용히 통과한다. 리뷰를 남긴 사람도 넣어야 그 구멍이 닫힌다.
          # (DISMISSED 도 미승인으로 잡힌다 — 승인이 취소된 상태다.)
          required=$(printf '%s\n%s\n' "$requested" "$submitted" | sed '/^$/d' | sort -u)
          missing=$(comm -23 <(printf '%s\n' "$required"  | sed '/^$/d') \
                             <(printf '%s\n' "$approvers" | sed '/^$/d'))

          echo "요구 대상: $(join "$required")"
          echo "승인: $(join "$approvers")"
          echo "변경 요청: $(join "$changes")"
          echo "미승인: $(join "$missing")"

          # ── 표현 ①: 커밋 상태 ────────────────────────────────────────────────
          if [ -n "$(join "$changes")" ]; then
            state=failure
            desc="변경 요청이 해소되지 않았습니다 ($(join "$changes")). 머지하지 마세요."
          elif [ -z "$(join "$approvers")" ]; then
            # 리뷰어를 아무도 안 걸면 요구 대상이 비어 "전원 승인"이 공허하게 참이 된다.
            state=failure
            desc="승인이 0건입니다. CODEOWNERS 기준 소유자 리뷰 후 머지하세요."
          elif [ -n "$(join "$missing")" ]; then
            state=failure
            desc="아직 승인하지 않은 리뷰어가 있습니다 ($(join "$missing")). 전원 승인이 필요합니다."
          else
            state=success
            desc="전원 승인 확인 — $(join "$approvers")"
          fi

          # description 은 140자 제한이다. **바이트가 아니라 글자로 자른다** — `cut -c` 는
          # GNU 구현에서 바이트 단위라 한글 중간을 끊어 깨진 UTF-8 을 만들고, 그러면 POST 가
          # 거절당해 **상태를 못 쓴 채 죽는다.** 리뷰어 4명에 137바이트라 한계에 붙어 있다.
          desc="${desc:0:140}"
          echo "::notice::$desc"

          # ── 표현 ②: 라벨 ─────────────────────────────────────────────────────
          #
          # 행동이 필요한 상태에만 붙인다. 종착역(전원 승인)에 라벨을 두면 떼는 사건이 없어
          # 영원히 눌어붙는다 — 완료는 위 커밋 상태의 초록이 이미 말한다.
          : > "$TMP/want"
          if [ "$PR_STATE" != "closed" ] && [ "$IS_DRAFT" != "true" ]; then
            if [ -z "$(printf '%s' "$required" | tr -d '[:space:]')" ]; then
              echo "리뷰어 미배정" > "$TMP/want"
            else
              while IFS= read -r u; do
                [ -n "$u" ] || continue
                if printf '%s\n' "$approvers" | grep -qxF "$u"; then
                  continue                                   # 승인이 유효하다 — 라벨 없음
                fi
                if printf '%s\n' "$submitted" | grep -qxF "$u"; then
                  printf '리뷰중: %s\n'   "$(name_of "$u")"  # 뭔가 냈지만 승인은 아니다
                else
                  printf '리뷰대기: %s\n' "$(name_of "$u")"  # 아직 아무것도 안 냈다
                fi
              done <<< "$required" | sort -u > "$TMP/want"
            fi
          fi
          echo "목표 라벨: $(paste -sd', ' "$TMP/want" || true)"

          {
            echo "state=$state"
            echo "desc<<VERDICT_DESC_EOF"
            echo "$desc"
            echo "VERDICT_DESC_EOF"
          } >> "$GITHUB_OUTPUT"

          # ❗**맨 마지막에 찍는다.** 이 파일이 있어야 판정이 끝까지 갔다는 뜻이다.
          # 라벨 스텝은 이게 없으면 아무것도 안 건드린다 — 판정이 중간에 죽은 채로
          # `want` 가 비어 있으면, 라벨을 다 떼는 것이 **"전원 승인했다"** 로 읽힌다.
          : > "$TMP/verdict_ok"

      # ── ❷ 커밋 상태 — 라벨보다 **먼저** 쓴다 ────────────────────────────────
      #
      # ❗순서가 설계다. 라벨 쪽이 죽어도 이 줄은 이미 쓰여 있다. `#180` 이 요구한
      # *"집계가 죽어도 줄은 반드시 갱신된다"* 를 한 잡 안에서 유지하는 방법이다.
      #
      # 판정 결과를 잡의 종료 코드가 아니라 커밋 상태로 내는 이유: 종료 코드로 내면
      # 이벤트마다 별도 체크 런이 생겨 **옛 실패가 안 덮인다.** 커밋 상태는 context 가
      # 같으면 어떤 이벤트에서 왔든 덮어써서 줄이 하나만 남고 승인 순간 뒤집힌다.
      - name: 커밋 상태 기록
        if: ${{ always() && github.event.pull_request.state != 'closed' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATE: ${{ steps.verdict.outputs.state }}
          DESC: ${{ steps.verdict.outputs.desc }}
        run: |
          set -euo pipefail

          # 판정이 값을 못 남겼다 = 판정을 못 했다. `failure` 로 쓰지 않는다 — 그러면
          # "승인이 부족하다"와 구별이 안 되고, 사람이 승인을 더 받으러 간다. `error` 는
          # 화면에서 빨강이지만 문면이 다르다: **워크플로를 다시 돌리라**는 뜻이다.
          state="${STATE:-error}"
          desc="${DESC:-}"
          if [ "$state" = "error" ] || [ -z "$desc" ]; then
            state=error
            desc="승인 집계에 실패했습니다 — 판정 없음. 실행 로그를 보고 다시 돌리세요."
          fi
          desc="${desc:0:140}"

          # 여기서도 재시도한다. 그래도 실패하면 **잡을 실패시킨다** — 상태를 못 쓴 이상
          # 남길 통로가 잡의 빨강밖에 없다. ❶과 취급이 다른 이유가 이것이다: 거기는 대신
          # 말해 줄 자리(이 스텝)가 있고, 여기는 없다.
          attempt=1
          while :; do
            if gh api --method POST "/repos/$REPO/statuses/$SHA" \
                 -f state="$state" \
                 -f context="소유자 승인 여부" \
                 -f description="$desc" \
                 -f target_url="$RUN_URL" >/dev/null; then
              echo "커밋 상태 기록: $state — $desc"
              break
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "::error::커밋 상태를 3회 모두 못 썼다 — 이 잡의 실패가 유일한 신호다" >&2
              exit 1
            fi
            echo "::warning::커밋 상태 기록 실패(${attempt}회) — $((attempt * 3))초 뒤 다시 시도한다" >&2
            sleep $((attempt * 3))
            attempt=$((attempt + 1))
          done

      # ── ❸ 라벨 — ❷가 끝난 뒤에만 손댄다 ────────────────────────────────────
      - name: 라벨 동기화
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          TMP="${RUNNER_TEMP:-/tmp}"

          # ❗판정이 끝까지 못 갔으면 **아무것도 안 건드린다.**
          #
          # 라벨에는 가드의 `error` 같은 세 번째 값이 없다 — 붙였다 떼는 것으로만 말한다.
          # 그래서 판정 실패를 라벨로 표현할 방법이 없고, 억지로 표현하면(= 빈 목표로
          # 다 떼면) 그건 **"전원 승인했다"** 로 읽힌다. 정확히 반대 뜻이다.
          # 낡은 라벨을 그대로 두고 물러난다. 어긋나 보이면 참인 쪽은 커밋 상태다.
          if [ ! -f "$TMP/verdict_ok" ]; then
            echo "::warning::판정이 끝나지 않았다 — 라벨을 건드리지 않는다. 커밋 상태를 본다"
            exit 0
          fi

          # 이 워크플로가 관리하는 라벨만 건드린다. 나머지 라벨은 손대지 않는다.
          gh pr view "$PR" --repo "$REPO" --json labels --jq '
            .labels[].name
            | select(startswith("리뷰대기: ") or startswith("리뷰중: ") or . == "리뷰어 미배정")
          ' | sort -u > "$TMP/have"

          echo "목표: $(paste -sd', ' "$TMP/want" || true)"
          echo "현재: $(paste -sd', ' "$TMP/have" || true)"

          color_of() {
            case "$1" in
              "리뷰어 미배정") echo "9E9E9E" ;;
              리뷰중:*)        echo "F29513" ;;
              *)               echo "FBCA04" ;;
            esac
          }

          # 더 이상 맞지 않는 라벨을 뗀다.
          comm -13 "$TMP/want" "$TMP/have" | while IFS= read -r l; do
            [ -n "$l" ] || continue
            echo "제거: $l"
            gh pr edit "$PR" --repo "$REPO" --remove-label "$l" >/dev/null
          done

          # 새로 맞게 된 라벨을 붙인다. 라벨이 저장소에 없으면 만들고 진행한다.
          comm -23 "$TMP/want" "$TMP/have" | while IFS= read -r l; do
            [ -n "$l" ] || continue
            echo "추가: $l"
            gh label create "$l" --repo "$REPO" --color "$(color_of "$l")" >/dev/null 2>&1 || true
            gh pr edit "$PR" --repo "$REPO" --add-label "$l" >/dev/null
          done

      # ── ❹ 담당자 — 판정과 무관하다. 열릴 때만 ──────────────────────────────
      #
      # 담당자는 "이 PR 을 끝까지 끌고 갈 사람"이고 리뷰어와 다르다. 손으로 붙이는
      # 규칙이었는데 닫힌 PR 20건 중 7건이 비어 있었다 — 빈 담당자는 목록에서 "누구
      # 것인지"를 지워, 막힌 PR 을 누가 풀어야 하는지 안 보이게 한다.
      #
      # `always()` 를 붙여 앞 스텝이 죽어도 돈다. 판정 결과에 안 걸리는 일이라 앞이
      # 실패했다고 같이 빠질 이유가 없다.
      - name: 작성자를 담당자로
        if: ${{ always() && (github.event.action == 'opened' || github.event.action == 'reopened') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          # 이미 담당자가 있으면 손대지 않는다. 일부러 다른 사람에게 넘긴 PR 을
          # 작성자로 되돌리면 안 된다.
          count=$(gh pr view "$PR" --repo "$REPO" --json assignees --jq '.assignees | length')
          if [ "$count" -gt 0 ]; then
            echo "::notice::이미 담당자가 있다 — 건드리지 않는다"
            exit 0
          fi

          # 저장소 협업자가 아니면 담당자로 지정할 수 없다. 그때는 경고만 남기고
          # 워크플로를 실패시키지 않는다 — 담당자 지정은 편의지 관문이 아니다.
          if gh pr edit "$PR" --repo "$REPO" --add-assignee "$AUTHOR" >/dev/null 2>&1; then
            echo "::notice::담당자 지정 — $AUTHOR"
          else
            echo "::warning::담당자 지정 실패 — $AUTHOR (저장소 협업자가 아닐 수 있다)"
          fi
