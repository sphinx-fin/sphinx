# 오해 패턴 라이브러리 v1 (소유: 정세현 / 매칭 엔진: 윤지석)
# products 값은 contracts/parsed_document.schema.json 의 product_type enum 을 따른다
# (ELS·VARIABLE_INSURANCE). ALL 은 enum 값이 아니라 전체 상품 와일드카드다.
#
# ── source 는 "왜 이 발화가 오해인가"의 근거다 ────────────────────────────────
#
# apply_misconception_floor 가 이 라이브러리 매칭만으로 U4(오해)를 확정하고, GateEngine 이
# U4 를 RED 로 받는다. 즉 여기 한 줄이 판매 차단으로 직결된다. 근거를 적지 않으면 심사에서
# "왜 이 문장이 오해인가"에 답할 수 없다.
#
# type 은 misconception.SOURCE_TYPES 를 따른다. 알 수 없는 값은 로딩 시점에 터진다.
#
#   dispute_case      금융감독원 분쟁조정례
#   inspection        검사결과·제재 발표자료
#   proposal_example  기획서가 오해로 제시한 발화 예시
#
# 기획서 5절은 *"실제로 분쟁까지 간 오해만 라이브러리에 들어간다. 근거가 조정례와
# 검사결과라는 뜻이다"* 라고 못박는다. 따라서 proposal_example 은 **잠정 상태**다 —
# 판정의 타당성은 기획서 본문이 뒷받침하지만 인용 가능한 1차 출처가 아니다.
#
# 현재 8종 중 7종이 proposal_example, 1종(M07)이 근거 미확보다. 조정례·검사결과를 확보하는
# 대로 dispute_case / inspection 으로 승급한다. 승급 여부는 types_without_citable_source()
# 와 SourceRef.is_dispute_grounded 로 확인한다.
#
# quote 는 로더가 읽지 않는다(SourceRef 는 type·ref 만 받는다). 근거 문면을 파일 안에
# 남겨 두려는 것이고, 승급 시 조정례 원문 인용으로 교체한다 — 번호만 적으면 잘못 붙였을 때
# 대조할 수단이 없다.
#
# ── version 정책 (PR #21 에서 확정) ──────────────────────────────────────────
#
# **match() 의 출력이 달라질 수 있는 변경이면 올린다.** 아니면 올리지 않는다.
#
#   올린다      patterns 추가·수정·삭제, 유형 추가·삭제, products 변경, escalate 변경
#   안 올린다   source / label / 주석 — 판정은 그대로다
#
# 기준이 "무엇을 고쳤나"가 아니라 "판정이 달라질 수 있나"인 이유는, 이 번호의 용도가
# 감사 시점에 **어느 라이브러리가 그 U4 를 냈는지 되짚는 것**이기 때문이다. 판정이 같은
# 변경까지 올리면 번호가 흔해져서 되짚는 데 못 쓴다. 반대로 패턴을 고치고 안 올리면 같은
# 번호가 서로 다른 판정을 낸 기록이 남는다 — 그쪽이 더 나쁘다.
#
# 이 정책대로면 #17(source 구조화)은 올리지 않는 게 맞았고, 이 PR(M04 패턴)은 올린다.
# @yoonjiseok 이 Judgment 에 library_version 을 싣기로 했다(#21 회신 3번). 그게 붙으면
# 이 번호가 실제로 판정마다 기록된다.
version: 2
types:
  - id: M01-PRINCIPAL-GUARANTEE
    label: 원금보장 오인
    patterns: ["은행에서 파니까 원금은 보장", "원금은 지켜지는"]
    products: [ELS, VARIABLE_INSURANCE]
    source:
      type: proposal_example
      ref: "docs/proposal.md 4절 [핵심 엔진] 157행"
      quote: "은행에서 파니까 원금은 보장되겠지"
  - id: M02-DEPOSIT-INSURANCE
    label: 예금자보호 오인
    patterns: ["예금자보호 되는 줄"]
    products: [ELS, VARIABLE_INSURANCE]
    source:
      type: proposal_example
      ref: "docs/proposal.md 4절 [핵심 엔진] 158행"
      quote: "예금자보호 되는 줄 알았다"
  - id: M03-PROBABILITY
    label: 확률 오인
    patterns: ["반토막 날 리가"]
    products: [ELS]
    source:
      type: proposal_example
      ref: "docs/proposal.md 4절 [핵심 엔진] 159행"
      quote: "지수가 반토막 날 리가 있나"
  - id: M04-EARLY-REDEMPTION
    label: 조기상환 구조 오인
    # 두 번째 패턴은 기획서 4절 대화 예시(154행)에서 왔다. 기존 패턴만으로는 그 발화가
    # 포함도 0.308(임계 0.62)로 미매칭이어서, 등급은 LLM 이 U4 로 맞히지만
    # misconception_type 이 비고 미분류 후보 큐로 갔다 (PR #10 dev set 유일 FAIL).
    #
    # 조각("3년 뒤에 이자 붙어서 나오는")이 아니라 문장 전체를 넣는다. 조각은 같은 항목
    # (ELS-EARLY-REDEMPTION-CONDITION)의 **정답 발화**까지 잡는다 — "조건을 못 맞추면
    # 3년 뒤에 이자 붙어서 나오는 거고, 낙인 깨지면 손실이죠" 가 score 1.000 stage=pattern
    # 이 되고, 그 항목 루브릭의 related_misconceptions 에 M04 가 있어 floor 가 U1 을 U4 로
    # 확정한다. 부정형("...나오는 게 아니라 6개월마다")도 같다. 부분 문자열 매칭이라
    # 부정·조건절을 못 본다. stage=pattern 1.000 은 LLM 이 되돌릴 수 없는 확정 경로다.
    #
    # 문장 전체는 위 두 정답 발화를 후보 큐로만 보낸다(설계된 연성 경로). 대가는 어미 변형
    # ("3년 후에 이자까지 붙어서 나온다는 거", 조각 0.545 → 전체 0.333)을 놓치는 것인데,
    # 변형 커버는 3단계(임베딩) 몫이다 — 패턴 단계는 결정론이 값이다.
    patterns:
      - "만기 3년이면 3년 뒤에 원금과 이자"
      - "은행에서 파는 거니까 3년 뒤에 이자 붙어서 나오는 거죠"
    products: [ELS]
    source:
      type: proposal_example
      ref: "docs/proposal.md 4절 [핵심 엔진] 160행(오해 목록), 154행(대화 예시)"
      quote: "만기 3년이면 3년 뒤에 원금과 이자 / 은행에서 파는 거니까 3년 뒤에 이자 붙어서 나오는 거죠"
  - id: M05-SAVINGS
    label: 저축성 오인
    patterns: ["저축인 줄"]
    products: [VARIABLE_INSURANCE]
    source:
      type: proposal_example
      ref: "docs/proposal.md 4절 [핵심 엔진] 161행"
      quote: "저축인 줄 알았다"
  - id: M06-SURRENDER-VALUE
    label: 해지환급금 오인
    patterns: ["낸 돈은 다 돌려받는"]
    products: [VARIABLE_INSURANCE]
    source:
      type: proposal_example
      ref: "docs/proposal.md 4절 [핵심 엔진] 162행"
      quote: "낸 돈은 다 돌려받는 거죠"
  - id: M07-YIELD-OVERCONFIDENCE
    label: 수익률 과신
    patterns: ["제시 수익률이 확정"]
    products: [ELS, VARIABLE_INSURANCE]
    # 8종 중 유일하게 기획서 오해 목록(157~163행)에 대응하는 줄이 없다. 가장 가까운 것은
    # 109행 "상품 구조 대신 제시 수익률만 보고 가입하는 패턴이 동일하게 관측된다" 인데
    # 그건 2순위 대상 고객층 서술이고 오해 유형으로 세운 것이 아니다.
    # 근거를 확보하면 승급하고, 안 나오면 라이브러리에서 뺀다 — 근거 없는 유형을 남겨두면
    # floor 가 그걸로 U4 를 확정한다.
    source:
      ref: "TODO 근거 미확보 — 기획서 오해 목록에 대응 항목 없음"
  - id: M08-TYING
    label: 꺾기(불공정영업) 신호
    patterns: ["대출받으려면 이것도 들어야"]
    products: [ALL]
    escalate: compliance      # F-GTE-003 즉시 알림, 판매자 화면 비노출
    source:
      type: proposal_example
      ref: "docs/proposal.md 4절 [핵심 엔진] 163행"
      quote: "대출받으려면 이것도 들어야 한다길래"
