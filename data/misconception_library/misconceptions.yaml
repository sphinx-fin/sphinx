# 오해 패턴 라이브러리 v1 (소유: 정세현 / 매칭 엔진: 윤지석)
# products 값은 contracts/parsed_document.schema.json 의 product_type enum 을 따른다
# (ELS·VARIABLE_INSURANCE). ALL 은 enum 값이 아니라 전체 상품 와일드카드다.
#
# ── source 는 "왜 이 발화가 오해인가"의 근거다 ────────────────────────────────
#
# apply_misconception_floor 가 이 라이브러리 매칭만으로 U4(오해)를 확정하고, GateEngine 이
# U4 를 RED 로 받는다. 즉 여기 한 줄이 판매 차단으로 직결된다. 근거를 적지 않으면 심사에서
# "왜 이 문장이 오해인가"에 답할 수 없다.
#
# type 은 misconception.SOURCE_TYPES 를 따른다. 알 수 없는 값은 로딩 시점에 터진다.
#
#   dispute_case      금융감독원 분쟁조정례
#   inspection        검사결과·제재 발표자료
#   proposal_example  기획서가 오해로 제시한 발화 예시
#   product_document  상품문서(간이투자설명서 등)의 조항 — 그 문면이 오해를 정면으로 반박한다
#
# 기획서 5절은 *"실제로 분쟁까지 간 오해만 라이브러리에 들어간다. 근거가 조정례와
# 검사결과라는 뜻이다"* 라고 못박는다. 따라서 proposal_example 은 **잠정 상태**다 —
# 판정의 타당성은 기획서 본문이 뒷받침하지만 인용 가능한 1차 출처가 아니다.
#
# 현재 9종 중 3종(M01·M02·M03)이 dispute_case, 4종(M04·M05·M06·M08)이 proposal_example,
# 2종(M09·M10)이 product_document 다.
# 승급 여부는 types_without_citable_source() 와 SourceRef.is_dispute_grounded 로 확인한다.
#
# ── 근거 수집 결과 (2026-08-25) ─────────────────────────────────────────────
#
# 금감원 분쟁조정사례 DB(fss.or.kr, 전체 814건)를 제목 기준으로 전수 확인했다.
#
#   ELS·파생결합 계열 8건 존재 — 제2010-97·96·73·28·27호, 제2009-93호(ELF 손익구조
#     설명불충분), 제2016-19호(DLS), DLF 불완전판매 손해배상비율 산정기준(2020.1.15)
#   변액보험 0건 — "변액"·"해지환급금"·"저축성"으로 전수 대조. M05·M06 은 이 경로로는
#     근거가 안 나온다
#   꺾기·구속성 0건 — M08 은 조정례가 아니라 검사·제재 자료로 가야 한다
#
# ELS 8건의 본문은 전부 .hwp 첨부라 자동 파싱이 안 된다. 그래서 이번에는 **PDF 로 공개된
# 홍콩 H지수 ELS 보도자료 2건**(data/dispute_cases/)에서 인용했다. hwp 를 열어보면
# M04 는 제2009-93호로 승급할 여지가 있다.
#
# quote 는 로더가 읽지 않는다(SourceRef 는 type·ref 만 받는다). 근거 문면을 파일 안에
# 남겨 두려는 것이고, 승급 시 조정례 원문 인용으로 교체한다 — 번호만 적으면 잘못 붙였을 때
# 대조할 수단이 없다.
#
# ── version 정책 (PR #21 에서 확정) ──────────────────────────────────────────
#
# **match() 의 출력이 달라질 수 있는 변경이면 올린다.** 아니면 올리지 않는다.
#
#   올린다      patterns 추가·수정·삭제, 유형 추가·삭제, products 변경, escalate 변경
#   안 올린다   source / label / 주석 — 판정은 그대로다
#
# 기준이 "무엇을 고쳤나"가 아니라 "판정이 달라질 수 있나"인 이유는, 이 번호의 용도가
# 감사 시점에 **어느 라이브러리가 그 U4 를 냈는지 되짚는 것**이기 때문이다. 판정이 같은
# 변경까지 올리면 번호가 흔해져서 되짚는 데 못 쓴다. 반대로 패턴을 고치고 안 올리면 같은
# 번호가 서로 다른 판정을 낸 기록이 남는다 — 그쪽이 더 나쁘다.
#
# 이 정책대로면 #17(source 구조화)은 올리지 않는 게 맞았고, 이 PR(M04 패턴)은 올린다.
# @yoonjiseok 이 Judgment 에 library_version 을 싣기로 했다(#21 회신 3번). 그게 붙으면
# 이 번호가 실제로 판정마다 기록된다.
version: 5
types:
  - id: M01-PRINCIPAL-GUARANTEE
    label: 원금보장 오인
    patterns: ["은행에서 파니까 원금은 보장", "원금은 지켜지는"]
    products: [ELS, VARIABLE_INSURANCE]
    source:
      type: dispute_case
      ref: "금융감독원 「홍콩 H지수 ELS 관련 국민은행 등 5개 은행의 대표사례에 대한 분쟁조정 결정」 2024.5.14 (R2405598) p2 — 개별 부당권유 금지 위반"
      quote: "판매직원이 신탁통장 표지에 금액, 이율 등 확정금리를 제공하는 안전한 상품이라고 오인하게 할 소지가 있는 내용을 기재하는 등 부당권유가 있었습니다"
  - id: M02-DEPOSIT-INSURANCE
    label: 예금자보호 오인
    patterns: ["예금자보호 되는 줄"]
    # ELS 전용이다. 변액을 뺐다(v4) — 변액에서 "예금자보호 되는 줄 알았다"는 **부분적으로
    # 참**이다. 상품요약서 p2 가 "보호되지 않습니다. 다만, 약관에서 정한 최저사망지급금,
    # 최저실적배당종신연금 및 특약에 한하여 ... 1인당 1억원까지" 로 부분 보호를 명시한다
    # (VAR-PARTIAL-DEPOSIT-INSURANCE, PR #53). 부분적으로 맞는 진술을 patterns 가 1.000 으로
    # 잡아 U4 를 확정하면 이해→오해 오판이고, stage=pattern 은 LLM 이 되돌릴 수 없는 확정
    # 경로다 — #21 에서 조각 패턴을 버린 것과 같은 실패 양식이다.
    #
    # 그리고 source 가 홍콩 H지수 **ELS** 조정례다. products 에 변액이 있던 것은 근거 범위를
    # 넘은 것이기도 했다.
    #
    # 변액용 신규 유형(부분 보호 **범위** 오인 — "해약환급금도 보호되는 줄")은 만들지 않았다.
    # 인용 가능한 근거를 못 찾았고, 근거 없이 유형을 만들면 M07 을 뺀 결정과 모순된다
    # (docs/decision-log.md 3.17). 확보되면 추가한다. 그때까지 변액 예금자보호 오해는
    # LLM + 루브릭 경로로만 잡힌다 — 결정론 상향이 없는 것은 받아들인다. 없어지는 쪽은
    # 오해→이해(상한 1%) 방향이고 남겨두면 이해→오해(관리지표 10%)로 확정 오판이 난다.
    products: [ELS]
    # 주의: 조정례가 인정한 것은 "예·적금 가입 목적으로 방문했다"는 사실이지 "예금자보호법
    # 대상으로 오인했다"는 진술이 아니다. 같은 오해의 인접 표현으로 보고 인용하되, 승급
    # 범위를 넘겨 "예금자보호 오인이 조정례에서 인정됐다"고 쓰지 않는다.
    source:
      type: dispute_case
      ref: "금융감독원 「홍콩 H지수 ELS ... 분쟁조정 결정」 2024.5.14 (R2405598) p5 사례 A(국민은행) / p8 분쟁조정기준(안) 고객요인 '예적금 가입목적' 10%p 가산"
      quote: "암 보험 진단금을 정기예금에 예치하러 온 고객에게 ELT를 권유 / (기준) 예적금 예치 등 원금보장상품 가입을 목적으로 금융회사를 방문한 것이 인정되는 경우"
  - id: M03-PROBABILITY
    label: 확률 오인
    patterns: ["반토막 날 리가"]
    products: [ELS]
    # 이 유형의 근거가 F-SIM-001 이 2008 을 강제 포함하는 이유와 같다(P2). 확률 오인은
    # 고객이 혼자 만든 것이 아니라 분석기간에서 2008 을 빼는 방식으로 만들어졌다.
    source:
      type: dispute_case
      ref: "금융감독원 「홍콩 H지수 ELS ... 분쟁조정 결정」 2024.5.14 (R2405598) p2 — 일괄 설명의무 위반"
      quote: "손실위험에 대한 시나리오 분석대상 기간을 20년 대신 10년 또는 15년으로 설정함으로써 손실위험이 축소된 결과를 활용하여 안내 (예: '08년도 글로벌 금융위기 기간이 제외)"
  - id: M04-EARLY-REDEMPTION
    label: 조기상환 구조 오인
    # 승급 후보: 금감원 분쟁조정결정 제2009-93호「ELF 손익구조 설명불충분 관련 손해배상책임
    # 여부」(2010.2.2). 제목이 이 유형과 정확히 겹치지만 본문이 .hwp 첨부라 문면을 못 뽑았다.
    # 열어서 인용 가능한 진술이 나오면 dispute_case 로 올린다.
    # 두 번째 패턴은 기획서 4절 대화 예시(154행)에서 왔다. 기존 패턴만으로는 그 발화가
    # 포함도 0.308(임계 0.62)로 미매칭이어서, 등급은 LLM 이 U4 로 맞히지만
    # misconception_type 이 비고 미분류 후보 큐로 갔다 (PR #10 dev set 유일 FAIL).
    #
    # 조각("3년 뒤에 이자 붙어서 나오는")이 아니라 문장 전체를 넣는다. 조각은 같은 항목
    # (ELS-EARLY-REDEMPTION-CONDITION)의 **정답 발화**까지 잡는다 — "조건을 못 맞추면
    # 3년 뒤에 이자 붙어서 나오는 거고, 낙인 깨지면 손실이죠" 가 score 1.000 stage=pattern
    # 이 되고, 그 항목 루브릭의 related_misconceptions 에 M04 가 있어 floor 가 U1 을 U4 로
    # 확정한다. 부정형("...나오는 게 아니라 6개월마다")도 같다. 부분 문자열 매칭이라
    # 부정·조건절을 못 본다. stage=pattern 1.000 은 LLM 이 되돌릴 수 없는 확정 경로다.
    #
    # 문장 전체는 위 두 정답 발화를 후보 큐로만 보낸다(설계된 연성 경로). 대가는 어미 변형
    # ("3년 후에 이자까지 붙어서 나온다는 거", 조각 0.545 → 전체 0.333)을 놓치는 것인데,
    # 변형 커버는 3단계(임베딩) 몫이다 — 패턴 단계는 결정론이 값이다.
    patterns:
      - "만기 3년이면 3년 뒤에 원금과 이자"
      - "은행에서 파는 거니까 3년 뒤에 이자 붙어서 나오는 거죠"
    products: [ELS]
    source:
      type: proposal_example
      ref: "docs/proposal.md 4절 [핵심 엔진] 160행(오해 목록), 154행(대화 예시)"
      quote: "만기 3년이면 3년 뒤에 원금과 이자 / 은행에서 파는 거니까 3년 뒤에 이자 붙어서 나오는 거죠"
  - id: M05-SAVINGS
    label: 저축성 오인
    # 금감원 분쟁조정사례 DB 814건 전수 대조 결과 변액보험 조정례가 없다(2026-08-25).
    # 이 경로로는 승급 불가. 생보협·판례 등 다른 수집원을 봐야 한다.
    patterns: ["저축인 줄"]
    products: [VARIABLE_INSURANCE]
    source:
      type: proposal_example
      ref: "docs/proposal.md 4절 [핵심 엔진] 161행"
      quote: "저축인 줄 알았다"
  - id: M06-SURRENDER-VALUE
    label: 해지환급금 오인
    # 금감원 분쟁조정사례 DB 814건 전수 대조 결과 변액보험 조정례가 없다(2026-08-25).
    # 이 경로로는 승급 불가. 생보협·판례 등 다른 수집원을 봐야 한다.
    patterns: ["낸 돈은 다 돌려받는"]
    products: [VARIABLE_INSURANCE]
    source:
      type: proposal_example
      ref: "docs/proposal.md 4절 [핵심 엔진] 162행"
      quote: "낸 돈은 다 돌려받는 거죠"
  - id: M08-TYING
    label: 꺾기(불공정영업) 신호
    # escalate 가 걸린 유일한 유형이라 오탐 비용이 조직 밖으로 나간다. 근거 우선순위 1번.
    # 조정례 DB 에는 꺾기 건이 없다 — 승급 후보는 금감원「8개 은행의 금융상품 구속행위에
    # 대한 검사 및 조치결과」(2011, 검사 7.12~9.9, 943건 330억원 적발)이고 type 은
    # inspection 이 된다.
    patterns: ["대출받으려면 이것도 들어야"]
    products: [ALL]
    escalate: compliance      # F-GTE-003 즉시 알림, 판매자 화면 비노출
    source:
      type: proposal_example
      ref: "docs/proposal.md 4절 [핵심 엔진] 163행"
      quote: "대출받으려면 이것도 들어야 한다길래"

  # ── M09 · M10 (이슈 #148) ────────────────────────────────────────────────────
  #
  # 둘 다 근거가 **상품문서 조항**이다(`product_document`, #153 으로 열린 값). 조정례
  # DB 전수 검색 0건 · 기획서 오해 목록에도 없어서 다른 세 값으로는 근거를 적을 칸이
  # 없었다 — 3.17(*"근거 없는 유형은 개수를 맞추려고 남기지 않는다"*)에 걸려 멈춰 있던
  # 것이 이걸로 풀린다.
  #
  # ❗`is_dispute_grounded` 는 여전히 거짓이다(#153 에서 일부러 안 넣었다). 심사에서
  # *"분쟁까지 간 오해"* 로 셀 수 있는 것은 dispute_case 뿐이고, 이 둘은 **문서가 반박하는
  # 오해**다. 둘은 다른 주장이다.
  #
  # ── 패턴을 문장 전체로 두는 이유 (M04 선례) ─────────────────────────────────
  #
  # M04 주석이 실측으로 남긴 규칙을 그대로 따른다 — **조각이 아니라 문장 전체.** 부분
  # 문자열 매칭이라 부정·조건절을 못 보므로, 조각은 같은 항목의 **정답 발화**까지 잡는다.
  # `stage=pattern 1.000` 은 LLM 이 되돌릴 수 없는 확정 경로라 그 오탐의 대가가 크다.
  #
  #   조각 "주식처럼 팔"      → *"주식처럼 팔 수 없다고 들었어요"* (정답)도 잡는다
  #   조각 "중간에 빼면"      → *"중간에 빼면 손해라던데요"* (정답)도 잡는다
  #
  # 대가는 어미 변형을 놓치는 것이고, 그건 2·3단계(ngram·임베딩) 몫이다 — 패턴 단계는
  # 결정론이 값이다.
  - id: M09-NO-LISTING
    label: 상장·환금성 오인
    patterns:
      - "주식처럼 팔고 싶을 때 팔면 되는 거 아닌가요"
    products: [ELS]
    source:
      type: product_document
      ref: "키움증권 제4181회 간이투자설명서 p14 「환금성 제약의 위험」 — data/documents/els_kiwoom_4181_simple_prospectus.pdf"
