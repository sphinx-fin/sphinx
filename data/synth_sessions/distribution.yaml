# F-DSH-003 합성 세션 생성 파라미터. 소유: 정세현
#
# ❗**이 파일이 "연출 금지" 요건의 실물이다.** 기획서 F-DSH-003 이 못박은 제약이
# *"생성 파라미터(분포 설정)를 리포트에 명시 — 실측처럼 보이게 하는 연출 금지"* 이고,
# 대시보드가 `synthetic: true` 를 상시 노출하는 것(결정 5.16)과 한 쌍이다.
# 화면은 "합성이다" 를 말하고, 이 파일은 "어떤 분포의 합성인가" 를 말한다.
#
# ## 왜 합성인가
#
# `MIN_CELL_SAMPLE = 30` 이라 그 미만인 칸은 값을 가린다. 데모·리허설에서 손으로 만드는
# 세션은 많아야 수십 건이고 상품×항목으로 쪼개지면 **거의 모든 칸이 가려진다.** 화면은
# 정상 동작인데 보여줄 것이 없다 — 그래서 기획이 *"MVP에서는 합성 세션 데이터로 구동"*
# 이라고 적었다(F-DSH-001).
#
# ## 등급 분포의 근거 — 지어내지 않았다
#
# 항목별 오해율을 임의로 고르지 않는다. **루브릭이 선언한 `related_misconceptions`** 를
# 근거로 삼는다 — 그 항목이 실제로 어느 오해 유형과 묶여 있는지가 레포에 이미 있다.
#
#     루브릭 17개 중 16개가 related 를 선언한다
#     M01(원금보장 오인) 8회 · M05(저축성) 4회 · M06(해지환급금) 3회 · M04 3회 · M03 2회 · M02 2회
#
# 아래 `misconception_weight` 가 그 빈도이고, 항목의 U4 비율은 그 항목이 걸린 유형들의
# 가중치에서 유도한다(`SyntheticSessions.misrateOf`). **항목마다 숫자를 손으로 적지
# 않는 이유**가 이것이다 — 손으로 적으면 그 값이 어디서 왔는지 아무도 모르고, 라이브러리가
# 바뀌어도 안 따라온다.
version: 1

# 재현성. 같은 seed·같은 파라미터면 같은 세션이 나온다 — P2 와 같은 결이다.
# 이 값을 바꾸면 대시보드 수치가 통째로 달라지므로 바꿀 이유가 없으면 두지 않는다.
seed: 20260903

# 오해 유형별 가중치 = 루브릭이 그 유형을 related 로 선언한 횟수.
# 위 표에서 뽑은 값이고, `SyntheticSessionsTest` 가 루브릭과 대조해 낡지 않게 잠근다.
misconception_weight:
  M01-PRINCIPAL-GUARANTEE: 8
  M05-SAVINGS: 4
  M06-SURRENDER-VALUE: 3
  M04-EARLY-REDEMPTION: 3
  M03-PROBABILITY: 2
  M02-DEPOSIT-INSURANCE: 2

# 유도된 오해율의 범위. 가중치 합이 가장 큰 항목이 max, 가장 작은 항목이 min 이 되도록
# 선형으로 편다. 절대값 자체는 합성이므로 의미가 없고, **편차가 보이는 것**이 목적이다 —
# 대시보드가 답해야 하는 것은 "몇 %인가" 가 아니라 "어느 항목이 유독 높은가" 다.
misrate_range: { min: 0.08, max: 0.42 }

# 주별 세션 수. 최근 6주를 채운다(선행지표 기본 periods 와 맞춘다).
# 상품별로 주당 이만큼이면 6주 누적이 칸마다 30을 넘는다 — 아래 계산 참조.
#
#     ELS  주 6건 × 6주 = 36 ≥ 30      변액 주 6건 × 6주 = 36 ≥ 30
#
# 주별로 조금씩 흔들어 추이가 평평하지 않게 한다(`weekly_jitter`).
weeks: 6
sessions_per_week:
  ELS: 6
  VARIABLE_INSURANCE: 6
weekly_jitter: 2          # ±2건 범위에서 seed 로 흔든다

# 지점 배분. `demo_accounts.yaml` 의 지점과 같은 코드여야 MGR 의 branch 범위가 성립한다.
branches: [BR-001, BR-002]

# 세션 속성 — 필터(상품·연령대·채널)가 실제로 무언가를 거르도록 섞는다.
age_bands: ["30대", "40대", "50대", "60대", "70대 이상"]
channels: [FACE_TO_FACE, MOBILE]

# ❗**일부러 30건 미만으로 남기는 칸.** 전부 채우면 *"소표본 마스킹이 동작한다"* 를 심사에서
# 못 보여준다. 빗금 친 칸이 하나쯤 있는 화면이 **"개인이 역추정되지 않게 가린다"** 를
# 말없이 증명하고, 그게 기획 7-4 의 실물 근거다.
#
# 화면이 "데이터 없음" 과 "가려짐" 을 구별해야 하므로(계약 `masked` 주석) **칸을 없애는 것이
# 아니라 표본을 적게** 만든다 — 판정은 들어가되 n 이 임계 아래다.
under_sampled:
  - { product: ELS, item: ELS-NO-LISTING, n: 12 }
  - { product: VARIABLE_INSURANCE, item: VAR-PARTIAL-DEPOSIT-INSURANCE, n: 7 }
