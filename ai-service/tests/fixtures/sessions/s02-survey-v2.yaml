# F-DET-002 세션 단위 dev set. 소유: 윤지석
#
# 항목 단위 dev set(`utterances/`)은 **한 발화 → 한 판정**을 본다. 모순은 세션 단위라
# 그 형태로 검증할 수 없었다 — 입력이 설문 전체 + 세션 내 발화 전체다.
#
# 설문 키는 `s02-survey-v2` 다(v1 은 오준서 확정 · 이슈 #44). 여기 값을 복사해 두는 이유:
# 화면 파일(`web/src/lib/survey.ts`)은 내 모듈이 아니고, 세트가 바뀌면 `SURVEY_SCHEMA_VERSION`
# 이 올라간다고 합의했다.
#
# ❗**그 합의만으로는 안 잡혔다.** `b84eb45`(8/28)가 v2 로 올리면서 SUIT-PRODUCT-EXPERIENCE
# 의 **선택지 문면**을 바꿨는데("있다 — 손실을 본 적은 없다" → "있고 이득을 봤다") 이 파일이
# 열흘 동안 죽은 문면 4건을 들고 있었다. 문항 ID 도 문항 텍스트도 안 바뀌어서 기존 대조
# 셋이 전부 초록이었다 — **선택지는 아무도 안 보고 있었다.**
#
# 설문 값은 문장이고 그 문장이 곧 `recorded_answer` 라, 모순 판정이 대조하는 대상이다.
# 그래서 `test_survey_contract.py` 가 이제 **값이 살아 있는 선택지인지** 를 잰다.
#
# `_surveySchemaVersion` 을 일부러 넣는다 — 실제 요청 모양이고, 메타키가 문항으로 새면
# 안 된다는 것(#98 ②)이 여기서도 검증된다.
survey_schema_version: s02-survey-v2

cases:
  # ── 기획서 7-2 데모 메인 ─────────────────────────────────────────────────────
  # ①"위험 감수 가능 체크" + ③"원금은 지켜지는 거죠?" 조합. #44 의 DEMO_SURVEY_ANSWERS 가
  # 이 값이고 화면의 "데모 입력값 채우기" 버튼이 이걸 채운다. 데모에서 실제로 도는 경로다.
  - id: DEMO-SESSION-PRINCIPAL
    source: 기획서 7-2 데모 메인 ①③ · 이슈 #44 DEMO_SURVEY_ANSWERS
    survey:
      _surveySchemaVersion: s02-survey-v2
      SUIT-RISK-PROFILE: 적극투자형
      SUIT-PRINCIPAL-LOSS: 손실이 나더라도 감수할 수 있다
      SUIT-LOSS-TOLERANCE: 20%를 넘는 손실도 감수할 수 있다
      SUIT-PURPOSE: 손실 위험을 감수하고 적극적인 수익을 원한다
      SUIT-HORIZON: 5년 이상 묶어둘 수 있다
      SUIT-PRODUCT-EXPERIENCE: 없다
    utterances:
      - item_id: ELS-PRINCIPAL-LOSS-WARNING
        text: 은행에서 파는 거니까 원금은 지켜지는 거죠?
      - item_id: ELS-NO-DEPOSIT-INSURANCE
        text: 예금자보호도 되는 거라고 들었어요.
    expected_status: evaluated
    expected_mismatch: true
    expected_axes: [principal_preservation]
    expected_direction: survey_overstates_tolerance

  # ── 정상 대조군 — 억지 모순을 만들지 않는지 ──────────────────────────────────
  # 없는 모순을 만들면 정상 계약을 가로막는다(프롬프트 규칙 6). 이해→오해 방향 오판이
  # 세션 단위에서 나는 지점이 여기다.
  - id: CONSISTENT-RISK-TAKER
    source: 합성 — 설문과 발화가 일치. 모순 없음이 정답
    survey:
      _surveySchemaVersion: s02-survey-v2
      SUIT-RISK-PROFILE: 적극투자형
      SUIT-PRINCIPAL-LOSS: 손실이 나더라도 감수할 수 있다
      SUIT-LOSS-TOLERANCE: 20%를 넘는 손실도 감수할 수 있다
      SUIT-PURPOSE: 손실 위험을 감수하고 적극적인 수익을 원한다
      SUIT-HORIZON: 5년 이상 묶어둘 수 있다
      SUIT-PRODUCT-EXPERIENCE: 있지만 손실을 봤다
    utterances:
      - item_id: ELS-PRINCIPAL-LOSS-WARNING
        text: 기초자산이 낙인 밑으로 가면 떨어진 만큼 원금이 깎입니다. 전에도 한 번 손실을 봤고 그 정도는 감당할 생각으로 왔어요.
    expected_status: evaluated
    expected_mismatch: false
    expected_axes: []

  # ── 축이 원금이 아닌 모순 ────────────────────────────────────────────────────
  # `axis` 를 `question_id` 에서 고정한 뒤로(#113) 이 케이스가 매핑을 실제로 검증한다.
  # 원금 축은 모두 일치하고 기간 축만 어긋난다 — 모델이 축을 헷갈리면 여기서 드러난다.
  - id: HORIZON-ONLY
    source: 합성 — 기간 축 단독 모순. axis 고정(#113) 검증
    survey:
      _surveySchemaVersion: s02-survey-v2
      SUIT-RISK-PROFILE: 위험중립형
      SUIT-PRINCIPAL-LOSS: 일부 손실까지만 감수할 수 있다
      SUIT-LOSS-TOLERANCE: 10% 이내라면 감수할 수 있다
      SUIT-PURPOSE: 예금보다 조금 높은 수익을 원한다
      SUIT-HORIZON: 5년 이상 묶어둘 수 있다
      SUIT-PRODUCT-EXPERIENCE: 있고 이득을 봤다
    utterances:
      - item_id: ELS-PRINCIPAL-LOSS-WARNING
        text: 원금이 좀 깎일 수 있는 건 압니다.
      - item_id: ELS-NO-LISTING
        text: 근데 이 돈은 반년 뒤에 전세 잔금으로 써야 해서 그때는 빼야 해요.
    expected_status: evaluated
    expected_mismatch: true
    expected_axes: [investment_horizon]
    expected_direction: survey_overstates_tolerance

  # ── 손실 폭 축 — 원금 감수는 맞는데 폭이 어긋난다 ────────────────────────────
  # ADR-006 이 원금손실을 쪼갠 것과 같은 이유다. `PRINCIPAL-LOSS` 와 `LOSS-TOLERANCE` 를
  # 두 문항으로 나눈 것(#44)이 여기서 값을 한다 — "감수한다"면서 "10% 넘으면 못 견딘다"를
  # 한 문항으로는 못 잡는다.
  - id: LOSS-CAPACITY-ONLY
    source: 합성 — 손실 폭 축 단독 모순. 문항 분리(#44)의 근거 검증
    survey:
      _surveySchemaVersion: s02-survey-v2
      SUIT-RISK-PROFILE: 적극투자형
      SUIT-PRINCIPAL-LOSS: 손실이 나더라도 감수할 수 있다
      SUIT-LOSS-TOLERANCE: 20%를 넘는 손실도 감수할 수 있다
      SUIT-PURPOSE: 손실 위험을 감수하고 적극적인 수익을 원한다
      SUIT-HORIZON: 5년 이상 묶어둘 수 있다
      SUIT-PRODUCT-EXPERIENCE: 없다
    utterances:
      - item_id: ELS-PRINCIPAL-LOSS-WARNING
        text: 손실이 날 수 있다는 건 알아요. 그래도 10% 넘게 빠지면 저는 못 견딥니다.
    expected_status: evaluated
    expected_mismatch: true
    expected_axes: [loss_capacity]
    expected_direction: survey_overstates_tolerance

  # ── 판정 불가 — '모순 없음'과 구분되는지 ─────────────────────────────────────
  # `mismatch=false` 만 돌려주면 호출자가 '적합'으로 읽는다(결정로그 10.9 가 게이트 쪽에서
  # 같은 문제를 지적하고 있다). 판정하지 못한 것은 status 로 갈린다.
  - id: TOO-SHORT-TO-JUDGE
    source: 합성 — 발화 한두 마디로 성향을 단정하면 오판이다
    survey:
      _surveySchemaVersion: s02-survey-v2
      SUIT-PRINCIPAL-LOSS: 손실이 나더라도 감수할 수 있다
    utterances:
      - item_id: ELS-PRINCIPAL-LOSS-WARNING
        text: 네.
    expected_status: insufficient_input
    expected_mismatch: false
    expected_axes: []

  # 메타키만 오면 문항이 하나도 없는 것과 같다 (#98 ②)
  - id: METADATA-ONLY-SURVEY
    source: 합성 — 메타키가 문항으로 세면 이 케이스가 evaluated 로 나온다
    survey:
      _surveySchemaVersion: s02-survey-v2
    utterances:
      - item_id: ELS-PRINCIPAL-LOSS-WARNING
        text: 은행에서 파는 거니까 원금은 지켜지는 거죠?
    expected_status: insufficient_input
    expected_mismatch: false
    expected_axes: []

  # ── 남은 축 3개 — `AXIS_BY_QUESTION` 6개를 전부 덮는다 ───────────────────────
  # 축 하나가 한 번도 안 나오면 그 문항의 매핑이 틀렸는지 알 수 없다. 커버리지를
  # `test_session_devset_covers_every_axis` 가 고정한다.

  # 기획서 3절: "80대 고령 투자자가 '적극투자형'으로 스스로 기재한 사실이 은행 책임을
  # 제한하는 근거로 인정" — 이 기능이 존재하는 이유 그 자체다.
  - id: RISK-PROFILE-ONLY
    source: 기획서 3절 판결 동향 — 스스로 기재한 투자성향과 실제 발언의 괴리
    survey:
      _surveySchemaVersion: s02-survey-v2
      SUIT-RISK-PROFILE: 적극투자형
      SUIT-PRINCIPAL-LOSS: 일부 손실까지만 감수할 수 있다
      SUIT-LOSS-TOLERANCE: 10% 이내라면 감수할 수 있다
      SUIT-PURPOSE: 예금보다 조금 높은 수익을 원한다
      SUIT-HORIZON: 3~5년은 묶어둘 수 있다
      SUIT-PRODUCT-EXPERIENCE: 있고 이득을 봤다
    utterances:
      - item_id: ELS-PRINCIPAL-LOSS-WARNING
        text: 저는 위험한 건 원래 안 합니다. 평생 예금만 했어요. 창구에서 성향 검사는 직원분이 골라주셨어요.
    expected_status: evaluated
    expected_mismatch: true
    expected_axes: [risk_tolerance]
    expected_direction: survey_overstates_tolerance

  # 결정로그 10.13 ③ 과 닿는 케이스다 — 감독당국 배상기준의 "예적금 가입목적 10%p".
  # #44 회신에서 `SUIT-PURPOSE` 가 그 소스가 될 수 있다고 짚었고, 여기가 그 발화 모양이다.
  - id: PURPOSE-ONLY
    source: 합성 — 목적 축 단독 모순. 결정로그 10.13 ③ 예적금 가입목적과 닿는다
    survey:
      _surveySchemaVersion: s02-survey-v2
      SUIT-RISK-PROFILE: 위험중립형
      SUIT-PRINCIPAL-LOSS: 일부 손실까지만 감수할 수 있다
      SUIT-LOSS-TOLERANCE: 10% 이내라면 감수할 수 있다
      SUIT-PURPOSE: 손실 위험을 감수하고 적극적인 수익을 원한다
      SUIT-HORIZON: 3~5년은 묶어둘 수 있다
      SUIT-PRODUCT-EXPERIENCE: 있고 이득을 봤다
    utterances:
      - item_id: ELS-PRINCIPAL-LOSS-WARNING
        text: 손실이 조금 날 수 있는 건 압니다. 그래도 저는 적금 만기 된 걸 그냥 옮겨두려고 온 거예요.
    expected_status: evaluated
    expected_mismatch: true
    expected_axes: [purpose]
    expected_direction: survey_overstates_tolerance

  # ★ 이 케이스가 두 가지를 동시에 덮는다 — `product_understanding` 축과
  #   `survey_understates_tolerance` 방향이다. 다른 케이스는 전부 overstates 다.
  #
  #   처음에는 반대로 썼다 — 설문 "경험 있다" + 발화 "구조를 하나도 모르겠어요". 모델이
  #   모순을 내지 않았고 **그게 맞았다.** `direction` enum 두 값이 둘 다 *위험 감수*
  #   축이라 "구조를 모른다"를 담을 방향이 없다. 방향이 성립하는 모양으로 바꿨다.
  #   (계약 한계는 PR 본문에 적어 강희진에게 넘긴다.)
  - id: PRODUCT-UNDERSTANDING-ONLY
    source: 합성 — 경험 기재가 실제보다 낮다. survey_understates_tolerance 유일 케이스
    survey:
      _surveySchemaVersion: s02-survey-v2
      SUIT-RISK-PROFILE: 안정추구형
      SUIT-PRINCIPAL-LOSS: 일부 손실까지만 감수할 수 있다
      SUIT-LOSS-TOLERANCE: 10% 이내라면 감수할 수 있다
      SUIT-PURPOSE: 예금보다 조금 높은 수익을 원한다
      SUIT-HORIZON: 3~5년은 묶어둘 수 있다
      SUIT-PRODUCT-EXPERIENCE: 없다
    utterances:
      - item_id: ELS-PRINCIPAL-LOSS-WARNING
        text: 원금 깎이는 구조는 압니다. 예전에 ELS 두 번 해봤고 한 번은 반토막까지 갔다가 회복됐어요.
    expected_status: evaluated
    expected_mismatch: true
    expected_axes: [product_understanding]
    expected_direction: survey_understates_tolerance
