# dev set용 RiskItem — **실제 공시 원문 인용**. 소유: 윤지석
#
# 출처: DART 공시 "일괄신고추가서류(파생결합증권-주가연계증권)"에 첨부된 간이투자설명서.
#       기획서 5절 [활용 데이터]가 1차 수집원으로 지정한 경로다.
#
# 가명 처리: 기획서 5절 — "데모와 제출물에서는 상품명과 발행사를 가명 처리하고 조건만
#            인용한다." 발행사·회차는 여기 적지 않는다. 원문 파일과 접수번호는
#            data/documents/(git 제외)에 각자 로컬로 둔다.
#
# source_span:
#   - page: 1 고정. DART 간이투자설명서는 페이지 구분이 없는 단일 HTML 문서다.
#           PDF 기반 페이지 번호는 F-EXT-001 파서(정세현)가 붙일 때 채워진다.
#   - start/end: data/documents/els-31370-simple-prospectus.txt 의 문자 오프셋.
#           그 파일은 git 제외이므로 검증하려면 각자 원문을 받아야 한다.
#
# 이 상품의 실제 조건은 기획서 7-2 데모 파라미터(배리어 50%, 쿠폰 연 6%, 6개월 조기상환)와
# 다르다 — 낙인 35%, 만기행사가격 70%, 3개월 단위 조기상환, 연 10.2% 수준.
# 데모 표 수치는 정세현(F-SIM-001)이 별도로 확정한다.
product_id: els-demo-001
