items:
  - item_id: ELS-PRINCIPAL-LOSS
    name: 원금손실 조건
    importance: required
    value_text: >-
      본 증권의 조건에 따라 상환이나 지급이 발생한 적 없고 [KOSPI200]의 종가를 기준으로
      최초기준가격(결정일: 2026년 08월 31일)의 35%보다 작게 된 적이 있고
      최종기준가격(결정일: 2029년 08월 31일)이 최초기준가격의 70%보다 작은 경우
      원금 손실이 발생합니다.
