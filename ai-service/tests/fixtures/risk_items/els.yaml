  - item_id: ELS-NO-DEPOSIT-INSURANCE
    name: 예금자보호 비대상
    importance: required
    value_text: 이 금융상품은 예금자보호법에 따라 보호되지 않습니다.
    source_span: {page: 1, start: 146, end: 175}

  - item_id: ELS-EARLY-REDEMPTION
    name: 조기상환 구조
    importance: required
    value_text: >-
      ①1차 중간기준가격 결정일에 기초자산의 중간기준가격이 최초기준가격의 95%보다
      크거나 같게 되는 경우 -> 액면가액 x (100% + 2.55%) 지급
    source_span: {page: 1, start: 4507, end: 4591}
