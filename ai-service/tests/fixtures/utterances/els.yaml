  #   기획서 5절 오판 비대칭(오해→이해 상한 1%)을 결정론 보조 없이 지켜야 하는 구간이라
  #   여기가 프롬프트 v2 의 실제 위험 지점이다. 라이브러리 패턴 추가는 정세현 영역 —
  #   이 실측을 근거로 요청한다.

  - id: KNOCKIN-MATURITY-ONLY
