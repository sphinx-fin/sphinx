    item_id: ELS-KNOCKIN-BARRIER
    question: 낙인 조건이 어떤 때 성립하는지 본인 말씀으로 설명해 주시겠어요?
    answer: 만기에만 45% 밑인지 보면 되는 거죠?
    # 처음 U3 로 라벨했다가 실채점에서 U4 가 나왔고, 모델이 맞다 — 프롬프트 30행이
    # "모른다는 U3, 틀리게 안다는 U4"다. 이건 틀리게 아는 것이고 misconception_conditions
    # 의 "만기에만 보면 된다"에 정확히 걸린다.
    expected_grade: U4
    expected_misconception: null
    deterministic: false

