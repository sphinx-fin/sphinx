# 변액보험 dev set. 라벨 출처는 각 케이스의 source 필드.
#
# 루브릭 4종을 실제 채점으로 검증하려고 만들었다 — 그전까지는 문면만 맞춰둔 상태였다.
# 조건 원문은 계약 샘플(parsed_variable_sample.json)에서 오므로 여기 복사하지 않는다.
product_type: VARIABLE_INSURANCE
cases:
  # ── 결정론: 오해 라이브러리가 잡는 것 ──────────────────────────────────────
  - id: VAR-SAVINGS-MISCONCEPTION
    source: 기획서 4절 [핵심 엔진] 오해 목록 — "저축인 줄 알았다" (M05)
    item_id: VAR-PRINCIPAL-LOSS
    question: 이 상품에서 낸 돈이 어떻게 되는지 본인 말씀으로 설명해 주시겠어요?
    answer: 그냥 저축인 줄 알고 넣었는데요.
    expected_grade: U4
    expected_misconception: M05-SAVINGS
    deterministic: true

  - id: VAR-FULL-REFUND-MISCONCEPTION
    source: 기획서 4절 [핵심 엔진] 오해 목록 — "낸 돈은 다 돌려받는 거죠" (M06)
    item_id: VAR-SURRENDER-BELOW-PREMIUM
    question: 중도에 해지하시면 얼마를 돌려받는지 어떻게 이해하고 계신가요?
    answer: 낸 돈은 다 돌려받는 거죠?
    expected_grade: U4
    expected_misconception: M06-SURRENDER-VALUE
    deterministic: true

  # ── LLM 의존: 라이브러리에 패턴이 없는 오해 ────────────────────────────────
  - id: VAR-FEE-UNAWARE
    source: 합성 — 월공제액 차감을 모르는 진술. 라이브러리 패턴 없음
    item_id: VAR-FEE-DEDUCTION
    question: 납입하신 보험료가 어디에 쓰이는지 말씀해 주시겠어요?
    answer: 낸 돈 전부가 펀드에 들어가서 굴려지는 거 아닌가요?
    expected_grade: U4
    expected_misconception: null
    deterministic: false

  # ★ 이 케이스가 VAR-EARLY-SURRENDER 분리 결정(ADR-006)의 근거를 검증한다.
  #   합쳐두면 "환급률이 낮다"는 일반론만 요구하고 수치를 못 짚는 답변이 통과한다.
  #   분리 후에는 required_elements 가 "제시된 환급률 수준을 수치로 언급"을 요구하므로
  #   이 답변이 U1 로 통과하면 안 된다.
  - id: VAR-RATIO-VAGUE
    source: 합성 — 분리 결정 검증. 손해는 인지하지만 수치를 못 짚는다
    item_id: VAR-EARLY-SURRENDER-RATIO
    question: 3개월 만에 해지하시면 환급률이 어떻게 되는지 말씀해 주시겠어요?
    answer: 일찍 해지하면 좀 손해가 나겠죠.
    expected_grade: U2
    expected_misconception: null
    deterministic: false

  # ── 정상 이해 대조군: 이해→오해 오판 감시 ──────────────────────────────────
  - id: VAR-PRINCIPAL-UNDERSTOOD
    source: 합성 — 정상 이해 대조군
    item_id: VAR-PRINCIPAL-LOSS
    question: 이 상품에서 낸 돈이 어떻게 되는지 본인 말씀으로 설명해 주시겠어요?
    answer: 펀드 실적에 따라 변하고 최저보증이 없어서 중도해지하면 원금보다 적게 받을 수 있다고 들었어요.
    expected_grade: U1
    expected_misconception: null
    deterministic: false

  - id: VAR-RATIO-UNDERSTOOD
    source: 합성 — 수치를 짚는 정상 이해. VAR-RATIO-VAGUE 와 짝
    item_id: VAR-EARLY-SURRENDER-RATIO
    question: 3개월 만에 해지하시면 환급률이 어떻게 되는지 말씀해 주시겠어요?
    answer: 3개월이면 낸 돈의 58% 정도만 돌아온다고 표에서 봤어요.
    expected_grade: U1
    expected_misconception: null
    deterministic: false

  # ── required 루브릭 3종 (#100 importance 부여 대응) ─────────────────────────
  # 셋 다 결정론 미매칭이다(실측). M05 패턴이 "그냥 저축인 줄"에 맞춰져 있어 다른 표현은
  # 안 걸린다 — 라이브러리 패턴 추가 요청 근거.

  - id: VAR-FIXED-INTEREST
    source: 합성 — 실적배당을 확정이자로 오인. VAR-PRINCIPAL-LOSS 와 층이 다른 오해
    item_id: VAR-PERFORMANCE-LINKED
    question: 이 상품의 수익이 어떻게 정해지는지 본인 말씀으로 설명해 주시겠어요?
    answer: 정해진 이자가 붙어서 나오는 거죠?
    expected_grade: U4
    expected_misconception: null
    deterministic: false

  # ★ PR #53 이 만든 케이스다. "보호되지 않는다"가 아니라 **범위**를 요구하는 루브릭이라
  #   전액보호 오인(U4)과 전액비보호 오인이 둘 다 오답이어야 한다. 후자는 원문 첫 문장만
  #   읽으면 나오는 답이고, 판매자가 그렇게 설명해도 게이트가 잡아야 한다.
  - id: VAR-DEPOSIT-FULL
    source: 합성 — 부분보호를 전액보호로 오인
    item_id: VAR-PARTIAL-DEPOSIT-INSURANCE
    question: 이 계약이 예금자보호를 받는 범위를 어떻게 이해하고 계신가요?
    answer: 보험사도 예금자보호 되니까 낸 돈은 다 보호되는 거죠?
    expected_grade: U4
    expected_misconception: null
    deterministic: false  # M02 는 #57 로 ELS 전용 — 변액은 결정론 보조가 없다

  - id: VAR-DEPOSIT-NONE
    source: 합성 — 원문 첫 문장만 읽은 반대 방향 오해. 루브릭이 범위를 요구하는 이유
    item_id: VAR-PARTIAL-DEPOSIT-INSURANCE
    question: 이 계약이 예금자보호를 받는 범위를 어떻게 이해하고 계신가요?
    answer: 보험은 예금자보호가 전혀 안 된다고 들었어요.
    # KNOCKIN-MATURITY-ONLY 와 같은 라벨 오류였다 — 반대 방향이어도 틀리게 아는 것이라 U4.
    # 이 케이스의 의의는 등급이 아니라 **양방향 오해가 둘 다 걸리는지**다. 걸린다.
    expected_grade: U4
    expected_misconception: null
    deterministic: false

  - id: VAR-SAME-AS-SAVINGS
    source: 기획서 4절 오해 목록 — 저축성 오인(M05)의 다른 표현
    item_id: VAR-NOT-BANK-SAVINGS
    question: 이 상품이 은행 저축과 어떻게 다른지 말씀해 주시겠어요?
    answer: 은행 적금이랑 같은 거라고 들었어요.
    expected_grade: U4
    expected_misconception: null
    deterministic: false  # ★ M05 패턴 미매칭 실측 — "그냥 저축인 줄"만 걸린다

  # ── 화법 폭 (이슈 #377) ─────────────────────────────────────────────────────
  # 변액 10건도 전부 존댓말이었다. ELS 쪽 같은 주석 참조.

  - id: SPEECH-PLAIN-SURRENDER
    source: 화법 폭 (이슈 #377) — 반말. 오해 조건 「낸 돈은 다 돌려받는다」
    item_id: VAR-SURRENDER-BELOW-PREMIUM
    question: 중도에 해지하면 얼마를 돌려받는지 말씀해 주시겠어요?
    answer: 중간에 깨도 넣은 돈은 그대로 나오는 거 아냐?
    expected_grade: U4
    expected_misconception: M06-SURRENDER-VALUE
    deterministic: false

  - id: SPEECH-FORMAL-FEE-U1
    source: 화법 폭 (이슈 #377) — 평서체. 차감이 둘이라는 것을 다 말한다
    item_id: VAR-FEE-DEDUCTION
    question: 낸 보험료가 어떻게 쓰이는지 말씀해 주시겠어요?
    answer: 매달 위험보험료와 사업비가 먼저 빠지고, 중도해지하면 미상각신계약비도 추가로 차감됩니다
    expected_grade: U1
    expected_misconception: null
    deterministic: false

  - id: PARTIAL-FEE-U2
    source: 화법 폭 (이슈 #377) — 반말 + 요소 2개 중 앞만. u1_requires=2 라 U2
    item_id: VAR-FEE-DEDUCTION
    question: 낸 보험료가 어떻게 쓰이는지 말씀해 주시겠어요?
    answer: 매달 얼마씩 사업비로 빠진다는 건 알겠어
    expected_grade: U2
    expected_misconception: null
    deterministic: false   # 미상각신계약비(해약공제액)가 빠졌다 — 오해는 아니다

  - id: DONT-KNOW-PERFORMANCE-U3
    source: 화법 폭 (이슈 #377) — U3. 모른다
    item_id: VAR-PERFORMANCE-LINKED
    question: 해약환급금이 어떻게 정해지는지 말씀해 주시겠어요?
    answer: 글쎄요, 그건 설명을 못 들은 것 같은데요
    expected_grade: U3
    expected_misconception: null
    deterministic: false
