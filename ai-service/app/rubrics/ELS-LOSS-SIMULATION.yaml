# 소유: 윤지석 — 공개 의무.
#
# 모의실험 결과를 **확률 보증으로 읽는 것**이 이 항목의 오해다. 기획서 3절이 ELS 사태의
# 핵심으로 지목한 것이 분석기간에서 2008년을 뺀 것이었다 — 과거 데이터가 미래를 보장하지
# 않는다는 이해가 이 항목이다.
item_id: ELS-LOSS-SIMULATION
product_type: ELS
name: 과거 데이터 수익률 모의실험
status: confirmed
required_elements:
  - 모의실험은 과거 데이터에 기초한다
  - 미래 수익을 보장하지 않는다
# U1 문턱 — 필수 요소 2개 중 2개.
#
# ★ **한 줄에 사실이 둘이던 것을 쪼갰다** (이슈 #367).
#
#   전:  "모의실험은 과거 데이터에 기초한 것이고 미래 수익을 보장하지 않는다"  (요소 1 · 문턱 1)
#                     ^^^^^^^^^^^^^^^^^^      ^^^^^^^^^^^^^^^^^^^^^^^
#
#   ❗**둘 중 하나만 말해도 U1 이었다.** 고객이 *"과거 데이터로 만든 거군요"* 라고만 해도
#   이해로 잡힌다 — 정작 게이트가 잡아야 하는 것은 **뒤쪽(미래 미보장)** 인데 그게 없어도
#   통과했다. `#366` 이 U1↔U2 를 세어서 정하게 바꿨지만 **셀 것이 하나면 셈이 작동하지 않는다.**
#
#   `2/2` 인 이유는 나머지 13개와 같다 — 문턱을 낮추면 U1 이 쉬워지고, 판매 게이트에서 그
#   방향은 P5(0.2절 · 미탐을 과탐보다 비싸게 다룬다)와 반대다.
#
#   기획서 3절이 ELS 사태의 핵심으로 지목한 것이 **분석기간에서 2008년을 뺀 것**이다. 그
#   사고의 이해는 「과거 데이터라는 사실」이 아니라 **「그래서 미래를 보장하지 않는다」** 쪽이고,
#   쪼개기 전에는 그쪽을 안 말해도 통과했다.
u1_requires: 2
misconception_conditions:
  - 과거에 손실이 없었으니 앞으로도 없다
  - 모의실험 수익률이 예상 수익률이다
  - 확률이 낮으니 일어나지 않는다
related_misconceptions:
  - M03-PROBABILITY
