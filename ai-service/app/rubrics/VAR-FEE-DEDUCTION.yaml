# 소유: 윤지석 — 공개 의무. item_id·status 근거는 VAR-PRINCIPAL-LOSS.yaml 참고.
#
# 문면 정정: 원문은 "사업비"가 아니라 **"월공제액"** 이다(상품요약서 p10 계약체결·
# 계약관리비용 정의, p12 월공제액 구성). 이전 루브릭이 일반 용어를 쓰고 있었다.
#
# ★ 세 번째 요소는 `tools/find_coverage_gaps.py` 가 찾은 사각이다 (PR #358 후속).
#   **차감이 두 층이 아니라 세 층이다.** 앞의 둘은 보험료에서 빠지고, 이건 펀드
#   적립액에서 빠진다 — 기준(모수)이 다르므로 앞의 둘을 다 알아도 이건 안 보인다.
#
#     상품요약서 p17·p18 원문:
#       "상기 특별계정 운용보수, 증권거래비용 및 기타비용, 기초펀드보수․비용은 해당
#        특별계정(펀드) 적립액에서 차감되며 특별계정(펀드) 기준가격에 반영됩니다."
#
#   ❗**이 층이 빠져 있으면 게이트가 초록이 된다.** 고객이 *"월공제액이 빠지고 해지하면
#   미상각신계약비도 빠진다"* 까지만 알아도 요소 2/2 를 채워 U1 이 나왔다 — 펀드에서
#   따로 빠지는 것을 통째로 모르는 채로 통과한다. 미탐이고, 그 방향이 제일 비싸다.
#
#   템플릿 10개 어디에도 이 문면을 겨냥한 항목이 없었다(`VAR-CONTRACT-COST` 는 보험료
#   비율 정의, `VAR-WITHDRAWAL-FEE` 는 중도인출 수수료 — 둘 다 다른 층이다). 그래서
#   새 항목을 만들지 않고 **이 항목의 요소로 넣는다** — 고객이 알아야 하는 것은
#   "내 돈에서 무엇이 빠지는가" 하나이고, 층으로 쪼개면 각 항목은 답이 되는데 전체
#   그림은 계속 빈다. 분모를 늘리면 R-00(미측정 > 0 → RED)에도 같이 걸린다.
item_id: VAR-FEE-DEDUCTION
product_type: VARIABLE_INSURANCE
name: 월공제액 차감 구조
status: draft
required_elements:
  - 월공제액(위험보험료·계약체결비용·계약관리비용·보증비용)이 보험료에서 차감됨
  - 미상각신계약비(해약공제액)가 추가로 차감됨
  - 특별계정(펀드) 적립액에서 운용보수·증권거래비용·기초펀드보수가 별도로 차감됨
# U1 문턱 — 필수 요소 3개 중 3개.
# 셋은 **차감되는 모수가 다른 세 층**이다(보험료 · 해지 시 · 펀드 적립액). 하나만 알면
# 나머지가 통째로 안 보인다 — 층이 달라서 한 층의 지식이 다른 층을 시사하지 않는다
u1_requires: 3
misconception_conditions:
  - 낸 돈이 전부 투자된다
  - 낸 돈은 다 돌려받는다
  - 월공제액만 빠지고 나머지는 그대로 굴려진다
related_misconceptions:
  - M05-SAVINGS
  - M06-SURRENDER-VALUE
