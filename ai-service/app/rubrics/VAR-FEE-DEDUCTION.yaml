# 소유: 윤지석 — 공개 의무. item_id·status 근거는 VAR-PRINCIPAL-LOSS.yaml 참고.
#
# 문면 정정: 원문은 "사업비"가 아니라 **"월공제액"** 이다(상품요약서 p10 계약체결·
# 계약관리비용 정의, p12 월공제액 구성). 이전 루브릭이 일반 용어를 쓰고 있었다.
#
# ★ 요소 ① 의 **차감 대상**을 원문에 맞췄다 (이슈 #392, 정세현이 근거자료 대조에서 찾음).
#   전에는 보증비용까지 뭉쳐서 *"…이 보험료에서 차감됨"* 이라고 적었는데 원문이 아니다.
#
#     p13·p15  "해약환급금이란 납입한 **보험료에서 계약체결비용 및 계약관리비용을 차감한 후**
#               특별계정으로 투입ㆍ운용되고…"          → 이 둘은 보험료에서가 맞다
#     p12      "…월공제액[위험보험료, 계약체결비용 및 계약관리비용, 최저사망지급금 보증비용,
#               최저실적배당종신연금 보증비용 등]을 차감한 금액에서…"
#               "최저사망지급금 보증비용은 … 매월 월계약해당일 **연금계약 계약자적립액에서**
#               차감됩니다"                            → 보증비용은 적립액에서, 명시적이다
#     p10      "계약체결비용 및 계약관리비용이란 … **보험료 중 일정비율을 책정**한 것"
#               → 「보험료 중 일정비율로 **책정**」과 「보험료**에서** 차감」은 다른 말이다.
#                 내가 그 둘을 뭉갰다.
#
#   ❗**원문 두 곳이 서로 다르게 읽힌다 — 겹치는 부분만 단정한다.** p12 는 `위험보험료` 를
#   월공제액에 넣어 적립액 쪽에서 빼고, p13·p15 는 `계약체결·계약관리비용` 만 보험료에서
#   뺀다고 적는다. 그래서 **위험보험료의 차감 대상을 원문이 적는 곳은 p12 하나뿐**이고,
#   요소는 그 하나만 따른다. 정세현 제안(`#392`)은 `위험보험료` 를 보험료 쪽에 두었는데
#   그 근거가 되는 문장을 못 찾았다 — 찾으면 이 줄을 되돌린다.
#
#   ❗**원문 용어를 그대로 싣는다 — 요소는 앵커이기도 하다.** 처음 고칠 때 *"보증비용 2종"*
#   으로 줄였더니 `find_coverage_gaps` 에서 p12 문장이 **덮임 0.24 로 임계(0.25) 아래**가
#   됐다. 옛 템플릿 cue 가 덮던 것을 새 문면이 놓친 것이다. 원문 이름 둘을 실으니 0.54 로
#   올라가고, `#392` 가 지목한 p13·p15 문장도 0.22 → 0.52 로 같이 덮였다.
#   → **문면을 고칠 때 그 문면이 무엇을 덮고 있었는지 재고 고친다.**
#
#   ❗**오탐 방향이라 더 급하다**(정세현). 미탐이면 게이트가 막아 주지만, 이건 원문대로
#   맞게 말한 고객(*"보증비용은 적립액에서 매달 빠지는 거네요"*)을 U2 로 떨어뜨려
#   재설명 루프로 보낸다. `deterministic: false` 자리라 LLM 판단이 이 문면을 그대로 받는다.
#
# ★ 세 번째 요소는 `tools/find_coverage_gaps.py` 가 찾은 사각이다 (PR #358 후속).
#   **차감이 두 번이 아니라 세 번이다.** 앞의 둘은 매월·해지 시점의 차감이고, 이건
#   **매일 기준가격에 반영되는** 차감이라 고객 눈에 금액으로 안 보인다 — 그래서 앞의 둘을
#   다 알아도 이건 안 보인다.
#
#   ❗처음엔 이 자리에 *"앞의 둘은 보험료에서, 이건 적립액에서 — 모수가 다르다"* 라고
#   적었는데 **그 설명이 틀렸다**(`#392`). 요소 ① 이 이미 두 모수를 담고 있어서 「보험료 대
#   적립액」으로는 안 갈린다. 갈리는 것은 **시점과 드러나는 방식**이다. 셋을 다 요구하는
#   결론은 그대로다 — 셋이 서로를 시사하지 않는 것은 근거가 바뀌어도 성립한다.
#
#     상품요약서 p17·p18 원문:
#       "상기 특별계정 운용보수, 증권거래비용 및 기타비용, 기초펀드보수․비용은 해당
#        특별계정(펀드) 적립액에서 차감되며 특별계정(펀드) 기준가격에 반영됩니다."
#
#   ❗**이 층이 빠져 있으면 게이트가 초록이 된다.** 고객이 *"월공제액이 빠지고 해지하면
#   미상각신계약비도 빠진다"* 까지만 알아도 요소 2/2 를 채워 U1 이 나왔다 — 펀드에서
#   따로 빠지는 것을 통째로 모르는 채로 통과한다. 미탐이고, 그 방향이 제일 비싸다.
#
#   템플릿 10개 어디에도 이 문면을 겨냥한 항목이 없었다(`VAR-CONTRACT-COST` 는 보험료
#   비율 정의, `VAR-WITHDRAWAL-FEE` 는 중도인출 수수료 — 둘 다 다른 층이다). 그래서
#   새 항목을 만들지 않고 **이 항목의 요소로 넣는다** — 고객이 알아야 하는 것은
#   "내 돈에서 무엇이 빠지는가" 하나이고, 층으로 쪼개면 각 항목은 답이 되는데 전체
#   그림은 계속 빈다. 분모를 늘리면 R-00(미측정 > 0 → RED)에도 같이 걸린다.
item_id: VAR-FEE-DEDUCTION
product_type: VARIABLE_INSURANCE
name: 월공제액 차감 구조
status: draft
required_elements:
  - 보험료에서 계약체결비용·계약관리비용이 차감된 뒤 특별계정에 투입되고, 계약자적립액에서 위험보험료와 최저사망지급금·최저실적배당종신연금 보증비용이 매월 차감됨
  - 미상각신계약비(해약공제액)가 추가로 차감됨
  - 특별계정(펀드) 적립액에서 운용보수·증권거래비용·기초펀드보수가 별도로 차감됨
# U1 문턱 — 필수 요소 3개 중 3개.
# 셋은 **시점이 다른 세 차감**이다(납입 시·매월 · 해지 시 · 매일 펀드 기준가). 하나만 알면
# 나머지가 통째로 안 보인다.
#
# ❗`#392` 전에는 이 자리에 *"모수가 셋(보험료·해지·적립액)"* 이라고 적었는데, 요소 ① 이
# **이미 두 모수를 담고 있어서** 그 설명이 안 선다. 요소를 쪼개서 모수별로 맞추는 길도
# 있었지만 그러면 `u1_requires` 가 또 오르고, `#391` 이 기각한 이유(*"층으로 쪼개면 각
# 항목은 답이 되는데 전체 그림은 계속 빈다"*)에 그대로 걸린다 — 정세현도 같은 판단이다.
# 그래서 **요소 수는 그대로 두고 문면만 원문에 맞춘다.**
u1_requires: 3
misconception_conditions:
  - 낸 돈이 전부 투자된다
  - 낸 돈은 다 돌려받는다
  - 월공제액만 빠지고 나머지는 그대로 굴려진다
related_misconceptions:
  - M05-SAVINGS
  - M06-SURRENDER-VALUE
