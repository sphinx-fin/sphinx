# 소유: 윤지석 — 공개 의무. status·item_id 근거는 VAR-PRINCIPAL-LOSS.yaml 참고.
#
# ★ ADR-007 부수 발견 · PR #53: 이 항목은 "비대상"이 아니라 **부분 보호**다. 그래서
#   required_elements 가 "보호되지 않는다"가 아니라 **"어디까지 보호되는가"** 를 요구한다.
#   채점 난도가 올라간다.
#
#   PR #53 이 짚은 것 — 상품요약서 원문을 첫 문장에서 끊으면 뜻이 뒤집힌다.
#     "…보호되지 않습니다."                          ← 여기서 끊으면 비대상
#     "다만, … 최저사망지급금 … 에 한하여 … 보호됩니다"  ← 이어지는 문장이 범위를 정한다
#   `verify_quote_is_verbatim` 은 이걸 못 잡는다(글자가 원문과 다르지 않다). 인용 절단은
#   루브릭 설계로만 막을 수 있고, 그래서 보호 **범위**를 요구한다.
#
# PR #57 로 M02 가 ELS 전용이 됐다 — 변액에서 "예금자보호 되는 줄"은 부분적으로 참이라
# 결정론 상향이 오판이었다. 그래서 related_misconceptions 가 비어 있고, 이 항목은
# LLM + 루브릭 경로로만 잡힌다. 결정론 보조가 없으므로 조항을 더 촘촘히 썼다.
#
# ★ **`unlinked_until` 을 뺐다 — 조건 셋이 다 찼다** (이슈 #284 (a), 2026-09-05).
#
#   (1) 변액을 덮는 예금자보호 유형   ✅ M11-DEPOSIT-INSURANCE-SCOPE (#395, 정세현)
#   (2) 인용 가능한 근거              ✅ 상품요약서 p2 「상품의 특이사항」 축자 인용
#   (3) 부분적으로 참인 발화와 갈린다  ✅ **F-DET-001 3단계 극성 게이트**(#397·#423)
#
#   ❗(3) 이 3주 걸린 조건이다. `#395` 가 (1)(2) 를 채웠을 때 *"보험료 전액이 예금자보호
#   대상은 아니라고 하셨죠"* 라는 **맞는 말**이 `ngram 0.65` 로 걸려 U1 → U4 가 됐다.
#   패턴을 줄여도 `0.625` 로 임계 위였고, 점수가 패턴에 대한 최댓값이라 더하면 오탐이
#   올라가기만 했다 — **문면으로는 안 닫히는 구멍**이었다.
#
#   극성 게이트가 그걸 닫는다. 부분적으로 참인 발화 5건 실측(2026-09-05):
#
#       게이트 없이   오탐 1/5      ← ngram 0.65 로 걸리던 그 발화
#       게이트 태우고 오탐 **0/5**
#
#   ❗**안전은 패턴이 아니라 게이트에서 온다.** 게이트가 꺼지면(`client=None`) 이 링크는
#   다시 위험해진다 — `scoring.score` 가 판정 직전에 `apply_polarity_gate` 를 부르는
#   배선(#423)이 이 링크의 전제다. 그 호출을 지우면 여기도 같이 되돌려야 한다.
item_id: VAR-PARTIAL-DEPOSIT-INSURANCE
product_type: VARIABLE_INSURANCE
name: 예금자보호 범위
status: draft
required_elements:
  - 계약 전체가 아니라 약관에서 정한 최저보증과 특약에 한하여 보호된다
  - 보호 한도가 있다
# U1 문턱 — 필수 요소 2개 중 1개.
# 핵심은 「계약 전체가 아니다」 하나다. 「한도가 있다」는 그 안에 이미 들어 있어 둘 다 요구하면 같은 말을 두 번 시킨다
u1_requires: 1
misconception_conditions:
  - 예금처럼 전액 보호된다
  - 전혀 보호되지 않는다
  - 낸 보험료 전액이 보호 대상이다
related_misconceptions:
  - M11-DEPOSIT-INSURANCE-SCOPE

# 링크가 비어 있는 이유와 **빼는 조건**. 로더가 대조한다.
#
#   조건이 있는데 링크도 없고 이것도 없으면   → 기동 경고 (빠뜨림)
#   링크가 있는데 이것도 있으면              → 로딩 시점에 터진다 (모순)
#
# 「의도」로만 적으면 지우는 사건이 안 온다(결정 10.67). `until` 이 그 사건을 적는다.
