# 채점 임계값 (소유: 윤지석 · F-SCR-001 / F-DET-001)
#
# ❗**여기 없는 채점 임계값이 코드에 있으면 안 된다.** `gate_rules.yaml` 이 게이트 판정을
# 선언적으로 두는 것과 같은 이유다 — 룰이 **무엇에 반응하는지**와 **왜 그 값인지**가
# 파일로 나와 있어야 심사에서 설명이 되고, 튜닝이 코드 변경이 아니게 된다.
#
# 루브릭을 공개 의무로 두고 `u1_requires` 를 파일에 적게 한 것(#366)과 같은 층이다.
#
# ── 규약 ──────────────────────────────────────────────────────────────────
#   value       숫자. 이것만 코드가 읽는다
#   used_by     이 값을 읽는 자리
#   reacts_to   **무엇에 반응하는가** — 값이 아니라 대상. 이게 없으면 튜닝을 못 한다
#   why         왜 이 값인가. 실측이 있으면 조건까지 적는다
#
# 네 필드는 **전부 필수**다. `thresholds.py` 가 로딩 시점에 대조하고, 코드가 요구하는
# id 집합과도 대조한다 — 선언과 강제가 갈리면 어느 쪽이 참인지 알 수 없다.
version: 1

thresholds:
  ngram_match:
    value: 0.62
    used_by: misconception.match — 2단계(문자 바이그램)
    reacts_to: 고객 발화와 오해 패턴의 문자 바이그램 포함도
    why: >-
      1단계(글자 포함)가 놓치는 어미·조사 변형을 덮되 결정론을 유지하는 선.
      이 값을 낮추면 오탐이 늘고, 오탐 하나가 apply_misconception_floor 를 지나
      U4 → RED(판매 차단)로 직결된다. 그래서 낮추는 쪽은 정세현 합의가 필요하다.

  ngram_review:
    value: 0.45
    used_by: misconception.match — unclassified_candidate
    reacts_to: 위와 같은 포함도. 임계에 못 미치지만 무시하기엔 가까운 구간
    why: >-
      후보 큐의 하한. 하한이 없으면 큐가 전부를 담아 무의미해진다.
      이 값은 차단에 관여하지 않는다 — 사람이 나중에 보는 목록만 정한다.

  echo_match:
    value: 0.6
    used_by: scoring.echo_score / cap_confidence_if_echoed
    reacts_to: 고객 발화가 루브릭 조항·조건 원문을 그대로 옮긴 정도
    why: >-
      실제 발화 최대 echo 와 이 값 사이에 echo_margin_min 이상 여유가 있어야 한다.
      test_scoring 이 계약 정답으로 그 여유를 재고, 부족하면 빨개진다.
      ngram_match(0.62)와 계산은 같지만 숫자를 따로 둔다 — 재는 대상이 다르다.

  echo_margin_min:
    value: 0.15
    used_by: tests/test_scoring.py — 여유 검사
    reacts_to: 실제 발화의 최대 echo 와 echo_match 사이의 간격
    why: >-
      복창 판정이 정상 발화를 물기 시작하는 거리. 간격이 이보다 좁아지면
      계약 샘플이 조금만 바뀌어도 오탐이 난다 — 그 전에 빨개지라고 둔 값이다.

  echo_confidence_cap:
    value: 0.3
    used_by: scoring.cap_confidence_if_echoed
    reacts_to: 복창으로 판정된 답변의 confidence 상한
    why: >-
      ❗**게이트 R-05 를 실제로 발동시키는 유일한 값이다.** 모델 자기보고는
      0.7 아래로 내려간 적이 없다(70건 실측: 값이 1.0·0.9·0.7 셋뿐, 0.7 미만 0건).
      그래서 이 값이 R-05 임계값(0.7)보다 낮아야 그 룰이 산다 —
      server 의 EchoCapBelowR05Test 가 부등호를 대조한다(이슈 #268 · 결정 2.14).
      **올리기 전에 그 테스트와 gate_rules.yaml 을 같이 본다.**

  max_scoring_attempts:
    value: 2
    used_by: scoring.score — 근거 검증 실패 시 재판정 횟수
    reacts_to: verify_quote_is_verbatim / verify_rubric_clause_is_published 실패
    why: >-
      두 번째 시도는 seed 를 한 칸 옮겨 같은 답을 반복하지 않게 한다.
      늘리면 지연과 요금이 선형으로 늘고, 줄이면 MEASUREMENT_INVALID(502)가 는다.
      폴백 등급을 만들지 않기로 한 결정(10.10)이 이 값을 의미 있게 만든다.
