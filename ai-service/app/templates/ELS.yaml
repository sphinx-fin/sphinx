# 상품유형 템플릿 — ELS(주가연계증권). 소유: 윤지석
#
# 기획서 5절 [생성형 AI의 역할] 통제: **"상품유형 템플릿으로 추출 범위를 고정한다."**
# 즉 여기 없는 항목은 F-EXT-002 가 추출하지 않는다 — 이 파일이 F-EXT-003 재현율의
# **분모**다(이슈 #26).
#
# item_id 는 ADR-006 정본(`contracts/samples/*.json` 의 `_expected_risk_items`)을 따른다.
#
# `cue` 는 **상품에 무관해야 한다.** 계약 샘플의 value_text 에는 이 회차의 수치(85%·45%·70%)가
# 들어있지만 템플릿에 그것을 박으면 다른 발행사 문서에 붙지 않는다. 기획서 4절이 말한
# "신상품에도 바로 붙는다"가 성립하려면 찾는 단서만 두고 값은 추출 시점에 원문에서 가져와야
# 한다(P6 — 수치는 원문 인용만).
#
# `importance` 는 아직 미정이다. 정세현이 23종에 부여하기로 했고(이슈 #26), 그 값이
# `RiskItem.importance` 로 나가며 루브릭 작업 범위를 결정한다.
product_type: ELS
version: 1
answer_set_documents:            # ADR-007: 정답지는 단일 문서가 아니라 집합
  - 간이투자설명서
# ── importance 부여 기준 (결정 10.1 · 소유: 정세현) ───────────────────────────
# required     그 항목을 오해하면 **계약의 금전적 결과**(손실·환급금·현금화)를 잘못 이해하게
#              되고, 그 오해가 **오해 라이브러리 7종**(실제 분쟁조정례·기획서 데모 경로)으로
#              실증된 것. 윤지석의 루브릭 범위가 이것이다(10.1).
# recommended  알아야 하지만 오해가 금전 결과 이해를 직접 뒤집지는 않는 것 — 제도상 분류,
#              절차 권리, 비용 정의처럼 다른 층에 있는 것.
#
# 근거를 앞세우는 이유는 3.17 과 같다. "중요해 보인다" 로 required 를 늘리면 루브릭 분모가
# 커지고, 근거 없이 만든 항목이 채점을 확정하는 상태가 된다 — 개수보다 근거가 먼저다.
# 각 항목의 판단 근거는 importance 옆에 한 줄로 적었다.
# ─────────────────────────────────────────────────────────────────────────────

# `fallback_question` (F-INT-002)
#   LLM 없이 쓰는 항목별 기본 질문이다. 생성 질문이 정답 노출 검사를 MAX_ATTEMPTS 회 통과하지
#   못하면 이걸 낸다 — 인터뷰가 멈추면 세션 자체가 진행되지 않으므로 폴백이 없으면 안 된다.
#   **질문 안에 정답이 없어야 한다**(기획서 5절: "질문 안에 정답이 노출되지 않게 한다").
#   그래서 수치·조건값을 쓰지 않고 "어떻게 되는지 말씀해 주시겠어요" 형태로만 묻는다.
#   항목 레지스트리를 두 벌 만들지 않으려고 여기 둔다 — 별 파일로 빼면 23종 목록이 갈라진다.
items:
  - item_id: ELS-NO-DEPOSIT-INSURANCE
    name: 예금자보호 비대상
    importance: required    # M02 예금자보호 오인 — 분쟁조정례 직접 근거
    cue: 예금자보호법에 따라 보호되지 않는다는 고지
    fallback_question: 이 상품이 예금자보호를 받는지 어떻게 이해하고 계신지 말씀해 주시겠어요?
    section_hint: 표지 · 투자결정시 유의사항

  - item_id: ELS-PRINCIPAL-LOSS-WARNING
    name: 원금손실 가능성 고지
    importance: required    # M01 원금보장 오인 — 분쟁조정례 직접 근거
    cue: 투자원금의 손실이 발생할 수 있다는 고지
    fallback_question: 이 상품에 넣은 돈이 어떻게 될 수 있는지 본인 말씀으로 설명해 주시겠어요?
    section_hint: 표지 · 투자결정시 유의사항

  - item_id: ELS-HIGH-COMPLEXITY
    name: 고난도금융투자상품
    importance: recommended    # 제도상 분류 고지. 오해해도 금전 결과 이해가 뒤집히지 않는다
    # 자본시장법 시행령 제2조제7호의 정의 수치(원금의 100분의 20)는 cue 에 넣지 않는다 —
    # 법령 상수라 무해하지만 예외를 허용하면 상품 조건값이 섞여 들어온다.
    cue: 고난도금융투자상품 해당 여부와 그 판단 기준
    fallback_question: 이 상품이 어느 정도로 복잡하고 위험한 상품이라고 들으셨는지 말씀해 주시겠어요?
    section_hint: 투자위험 · 상품 해당여부

  - item_id: ELS-ELDERLY-COOLING
    name: 고령투자자 숙려제도 대상
    importance: recommended    # 절차 권리(숙려 대상 안내). 상품 이해와 다른 층이다
    cue: 65세 이상 고령투자자·부적합 투자자가 숙려제도 대상이라는 안내
    fallback_question: 청약하시기 전에 따로 생각할 시간을 두는 절차가 있다고 들으셨나요? 어떤 절차인지 말씀해 주시겠어요?
    section_hint: 투자위험 · 유의사항

  - item_id: ELS-EARLY-REDEMPTION-CONDITION
    name: 조기상환 조건
    importance: required    # M04 조기상환 구조 오인
    cue: 자동조기상환평가일에 기초자산이 모두 기준가격 이상일 때 상환된다는 조건
    fallback_question: 만기 전에 돈을 돌려받는 경우가 있다면 어떤 조건일 때인지 말씀해 주시겠어요?
    section_hint: 상환조건 · 손익구조

  - item_id: ELS-KNOCKIN-BARRIER
    name: 낙인 배리어
    importance: required    # M04. ADR-006 이 원금손실을 셋으로 쪼갠 이유가 이 항목이다
    cue: 낙인구간(최초기준가격의 일정 비율) 미만으로 하락한 이력 조건
    fallback_question: 기초자산이 어느 정도까지 떨어지면 문제가 되는지 말씀해 주시겠어요?
    section_hint: 상환조건 · 손익구조

  - item_id: ELS-MATURITY-LOSS-CONDITION
    name: 만기 손실조건
    importance: required    # M04. 낙인만 말하고 만기 조건을 빼먹은 답변이 U1 로 통과하면 안 된다
    cue: 만기평가일 기준가격 비율 미만일 때 손실이 발생한다는 조건
    fallback_question: 만기에 손실이 확정되는 경우가 어떤 상황인지 설명해 주시겠어요?
    section_hint: 상환조건 · 손익구조

  - item_id: ELS-TOTAL-LOSS-SCENARIO
    name: 전액손실 사례
    importance: required    # M03 확률 오인 — '반토막 날 리가' 의 반대편
    cue: 원금 전액손실 상환 사례
    fallback_question: 가장 나쁜 경우에 얼마를 잃을 수 있다고 이해하고 계신가요?
    section_hint: 손실 사례 · 수익률조견표

  - item_id: ELS-LOSS-SIMULATION
    name: 과거 데이터 수익률 모의실험
    importance: required    # M03. 기획 7-2 표가 이 모의실험이고 데모 경로다
    cue: 기초자산 과거 데이터를 이용한 수익률 모의실험 결과
    fallback_question: 과거 데이터로 해본 모의실험 결과를 어떻게 이해하셨는지 말씀해 주시겠어요?
    section_hint: 모의실험

  - item_id: ELS-MIDWAY-REDEMPTION-COST
    name: 중도상환 원금손실
    importance: required    # 중도상환 시 원금 미달 — 금전 결과가 직접 바뀐다
    cue: 실제 중도상환금액이 공정가액(기준가) 대비 일정 비율 이상이라는 조건
    fallback_question: 만기 전에 중간에 돈을 빼려면 어떻게 되는지 말씀해 주시겠어요?
    section_hint: 중도상환 · 유동성 위험

  - item_id: ELS-COOLING-PERIOD
    name: 숙려기간
    importance: recommended    # 절차(숙려기간 일수). 결과 이해와 다른 층이다
    cue: 판매 과정에서 확보되는 숙려기간(영업일 수)
    fallback_question: 청약 후에 다시 생각할 수 있는 기간이 있는지, 있다면 어떤 것인지 말씀해 주시겠어요?
    section_hint: 청약 · 숙려제도

  - item_id: ELS-NO-LISTING
    name: 환금성 제약(비상장)
    importance: required    # 비상장 = 만기 전 현금화 불가. 유동성 오해가 금전 결과다
    cue: 본 증권을 거래소에 상장하지 않을 예정이라는 고지
    fallback_question: 가입한 뒤에 이 상품을 팔고 싶으면 어떻게 되는지 말씀해 주시겠어요?
    section_hint: 유동성 위험

  - item_id: ELS-ISSUER-CREDIT-RISK
    name: 발행사 신용위험
    importance: required    # M01/M02 와 같은 층 — 윤지석 리뷰(PR #100) 수용. ELS-NO-DEPOSIT-INSURANCE
    # 의 required_elements 가 발행사 신용위험을 일부러 빼고 "별도 항목(ELS-ISSUER-CREDIT-RISK)
    # 의 범위" 라고 전제하는데, 그 항목이 recommended 면 "예금자보호 안 됨"은 묻고 "그래서 뭐가
    # 문제인가"는 안 묻는 상태가 된다 — 쪼갠 이유가 사라진다. M04 를 required 로 둔 근거("급하면
    # 빼면 되죠"가 오해다)와 같은 구조로, "증권사가 망할 리가"는 M01 의 사촌이다.
    cue: 발행인의 신용으로 발행되는 무보증 증권이라는 고지와 신용등급
    fallback_question: 이 상품을 발행한 회사에 문제가 생기면 어떻게 되는지 말씀해 주시겠어요?
    section_hint: 발행사 위험
