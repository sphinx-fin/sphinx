# 상품유형 템플릿 — 변액보험. 소유: 윤지석
# 설계 근거·규칙은 ELS.yaml 헤더 참고.
#
# ADR-007: 정답지가 **두 문서의 합집합**이다. 운용설명서는 이해항목 10종 중 3종만 덮고
# (found_in 아래 참고, PR #104 실측 — ADR-007 최초 표는 6종이었으나 파싱 전 정성적
# 검토였다) 계약체결·관리비용·저축과 다름·월공제액·중도인출·환급률 수치는 상품요약서에만
# 있다. 각 항목이 어느 문서에서 나오는지 `found_in` 에 적는다 — 파서 입력이 2종이므로
# 추출이 어느 문서를 봐야 하는지가 정해져야 한다.
product_type: VARIABLE_INSURANCE
version: 1
answer_set_documents:
  - 상품요약서
  - 변액보험 운용설명서
# `fallback_question` (F-INT-002)
#   LLM 없이 쓰는 항목별 기본 질문이다. 생성 질문이 정답 노출 검사를 MAX_ATTEMPTS 회 통과하지
#   못하면 이걸 낸다 — 인터뷰가 멈추면 세션 자체가 진행되지 않으므로 폴백이 없으면 안 된다.
#   **질문 안에 정답이 없어야 한다**(기획서 5절: "질문 안에 정답이 노출되지 않게 한다").
#   그래서 수치·조건값을 쓰지 않고 "어떻게 되는지 말씀해 주시겠어요" 형태로만 묻는다.
#   항목 레지스트리를 두 벌 만들지 않으려고 여기 둔다 — 별 파일로 빼면 23종 목록이 갈라진다.
