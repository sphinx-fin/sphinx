# 상품유형 템플릿 — 변액보험. 소유: 윤지석
# 설계 근거·규칙은 ELS.yaml 헤더 참고.
#
# ADR-007: 정답지가 **두 문서의 합집합**이다. 운용설명서는 이해항목 10종 중 6종만 덮고
# 월공제액·중도인출·환급률 수치는 상품요약서에만 있다. 각 항목이 어느 문서에서 나오는지
# `found_in` 에 적는다 — 파서 입력이 2종이므로 추출이 어느 문서를 봐야 하는지가 정해져야 한다.
product_type: VARIABLE_INSURANCE
version: 1
answer_set_documents:
  - 상품요약서
  - 변액보험 운용설명서
items:
