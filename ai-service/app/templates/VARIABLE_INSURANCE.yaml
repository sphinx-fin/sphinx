# 상품유형 템플릿 — 변액보험. 소유: 윤지석
# 설계 근거·규칙은 ELS.yaml 헤더 참고.
#
# ADR-007: 정답지가 **두 문서의 합집합**이다. 운용설명서는 이해항목 10종 중 6종만 덮고
# 월공제액·중도인출·환급률 수치는 상품요약서에만 있다. 각 항목이 어느 문서에서 나오는지
# `found_in` 에 적는다 — 파서 입력이 2종이므로 추출이 어느 문서를 봐야 하는지가 정해져야 한다.
product_type: VARIABLE_INSURANCE
version: 1
answer_set_documents:
  - 상품요약서
  - 변액보험 운용설명서
# ── importance 부여 기준 (결정 10.1 · 소유: 정세현) ───────────────────────────
# required     그 항목을 오해하면 **계약의 금전적 결과**(손실·환급금·현금화)를 잘못 이해하게
#              되고, 그 오해가 **오해 라이브러리 7종**(실제 분쟁조정례·기획서 데모 경로)으로
#              실증된 것. 윤지석의 루브릭 범위가 이것이다(10.1).
# recommended  알아야 하지만 오해가 금전 결과 이해를 직접 뒤집지는 않는 것 — 제도상 분류,
#              절차 권리, 비용 정의처럼 다른 층에 있는 것.
#
# 근거를 앞세우는 이유는 3.17 과 같다. "중요해 보인다" 로 required 를 늘리면 루브릭 분모가
# 커지고, 근거 없이 만든 항목이 채점을 확정하는 상태가 된다 — 개수보다 근거가 먼저다.
# 각 항목의 판단 근거는 importance 옆에 한 줄로 적었다.
# ─────────────────────────────────────────────────────────────────────────────

items:
  - item_id: VAR-PERFORMANCE-LINKED
    name: 실적배당형 성격
    importance: required    # M05 저축성 오인의 반대편 — 실적에 따라 변동된다
    cue: 실적배당형이므로 보험금·해약환급금이 특별계정 운용실적에 따라 변동된다는 고지
    section_hint: 상품의 성격
    found_in: [상품요약서, 운용설명서]

  - item_id: VAR-PRINCIPAL-LOSS
    name: 원금손실 가능성
    importance: required    # M01 원금보장 오인
    cue: 해약환급금에 최저보증이 없어 원금손실이 계약자에게 귀속된다는 고지
    section_hint: 상품의 성격 · 유의사항
    found_in: [상품요약서, 운용설명서]

  # 정답이 확정됐다(PR #53) — **부분 보호**다. 상품요약서 p2 를 한 문장에서 끊으면 "비대상"
  # 으로 읽히지만 이어지는 문장이 범위를 정한다.
  #   "…보호되지 않습니다. **다만, 약관에서 정한 최저사망지급금, 최저실적배당종신연금 및
  #    특약에 한하여** 예금자보호법에 따라 보호됩니다. 보호 한도는 … 1인당 1억원까지"
  # 운용설명서 p1 은 같은 내용을 긍정형으로만 쓴다. 두 문서가 충돌한 것이 아니라
  # **인용을 어디서 끊었는지**의 문제였다.
  #
  # item_id 는 계약 샘플(PR #53)에 맞춰 개칭 완료. name·cue 는 "어디까지 보호되는가"를
  # 요구하는 쪽으로 이미 올라가 있다(ADR-007 부수 발견).
  # 오해 라이브러리 M02 는 PR #57 로 ELS 전용이 됐다 — 변액에서 "예금자보호 되는 줄"은
  # 부분적으로 참이라 결정론 상향이 오판이었다.
  - item_id: VAR-PARTIAL-DEPOSIT-INSURANCE
    name: 예금자보호 범위
    importance: required    # M02 계열. #57 로 결정론 경로가 없어져 루브릭이 유일한 탐지 수단이다
    cue: 예금자보호가 적용되는 급부의 범위와 보호 한도
    section_hint: 표지 · 유의사항
    found_in: [상품요약서, 운용설명서]

  - item_id: VAR-WITHDRAWAL-FEE
    name: 중도인출 수수료
    importance: recommended    # 수수료율. 금전이지만 분쟁 근거가 없다
    cue: 중도인출 시 부과되는 수수료율·한도
    section_hint: 중도인출
    found_in: [상품요약서]

  - item_id: VAR-CONTRACT-COST
    name: 계약체결·관리비용 정의
    importance: recommended    # 비용 정의. 아래 FEE-DEDUCTION 이 그 결과를 담는다
    cue: 계약체결비용·계약관리비용이 보험료 중 일정비율로 책정된다는 정의
    section_hint: 비용 · 수수료
    found_in: [상품요약서]

  - item_id: VAR-FEE-DEDUCTION
    name: 월공제액 차감 구조
    importance: required    # 월공제 차감 구조 — 환급금이 납입보험료보다 적어지는 '이유' 다
    cue: 월공제액(위험보험료·계약체결관리비용·보증비용) 및 미상각신계약비 차감 구조
    section_hint: 해약환급금 산출
    found_in: [상품요약서]

  - item_id: VAR-NOT-BANK-SAVINGS
    name: 은행 저축과 다름
    importance: required    # M05 저축성 오인 직접
    cue: 보험이 은행 저축과 달리 위험보장과 저축을 겸비한 제도라는 고지
    section_hint: 해약환급금 · 유의사항
    found_in: [상품요약서]

  - item_id: VAR-SURRENDER-BELOW-PREMIUM
    name: 해약환급금이 납입보험료보다 적을 수 있음
    importance: required    # M06 해지환급금 오인 직접
    cue: 중도해지 시 해약환급금이 납입 보험료보다 적거나 없을 수 있다는 고지
    section_hint: 해약환급금
    found_in: [상품요약서]

  - item_id: VAR-EARLY-SURRENDER-RATIO
    name: 조기해지 환급률
    importance: required    # M06. 초기 시점 환급률이 분쟁이 나는 지점이다
    cue: 경과기간별 해약환급금 예시표의 **초기 시점** 환급률 수치
    section_hint: 해약환급금 예시표
    found_in: [상품요약서]

  - item_id: VAR-LONG-TERM-RATIO
    name: 장기 경과 환급률
    importance: recommended    # 장기 환급률은 회복 전망이고, 오해의 핵심은 초기 시점이다
    cue: 경과기간별 해약환급금 예시표의 **장기 시점** 환급률 수치
    section_hint: 해약환급금 예시표
    found_in: [상품요약서]
