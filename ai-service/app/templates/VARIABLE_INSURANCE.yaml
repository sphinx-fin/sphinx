    section_hint: 상품의 성격 · 유의사항
    found_in: [상품요약서, 운용설명서]

  # 정답이 확정됐다(PR #53) — **부분 보호**다. 상품요약서 p2 를 한 문장에서 끊으면 "비대상"
  # 으로 읽히지만 이어지는 문장이 범위를 정한다.
  #   "…보호되지 않습니다. **다만, 약관에서 정한 최저사망지급금, 최저실적배당종신연금 및
  #    특약에 한하여** 예금자보호법에 따라 보호됩니다. 보호 한도는 … 1인당 1억원까지"
  # 운용설명서 p1 은 같은 내용을 긍정형으로만 쓴다. 두 문서가 충돌한 것이 아니라
  # **인용을 어디서 끊었는지**의 문제였다.
  #
  # item_id 는 계약 샘플(PR #53)에 맞춰 개칭 완료. name·cue 는 "어디까지 보호되는가"를
  # 요구하는 쪽으로 이미 올라가 있다(ADR-007 부수 발견).
  # 오해 라이브러리 M02 는 PR #57 로 ELS 전용이 됐다 — 변액에서 "예금자보호 되는 줄"은
  # 부분적으로 참이라 결정론 상향이 오판이었다.
