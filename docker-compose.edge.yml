# SphinX 배포 — 엣지 스택(web/nginx + certbot). 소유: 오준서 (인프라 R)
#
# 이 파일은 옛 `docker-compose.yml`(`name: sphinx`, 5 서비스 한 프로젝트)에서 갈라져
# 나왔다 — "무중단 배포" 리라이트, 결정로그 7.39 의 후속.
#
# ── 이 스택이 상시 유지되는 이유 ──────────────────────────────────────────────
#
# `web` 은 80/443 을 물고 있는 **유일한 외부 진입점**이다. 예전엔 배포마다
# `docker compose up -d --build --force-recreate` 가 서비스를 안 가려서 이 컨테이너도
# 매번 내려갔다 올라왔고, `mysql`(healthcheck start_period 60s) → `ai-service`(20s)
# → `server`(Spring Boot 부팅 + 40s) 체인이 끝나야 다시 떴다 — 이게 배포마다 사이트
# 전체가 몇 분씩 끊기던 원인이다. `web` 은 리포 트리를 bind mount 하지 않고 named
# volume 만 쓰므로(아래) 애초에 트리 교체 때 재생성될 이유가 없었다.
#
# 지금은 `server`(blue/green, `docker-compose.app.yml`)가 다른 compose 프로젝트에서
# 뜨고, `web` 은 **그 컨테이너가 바뀌어도 재생성되지 않는다.** 대신 배포 스크립트가
# `docker exec` 로 `/etc/nginx/upstream/active.conf` 를 다시 쓰고 `nginx -s reload`
# 로 업스트림을 바꾼다 — reload 는 워커를 새로 띄우고 기존 연결은 끝날 때까지 두는
# 무중단 동작이다(`web/docker-entrypoint.d/30-cert-reload.sh` 가 인증서 갱신에 이미
# 쓰고 있는 것과 같은 메커니즘).
#
# `web` 자신의 이미지·환경변수(`SPHINX_API_USER` 등)가 바뀌는 배포(프론트 코드 변경,
# 명부 변경)는 여전히 이 컨테이너를 재생성한다 — 그건 드물고, 그때만 짧게 끊긴다.
#
# 쓰는 법:
#   docker compose -f docker-compose.edge.yml -p sphinx-edge up -d --build
#
# 자세한 배포 절차는 `docs/deployment.md`.

name: sphinx-edge

services:
  # ── web (정적 dist + nginx) — 유일하게 외부에 열리는 서비스 ────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      # 보안그룹도 80·443 만 연다. 8000·8100 은 인바운드에 넣지 않는다(#41).
      # 443 은 인증서가 있을 때만 실제로 listen 한다(web/docker-entrypoint.d/20-tls.sh) —
      # 포트를 게시해 두는 것은 그 뒤 재기동 없이 붙게 하려는 것이고, 인증서가 없는 동안
      # 이 포트로 들어오면 그냥 연결이 끊긴다.
      - "80:80"
      - "443:443"
    mem_limit: 128m
    environment:
      # server 와 **같은 값**이어야 한다. nginx 가 이 값으로 htpasswd 를 만들고, 브라우저가
      # 실어 보낸 Authorization 이 그대로 server 로 넘어가 거기서 다시 검증되기 때문이다.
      # 출처가 SSM 하나라 갈릴 일이 없다(scripts/deploy_ec2.sh).
      SPHINX_API_USER: ${SPHINX_API_USER:?SSM 에서 받는다 — scripts/deploy_ec2.sh 참조}
      SPHINX_API_PASSWORD: ${SPHINX_API_PASSWORD:?SSM 에서 받는다 — scripts/deploy_ec2.sh 참조}
      # htpasswd 에 넣을 **명부 전체**의 id 목록(쉼표 구분). 없으면 위 한 계정만 만들어지고
      # 나머지 역할은 nginx 에서 401 이라 역할 분리 시연이 안 된다(이슈 #213).
      #
      # ❗여기에 목록을 적지 않는다. 값은 `scripts/deploy_ec2.sh` 가 `demo_accounts.yaml`
      # 에서 뽑아 넣는다 — 명부가 근거이고, 여기 적으면 계정 목록이 두 벌이 된다.
      # `:?` 를 안 쓰는 이유는 손으로 띄우는 compose 를 막지 않기 위해서다. 그때는
      # 엔트리포인트가 한 계정만 만들고 **경고를 남긴다**(조용히 줄지 않는다).
      SPHINX_API_USERS: ${SPHINX_API_USERS:-}
      # ── 화면을 잠글지 열지 ────────────────────────────────────────────────
      # 기본은 **잠금**이다. `1` 이면 nginx 가 auth_basic 을 끄고 `/api/` 에 아래 계정의
      # 자격증명을 대신 실어 준다 — 인증을 없애는 게 아니라 **대신 로그인해 주는 것**이다.
      # Spring 의 prod 체인과 `@PreAuthorize` 는 그대로 돈다. 진짜로 인증만 끄면 익명은
      # 역할이 없어서 세션 생성부터 403 이고, 로그인 창만 사라지고 화면은 더 안 된다.
      #
      # ❗대가: 감사 로그의 "누가" 가 아래 계정들로 굳는다. 그리고 **한 계정으로는 전 화면이
      # 안 열리므로**(집계는 COMPL, 오버라이드 승인은 MGR) 경로별로 갈라 넣는다. 근거는
      # `web/docker-entrypoint.d/15-demo-mode.sh` 머리말.
      SPHINX_DEMO_OPEN: ${SPHINX_DEMO_OPEN:-}
      SPHINX_DEMO_ACTOR: ${SPHINX_DEMO_ACTOR:-seller-01}
      SPHINX_DEMO_ACTOR_AGGREGATE: ${SPHINX_DEMO_ACTOR_AGGREGATE:-compl-01}
      SPHINX_DEMO_ACTOR_APPROVER: ${SPHINX_DEMO_ACTOR_APPROVER:-mgr-01}
      SPHINX_DEMO_ACTOR_MANAGE: ${SPHINX_DEMO_ACTOR_MANAGE:-admin-01}
      # 인증서를 찾을 이름. 비면 443 을 아예 안 세운다(로컬·IP 접속).
      SPHINX_PUBLIC_HOST: ${SPHINX_PUBLIC_HOST:-}
    volumes:
      # 인증서는 certbot 이 쓰고 nginx 는 읽기만 한다.
      - letsencrypt:/etc/letsencrypt:ro
      # ACME 챌린지 — certbot 이 파일을 쓰고 nginx 가 :80 으로 내보낸다.
      - certbot-webroot:/var/www/certbot:ro
      # ❗**blue/green 컷오버의 유일한 상태 저장소.** 디렉토리째 마운트한다 — 파일
      # 하나만 골라 마운트하는 방법(이미지가 기본값을 이미 COPY 해 둔 파일에 named
      # volume 을 바로 물리는 것)을 시도했지만, 컨테이너 런타임이 "디렉토리를 파일에
      # 마운트하려 한다"며 기동을 거부했다(named volume 은 항상 디렉토리로 취급된다 —
      # 실측). 그래서 디렉토리(`/etc/nginx/upstream`)를 통째로 마운트하고,
      # `docker-entrypoint.d/05-upstream-seed.sh` 가 비어 있을 때만 기본값(blue)을
      # 써 넣는다. 배포 스크립트가 이후 `docker exec` 로
      # `/etc/nginx/upstream/active.conf` 를 덮어쓰고 `nginx -s reload` 하면, 그
      # 값이 이 볼륨에 남아 `web` 컨테이너 재생성(예: 프론트 배포)을 넘어서도 "지금
      # 라이브인 색"을 기억한다 — 배포 스크립트가 이 파일을 읽어서 현재 색을 판정하는
      # 유일한 근거이기도 하다(별도 상태 파일을 안 둔다).
      - nginx-upstream:/etc/nginx/upstream
    networks: [edge]
    # ❗`depends_on: server` 가 없다. `server` 는 이제 다른 compose 프로젝트
    # (`sphinx-blue`/`sphinx-green`)라 이 파일에서 참조할 수 없다 — `web` 은 백엔드
    # 없이도 뜰 수 있어야 한다(최초 부팅, 또는 두 색 다 내려간 순간에도 정적 화면+에러
    # 응답 정도는 낼 수 있어야 한다). 새 색이 healthy 한지는 배포 스크립트가 직접
    # `docker inspect` 로 폴링한다.
    restart: unless-stopped

  # ── certbot (Let's Encrypt) — 평소엔 갱신만 돈다 ───────────────────────────
  #
  # 첫 발급은 사람이 한 번 돌린다(docs/deployment.md §9.2) — **배포 스크립트로 부른다.**
  # 이 파일의 비밀들이 `${VAR:?}` 라 값 없이 `docker compose` 를 부르면 명령이 무엇이든
  # 파일 해석 단계에서 죽고, 값을 가진 것은 그 스크립트뿐이다(SSM 에서 받는다).
  #
  #   SPHINX_PUBLIC_HOST=… ./scripts/deploy_ec2.sh --cert   # 발급 + web 재기동까지
  #
  # ❗손으로 `docker compose run` 을 칠 일이 생기면 **`--entrypoint certbot` 을 반드시
  # 붙인다.** `run` 은 `command` 만 덮고 아래 `entrypoint: /bin/sh` 는 안 덮으므로,
  # 빼면 `/bin/sh certonly …` 가 되어 certbot 이 아예 안 불린다(exit 127).
  #
  # ❗**발급을 자동으로 돌리지 않는다.** Let's Encrypt 는 실패에도 rate limit(같은 도메인
  # 1시간 5회)을 매기는데, 배포마다 자동 발급을 시도하면 DNS 나 :80 이 잠깐 어긋난 날
  # **한도를 태워서 정작 필요한 순간에 못 받는다.** 갱신은 그 위험이 없다 — 이미 받은
  # 인증서가 있고 만료 30일 전에만 실제로 움직인다.
  certbot:
    image: certbot/certbot:latest
    mem_limit: 64m
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    networks: [edge]
    # 12시간마다 갱신을 시도한다. 만료 30일 전이 아니면 아무 일도 안 하고 끝난다.
    # `trap`·`wait` 는 `docker compose down` 에 바로 반응하기 위한 것이다 — 없으면
    # `sleep` 이 끝날 때까지(최대 12시간) SIGTERM 을 못 받고 10초 뒤 강제 종료된다.
    entrypoint: /bin/sh
    command: -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'
    restart: unless-stopped

volumes:
  # 인증서와 계정 키. **지우면 재발급이고 rate limit 을 태운다.**
  #
  # ❗**이름을 옛 프로젝트(`sphinx`)의 볼륨으로 고정 핀다** — mysql-data 와 같은 이유
  # (docker-compose.data.yml 참조). 안 하면 Compose 가 `sphinx-edge_letsencrypt` 라는
  # 새 빈 볼륨을 만들어 인증서를 다시 받아야 하고, 그건 rate limit 을 태운다.
  letsencrypt:
    name: sphinx_letsencrypt
  certbot-webroot:
    name: sphinx_certbot-webroot
  # blue/green 컷오버 상태. 새 볼륨이라 옛 프로젝트에 대응물이 없다 — 이름 고정이
  # 필요 없다(다만 `sphinx-edge` 프로젝트 자체가 안 바뀌는 한 이름은 어차피 고정이다).
  nginx-upstream:

networks:
  # ❗**고정 이름이 필요하다.** blue/green(`docker-compose.app.yml`)이 다른 compose
  # 프로젝트에서 `external: true` 로 이 네트워크를 참조하므로, Compose 의 기본
  # 프로젝트-접두 네트워크 이름(`sphinx-edge_edge`)이 아니라 여기서 고정한 이름을
  # 그대로 알아야 한다.
  edge:
    driver: bridge
    name: sphinx-edge-net
