# 배포용 nginx. 소유: 오준서
#
# 개발의 `vite.config.ts` server.proxy 에 대응하는 배포 쪽 짝이다. 두 곳이 같은 규칙을
# 표현하므로 한쪽만 고치면 "로컬은 되는데 배포에서만 404" 가 난다 — 클라이언트가
# `client.ts` 의 `BASE = "/api"` 로 붙이는 접두어를 여기서도 똑같이 벗겨야 한다.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── 인증 ────────────────────────────────────────────────────────────────
    # ❗사이트 전체에 건다. `/api` 에만 걸면 안 된다 — 브라우저는 **문서 요청(내비게이션)**
    # 의 401 에만 자격증명 대화상자를 띄우고 `fetch()` 의 401 로는 안 띄운다. 그러면
    # 화면은 열리고 모든 API 호출이 조용히 401 이 되며, 그 사실을 데모 중에 알게 된다.
    #
    # 한 번 입력하면 브라우저가 오리진 단위로 캐시해 이후 `fetch` 에 자동으로 실린다 —
    # **화면 코드는 0줄이다.** 그리고 여기서 받은 Authorization 은 아래 프록시가 그대로
    # upstream 으로 넘기므로 server 의 prod 인증(#50)도 같은 자격증명으로 통과한다.
    # 자격증명 출처가 SSM 하나로 유지된다(결정로그 10.6 · #41 ①).
    #
    # 데모 흐름과도 맞는다: 판매자가 처음 열 때 한 번 입력하고, 고객은 같은 브라우저를
    # 이어받으므로 고객 화면에서 자격증명을 묻지 않는다(S-02 설계 판단 ④).
    #
    # ⚠️ 이건 인증이지 인가가 아니다. 계정이 하나라 감사 로그의 "누가" 는 여전히 한 명이고
    # 역할 분리 시연(ADR-001)은 이걸로 안 된다 — 그건 F-CMN-002 몫이다. 다만 이 구성은
    # 그 위에 계정을 늘리는 것을 막지 않는다(고정 헤더 주입은 막는다).
    auth_basic           "sphinx";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # 판정 근거·리포트가 오가므로 중간 캐시에 남기지 않는다.
    add_header Cache-Control "no-store" always;
    # 화면이 iframe 안에서 뜰 일이 없다. server 의 prod 프로파일도 frameOptions DENY 다.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ── API 프록시 ──────────────────────────────────────────────────────────
    # `/api/sessions` → `server:8000/sessions`. proxy_pass 의 URI 부분(`/`)이 location
    # 접두어를 대체하므로 이 한 줄이 vite 의 `rewrite: p => p.replace(/^\/api/, "")` 와 같다.
    location /api/ {
        proxy_pass http://server:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ❗여기에 Authorization 을 고정으로 박지 않는다. 그러면 화면에 닿는 사람은 전부
        # 인증된 상태로 API 에 닿고, #50 이 세운 인증이 프록시 한 줄로 무력화된다. 감사
        # 로그의 "누가" 도 그 고정 계정 하나로 굳는다(결정로그 10.5 · 10.6 · vite.config.ts).
        # 자격증명은 브라우저가 실어 보낸 것을 그대로 넘긴다 — 위 auth_basic 이 받아낸
        # Authorization 헤더가 proxy_pass 로 그대로 전달된다(nginx 는 이 헤더를 안 지운다).

        # LLM 채점·재설명은 느릴 수 있다. 기본 60s 로는 데모 중에 502 가 난다.
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # ── SPA ─────────────────────────────────────────────────────────────────
    # react-router 가 클라이언트 라우팅을 하므로 /sessions/... 같은 경로로 새로고침하면
    # 파일이 없다. index.html 로 떨어뜨려야 라우터가 받는다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
