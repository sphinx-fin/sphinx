# 배포용 nginx — :80 진입점. 소유: 오준서
#
# 개발의 `vite.config.ts` server.proxy 에 대응하는 배포 쪽 짝이다. 두 곳이 같은 규칙을
# 표현하므로 한쪽만 고치면 "로컬은 되는데 배포에서만 404" 가 난다 — 클라이언트가
# `client.ts` 의 `BASE = "/api"` 로 붙이는 접두어를 여기서도 똑같이 벗겨야 한다.
#
# ── 이 파일이 전부가 아니다 ────────────────────────────────────────────────
#
# 앱 본체(`root`·인증·`/api` 프록시·SPA 폴백)는 `snippets/app.conf` 에 있고 **여기와 443
# 블록이 그 파일 하나를 include 한다.** 443 블록은 인증서가 있을 때만 생기므로
# `docker-entrypoint.d/20-tls.sh` 가 기동 때 만든다.
#
#   conf.d/00-demo-mode.conf   15-demo-mode.sh  잠금/개방 · 경로별 데모 계정
#   conf.d/10-tls.conf         20-tls.sh        443 블록 (인증서가 있을 때만)
#   snippets/app.conf          COPY             앱 본체 — 80·443 공용(blue/green 업스트림도 여기서 include)
#
# 셋 다 생성 시점이 기동이라, **무엇이 올라갔는지는 컨테이너 로그가 말한다.**

# ── https 리다이렉트를 정하는 두 map ────────────────────────────────────────
#
# ❗**server 레벨 `if` 는 location 을 고르기 전에 돈다.** 그래서 `if ($sphinx_tls)` 만 두면
# 아래 ACME location 까지 https 로 튕긴다 — 실측으로 잡았다(챌린지 요청이 301 이었다).
# Let's Encrypt 가 리다이렉트를 따라가 주기는 하지만, **갱신 경로를 리다이렉트에 기대게
# 두지 않는다.** 인증서가 만료되는 날 그 리다이렉트 대상이 곧 만료된 인증서다.
#
# `if` 는 AND 를 못 쓰므로 두 값을 이어 붙여 map 하나로 판단한다.
#
#   $sphinx_tls    20-tls.sh 가 만든다 — 인증서가 있으면 1
#   $sphinx_acme   이 파일 — 챌린지 경로면 1
#   "10" 일 때만(= TLS 있고 챌린지 아님) 튕긴다
map $request_uri $sphinx_acme {
    default                          0;
    ~^/\.well-known/acme-challenge/  1;
}

map "$sphinx_tls$sphinx_acme" $sphinx_https_redirect {
    default 0;
    "10"    1;
}

server {
    listen 80;
    server_name _;

    # ── ACME (Let's Encrypt HTTP-01) ────────────────────────────────────────
    # ❗**인증보다 먼저, 리다이렉트보다 먼저 와야 한다.** 잠금 모드에서 auth_basic 이
    # 걸리면 Let's Encrypt 가 챌린지 파일을 못 읽어 발급·갱신이 통째로 실패하고, https 로
    # 튕기면 아직 인증서가 없는 첫 발급에서 자기 자신을 막는다. 그래서 이 location 은
    # app.conf 를 include 하기 전에 두고 auth_basic 을 명시적으로 끈다.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }

    # 인증서가 서 있고 ACME 챌린지가 아니면 https 로 보낸다(위 두 map). 인증서가 없으면
    # 0 이라 이 블록이 그대로 앱을 서빙한다(첫 발급 전 · 로컬 · IP 접속).
    #
    # `if` 를 쓰는 것은 nginx 에서 조심할 일이지만, **`return` 하나만 두는 형태**는
    # 공식 문서가 안전하다고 적은 두 용례 중 하나다(다른 하나는 rewrite … last).
    if ($sphinx_https_redirect) {
        return 301 https://$host$request_uri;
    }

    include /etc/nginx/snippets/app.conf;
}
