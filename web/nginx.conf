# 배포용 nginx. 소유: 오준서
#
# 개발의 `vite.config.ts` server.proxy 에 대응하는 배포 쪽 짝이다. 두 곳이 같은 규칙을
# 표현하므로 한쪽만 고치면 "로컬은 되는데 배포에서만 404" 가 난다 — 클라이언트가
# `client.ts` 의 `BASE = "/api"` 로 붙이는 접두어를 여기서도 똑같이 벗겨야 한다.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 판정 근거·리포트가 오가므로 중간 캐시에 남기지 않는다.
    add_header Cache-Control "no-store" always;
    # 화면이 iframe 안에서 뜰 일이 없다. server 의 prod 프로파일도 frameOptions DENY 다.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ── API 프록시 ──────────────────────────────────────────────────────────
    # `/api/sessions` → `server:8000/sessions`. proxy_pass 의 URI 부분(`/`)이 location
    # 접두어를 대체하므로 이 한 줄이 vite 의 `rewrite: p => p.replace(/^\/api/, "")` 와 같다.
    location /api/ {
        proxy_pass http://server:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ❗여기에 Authorization 을 고정으로 박지 않는다. 그러면 화면에 닿는 사람은 전부
        # 인증된 상태로 API 에 닿고, #50 이 세운 인증이 프록시 한 줄로 무력화된다. 감사
        # 로그의 "누가" 도 그 고정 계정 하나로 굳는다(결정로그 10.5 · 10.6 · vite.config.ts).
        # 자격증명은 브라우저가 실어 보낸 것을 그대로 넘긴다.

        # LLM 채점·재설명은 느릴 수 있다. 기본 60s 로는 데모 중에 502 가 난다.
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # ── SPA ─────────────────────────────────────────────────────────────────
    # react-router 가 클라이언트 라우팅을 하므로 /sessions/... 같은 경로로 새로고침하면
    # 파일이 없다. index.html 로 떨어뜨려야 라우터가 받는다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
