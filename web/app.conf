# 앱 본체 — 80 과 443 **양쪽 server 블록이 이 파일 하나를 include 한다.** 소유: 오준서
#
# 두 블록에 같은 내용을 복사해 두면 한쪽만 고치는 날이 오고, 그 차이는 "https 로 들어오면
# 안 되는 화면" 처럼 프로토콜에 따라서만 드러난다 — 눈으로 안 보이는 종류다.
#
# 이 파일은 `server` 컨텍스트 안에 들어간다(`/etc/nginx/snippets/app.conf`).

root /usr/share/nginx/html;
index index.html;

# ── 인증 ────────────────────────────────────────────────────────────────────
# ❗사이트 전체에 건다. `/api` 에만 걸면 안 된다 — 브라우저는 **문서 요청(내비게이션)** 의
# 401 에만 자격증명 대화상자를 띄우고 `fetch()` 의 401 로는 안 띄운다. 그러면 화면은 열리고
# 모든 API 호출이 조용히 401 이 되며, 그 사실을 데모 중에 알게 된다.
#
# 한 번 입력하면 브라우저가 오리진 단위로 캐시해 이후 `fetch` 에 자동으로 실린다 —
# **화면 코드는 0줄이다.** 여기서 받은 Authorization 은 아래 프록시가 그대로 upstream 으로
# 넘기므로 server 의 prod 인증(#50)도 같은 자격증명으로 통과한다(결정로그 10.6 · #41 ①).
#
# ❗**잠글지 열지는 기동 때 정해진다.** `docker-entrypoint.d/15-demo-mode.sh` 가
# `conf.d/00-demo-mode.conf` 에 변수를 만들어 둔다. 이 파일은 두 모드에서 같은 문장으로
# 서고, 어느 쪽인지는 환경변수 `SPHINX_DEMO_OPEN` 하나가 정한다.
#
#   $sphinx_auth_realm   "sphinx" → 로그인 요구  ·  off → auth_basic 끔
#   $sphinx_api_auth     $http_authorization    ·  경로에 맞는 데모 계정의 "Basic …"
#
# `auth_basic` 이 변수를 받고 값이 `off` 면 인증이 꺼진다(nginx 1.3.10+). 개방 모드에서도
# 이 두 줄을 지우지 않는다 — 지우면 되돌릴 때 파일을 고쳐야 하고, 그건 배포마다 갈린다.
auth_basic           $sphinx_auth_realm;
auth_basic_user_file /etc/nginx/.htpasswd;

# 판정 근거·리포트가 오가므로 중간 캐시에 남기지 않는다.
add_header Cache-Control "no-store" always;
# 화면이 iframe 안에서 뜰 일이 없다. server 의 prod 프로파일도 frameOptions DENY 다.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;

# ── API 프록시 ──────────────────────────────────────────────────────────────
#
# ❗**리터럴 호스트명도, 정적 `upstream {}` 블록도 아니다 — resolver + 변수다.**
# 처음엔 `upstream app_backend { server server-blue:8000; }` 를 시도했는데, 정적
# upstream 의 서버 이름은 **nginx 기동·reload 시점에 한 번** DNS 를 풀고, 그때
# 실패하면(`emerg: host not found in upstream`) **nginx 가 아예 안 뜬다.** blue
# 스택이 아직 없는 최초 배포에서 정확히 이 상태로 크래시루프를 실측했다 — web 이
# server 보다 먼저 뜨는 게 이 설계의 전제인데, 정적 upstream 은 그 순서를 못 견딘다.
#
# 그래서 `$sphinx_backend` 변수 + `resolver`(Docker 내장 DNS, 127.0.0.11)로 바꿨다 —
# 이러면 DNS 조회가 **요청이 올 때마다** 일어나고, 대상이 아직 없으면 그 요청만
# 502 가 될 뿐 nginx 자체는 멀쩡히 뜬다. 값은 `upstream/active.conf`
# (named volume, docker-compose.edge.yml)의 `set $sphinx_backend "http://server-blue:8000";`
# 한 줄이 정한다 — 배포 스크립트가 이 파일을 고쳐 쓰고 `nginx -s reload` 하면 다음
# 요청부터 새 색으로 나간다. (대가: 변수를 쓰는 proxy_pass 는 upstream keepalive
# 커넥션 풀링을 못 쓴다 — 요청마다 새로 연결한다. 데모 트래픽 규모에선 무시할 비용이다.)
resolver 127.0.0.11 valid=10s;
include /etc/nginx/upstream/active.conf;

# `/api/sessions` → `<라이브 색>:8000/sessions`. 변수를 쓰는 proxy_pass 는 리터럴
# proxy_pass 와 달리 **location 접두어를 자동으로 벗기지 않는다** — 그래서 vite 의
# `rewrite: p => p.replace(/^\/api/, "")` 와 같은 일을 여기서 명시적으로 한다.
location /api/ {
    # ❗**계정 지도를 여기서 한 번 읽어 값을 굳힌다 — 아래 rewrite 가 `$uri` 를 바꾸기 때문이다.**
    # `15-demo-mode.sh` 의 map 은 `$uri` 로 계정을 고르는데(결정 7.35), map 은 **지연 평가**라
    # 실제로 읽히는 순간은 아래 `proxy_set_header` 다. 그때 `$uri` 는 이미 rewrite 를 거쳐
    # `/dashboard/heatmap` 이라 **`~^/api/…` 규칙이 하나도 안 맞고 전부 `default`(seller-01)**
    # 로 떨어진다. 그러면 집계·신호 화면이 개방 모드에서도 403 이다.
    #
    # 실측(alpha, 2026-09-07): `/api/products` **200** · `/api/dashboard/heatmap` **403**
    # · `/api/signals/unfair` **403** — default 만 살고 비-default 규칙이 전멸한 모양 그대로다.
    #
    # ❗**#513 이 들여왔다.** 옆에 있는 rewrite 는 blue/green 으로 가면서 생겼다 — 옛
    # 형태인 `proxy_pass http://server:8000/;` 는 URI 부분(`/`)이 location 접두어를
    # **대체**할 뿐 `$uri` 를 안 건드렸다. 변수 proxy_pass 는 대체를 못 해 rewrite 가
    # 필요했고, 그 rewrite 가 계정 지도를 같이 데리고 갔다. **nginx 설정 검사도,
    # `DemoModeAccountMapTest` 도 이걸 못 잡는다** — 그 테스트는 생성된 지도 문자열과
    # `rbac_policy.yaml` 을 대조할 뿐, nginx 가 런타임에 `$uri` 를 무엇으로 보는지는
    # 모른다(결정 10.65 가 예고한 *"한 겹 더"* 가 이것이다).
    #
    # `set` 은 rewrite 단계에서 **적힌 순서대로** 실행되므로 이 줄이 아래 rewrite 보다
    # 먼저 돌고, 그 순간의 `$uri`(= 원본 `/api/…`)로 map 이 평가된다.
    # 이 줄을 rewrite 아래로 내리면 같은 고장이 그대로 돌아온다.
    set $sphinx_auth_header $sphinx_api_auth;

    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $sphinx_backend;

    # ❗**상품문서 업로드가 이 값에 걸린다**(F-EXT-001 · 이슈 #521). nginx 기본은 1MB 이고
    # 실측한 공시 PDF 가 그 선에 걸쳐 있다(데모 문서 0.33~1.63MB) — 넘으면 nginx 가 **413** 을
    # 내고 요청이 server 에 아예 도달하지 않는다. 그러면 Spring 의 상한을 아무리 올려도
    # 소용이 없고, 화면은 공통 봉투가 아닌 nginx HTML 오류를 받는다.
    #
    # server 쪽 상한(`spring.servlet.multipart.max-request-size` = 25MB)보다 **넉넉하게**
    # 둔다. 이 값이 더 작으면 거부 판정이 nginx 로 올라가고, 그쪽 413 에는 error.code 가
    # 없어서 화면이 «파일이 너무 큽니다» 를 말할 수 없다 — 거부는 봉투를 아는 쪽에서 해야 한다.
    client_max_body_size 32m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ❗**잠금 모드에서는 이 줄이 아무것도 안 바꾼다** — `$sphinx_api_auth` 가
    # `$http_authorization` 이라 브라우저가 보낸 값을 그대로 넘긴다(nginx 의 기본 동작과
    # 같다). 개방 모드에서만 경로에 맞는 데모 계정의 자격증명이 들어간다.
    #
    # 원래 이 자리에는 *"여기에 Authorization 을 고정으로 박지 않는다"* 는 금지가 있었다.
    # 개방 모드는 그 금지를 **알고 어기는** 자리다 — 감사 로그의 "누가" 가 주입 계정으로
    # 굳는다. 그래서 기본값이 아니고, 기동 로그가 어느 계정으로 열렸는지 매번 찍는다.
    # 경로별로 계정이 갈리는 이유(한 계정으로는 전 화면이 안 열린다)는 15-demo-mode.sh 에 있다.
    proxy_set_header Authorization $sphinx_auth_header;

    # LLM 채점·재설명은 느릴 수 있다. 기본 60s 로는 데모 중에 502 가 난다.
    proxy_connect_timeout 10s;
    proxy_read_timeout    120s;
    proxy_send_timeout    120s;
}

# ── SPA ─────────────────────────────────────────────────────────────────────
# react-router 가 클라이언트 라우팅을 하므로 /sessions/... 같은 경로로 새로고침하면 파일이
# 없다. index.html 로 떨어뜨려야 라우터가 받는다.
location / {
    try_files $uri $uri/ /index.html;
}
