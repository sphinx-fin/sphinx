<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SphinX">
  <!--
    SphinX 심볼 — 갈라진 피라미드.

    삼각형이 아래 1/3 지점에서 수평으로 끊긴다. 그 틈이 문턱이다 — 위로 올라가려면
    건너야 하고, 건너지 못하면 아래에 남는다. 제품이 하는 일 그대로다.

    끊는 위치를 아래 1/3 에 둔 이유: 실제 피라미드의 입구 높이이고, 그 비율이라야
    윗덩어리가 무겁게 앉아 기념비적으로 보인다. 가운데서 자르면 두 조각이 대등해져서
    "쌓인 것"으로 읽히고 관문이라는 뜻이 사라진다.

    단색이다. 브랜드 원칙이 "판정만 색을 가진다"이므로 심볼에는 채도를 넣지 않는다.
    currentColor 를 쓰므로 놓이는 자리의 글자색을 그대로 따른다.
  -->
  <path fill="currentColor" d="M16 3 L24.19 18.2 L7.81 18.2 Z"/>
  <path fill="currentColor" d="M6.31 21 L25.69 21 L30 29 L2 29 Z"/>
</svg>
