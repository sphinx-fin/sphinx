openapi: 3.0.3
info:
  title: SphinX API
  version: 0.1.0
  description: >
    web ↔ server REST 계약. ai-service(내부망 전용)의 /internal/* 인터페이스는 여기 없다 —
    그 경계의 페이로드는 contracts/*.schema.json(judgment·risk_item·parsed_document)으로 계약한다.
paths:
  /products/documents:      {post: {summary: "문서 업로드 (F-EXT-001)"}}
  /products/{id}/extract:   {post: {summary: "위험요소 추출 (F-EXT-002)"}}
  /products/{id}/risk-items: {get: {summary: "추출 항목 조회"}}

  /sessions:
    post:
      summary: 세션 생성 (F-INT-001)
      description: 비식별 속성만 받는다 — 성명·주민번호 필드는 스키마에 존재하지 않는다 (P3).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSessionRequest'}
      responses:
        '200':
          description: 생성된 세션(상태 CREATED)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionApiResponse'}
        '400':
          description: 필수 속성 누락 또는 유효성 오류
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /sessions/{id}:
    get:
      summary: 세션 상태 조회 (F-INT-001)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 세션
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionApiResponse'}
        '404':
          description: 세션 없음
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /sessions/{id}/questions/next: {post: {summary: "다음 질문 (F-INT-002)"}}

  /sessions/{id}/answers:
    post:
      summary: 텍스트 응답 제출 (F-INT-003) → 항목별 판정(측정값) 반환·세션에 기록
      description: >
        text는 서버에서 PII 마스킹 후 ai-service로 나간다. 반환 Judgment는 '측정값'이며
        게이트 판정이 아니다(P1). 웹 응답은 camelCase(내부 ai-service 계약 judgment.schema.json은 snake_case).
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AnswerRequest'}
      responses:
        '200':
          description: 항목별 이해도 판정
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JudgmentApiResponse'}

  /sessions/{id}/re-explain:
    post:
      summary: 재설명 (F-INT-004) — 이해 부족 항목을 다시 설명, 이후 같은 항목 재답변이 재검증
      description: 재검증 상한(항목당 max-reverify) 도달 항목은 재설명 불가(400) → 판정으로 진행.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReExplainRequest'}
      responses:
        '200':
          description: 재설명 문면(취약 여부로 맞춤)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReExplanationApiResponse'}
        '400':
          description: 재설명 대상 아님 또는 상한 도달
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /sessions/{id}/abort:
    post:
      summary: 세션 중단 (F-INT-001) — 고객 이탈 등 → ABORTED
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 중단된 세션
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionApiResponse'}

  /sessions/{id}/simulate:  {post: {summary: "손실 계산 (F-SIM-001)"}}

  /sessions/{id}/judge:
    post:
      summary: 게이트 판정 (F-GTE-001) — 세션에 쌓인 판정으로 신호등 산출
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 게이트 판정 결과
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GateApiResponse'}
  /sessions/{id}/override:  {post: {summary: "적색 진행 요청 (F-GTE-002)"}}
  /sessions/{id}/override/approve: {post: {summary: "관리자 승인/반려"}}
  /sessions/{id}/report:    {get: {summary: "이해 기록 (F-GTE-004)"}}
  /dashboard/heatmap:       {get: {summary: "오해 지도 (F-DSH-001)"}}

components:
  schemas:
    # 공통 응답 봉투 — 모든 응답은 success + (data | error) 형태.
    ApiError:
      type: object
      required: [code, message, timestamp]
      properties:
        code:      {type: string, description: "에러 코드(NOT_FOUND·VALIDATION_ERROR·MALFORMED_REQUEST·ILLEGAL_STATE_TRANSITION·INTERNAL_ERROR)"}
        message:   {type: string}
        timestamp: {type: string, format: date-time}
    ErrorApiResponse:
      type: object
      required: [success, error]
      properties:
        success: {type: boolean, enum: [false]}
        data:    {type: object, nullable: true}
        error:   {$ref: '#/components/schemas/ApiError'}

    CreateSessionRequest:
      type: object
      description: 세션 생성 입력. 전부 비식별 — 성명·주민번호는 스키마에 존재하지 않는다 (P3).
      required: [productId, channel, ageBand]
      properties:
        productId:       {type: string, description: "상품 ID"}
        channel:         {type: string, enum: [FACE_TO_FACE, MOBILE, TM], description: "판매 채널(대면·모바일·TM)"}
        ageBand:         {type: string, description: "연령대(비식별, 예: 60대)"}
        experienceLevel: {type: string, nullable: true, description: "투자 경험 수준"}
        amountBand:      {type: string, nullable: true, description: "가입금액대(비식별)"}
        contractRef:     {type: string, nullable: true, description: "계약건 참조번호(비식별)"}
        surveyResult:    {type: object, nullable: true, additionalProperties: true, description: "적합성 설문 결과"}
    SessionResponse:
      type: object
      required: [sessionId, state, productId]
      properties:
        sessionId:   {type: string}
        state:       {type: string, enum: [CREATED, IN_PROGRESS, RE_EXPLAIN, RE_VERIFY, JUDGED, CLOSED, ABORTED]}
        productId:   {type: string}
        contractRef: {type: string, nullable: true}
    SessionApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/SessionResponse'}
        error:   {type: object, nullable: true}

    AnswerRequest:
      type: object
      description: F-INT-003 텍스트 응답. text는 서버에서 PII 마스킹 후 ai-service로.
      required: [itemId, text]
      properties:
        itemId:    {type: string}
        text:      {type: string, description: "고객 발화(서버에서 마스킹)"}
        inputMeta: {type: object, nullable: true, additionalProperties: true, description: "붙여넣기·지연·수정빈도 등(F-INT-003)"}

    # 웹 응답용 Judgment(camelCase). 내부 ai-service 계약은 judgment.schema.json(snake_case).
    JudgmentView:
      type: object
      required: [itemId, grade, confidence, evidence, reason]
      properties:
        itemId:     {type: string}
        grade:      {type: string, enum: [U1, U2, U3, U4]}
        confidence: {type: number, minimum: 0, maximum: 1}
        evidence:
          type: object
          required: [utteranceQuote, rubricClause]
          properties:
            utteranceQuote: {type: string}
            rubricClause:   {type: string}
        reason:            {type: string}
        misconceptionType: {type: string, nullable: true}
    JudgmentApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/JudgmentView'}
        error:   {type: object, nullable: true}

    GateResult:
      type: object
      required: [signal, ruleTrace]
      properties:
        signal:    {type: string, enum: [GREEN, YELLOW, RED]}
        ruleTrace: {type: array, items: {type: string}, description: "발화한 룰 ID(예: R-01)"}
    GateApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/GateResult'}
        error:   {type: object, nullable: true}

    ReExplainRequest:
      type: object
      required: [itemId]
      properties:
        itemId: {type: string, description: "다시 설명할 이해항목"}
    ReExplanation:
      type: object
      required: [itemId, content, vulnerable]
      properties:
        itemId:     {type: string}
        content:    {type: string, description: "재설명 문면(취약 시 고령자 모드)"}
        vulnerable: {type: boolean, description: "취약 고객 여부(맞춤 재설명 적용)"}
    ReExplanationApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/ReExplanation'}
        error:   {type: object, nullable: true}
