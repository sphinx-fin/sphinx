openapi: 3.0.3
info:
  title: SphinX API
  version: 0.1.0
  description: >
    web ↔ server REST 계약. ai-service(내부망 전용)의 /internal/* 인터페이스는 여기 없다 —
    그 경계의 페이로드는 contracts/*.schema.json(judgment·risk_item·parsed_document)으로 계약한다.
paths:
  /products/documents:      {post: {summary: "문서 업로드 (F-EXT-001)"}}
  /products/{id}/extract:   {post: {summary: "위험요소 추출 (F-EXT-002)"}}
  /products/{id}/risk-items: {get: {summary: "추출 항목 조회"}}

  /sessions:
    post:
      summary: 세션 생성 (F-INT-001)
      description: 비식별 속성만 받는다 — 성명·주민번호 필드는 스키마에 존재하지 않는다 (P3).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSessionRequest'}
      responses:
        '200':
          description: 생성된 세션(상태 CREATED)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionApiResponse'}
        '400':
          description: 필수 속성 누락 또는 유효성 오류
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /sessions/{id}:
    get:
      summary: 세션 상태 조회 (F-INT-001)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 세션
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionApiResponse'}
        '404':
          description: 세션 없음
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /sessions/{id}/questions/next: {post: {summary: "다음 질문 (F-INT-002)"}}

  /sessions/{id}/answers:
    post:
      summary: 텍스트 응답 제출 (F-INT-003) → 항목별 판정(측정값) 반환·세션에 기록
      description: >
        text는 서버에서 PII 마스킹 후 ai-service로 나간다. 반환 Judgment는 '측정값'이며
        게이트 판정이 아니다(P1). 웹 응답은 camelCase(내부 ai-service 계약 judgment.schema.json은 snake_case).
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AnswerRequest'}
      responses:
        '200':
          description: 항목별 이해도 판정
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JudgmentApiResponse'}
        '502':
          description: >
            EVIDENCE_REQUIRED — 상류(ai-service)가 근거 없는 판정을 반환해 차단됐다(P4).
            고객이 고칠 수 있는 입력 오류가 아니므로 400이 아니다. 화면은 재입력을 요구하지
            말고 재시도·황색 보수 처리로 간다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /sessions/{id}/re-explain:
    post:
      summary: 재설명 (F-INT-004) — 이해 부족 항목을 다시 설명, 이후 같은 항목 재답변이 재검증
      description: >
        재검증 상한(항목당 max-reverify) 도달 항목은 재설명 불가(400) → 판정으로 진행.
        400의 두 경우는 화면 처리가 다르므로 error.code로 구분한다(메시지 문자열은 계약이 아니다).
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReExplainRequest'}
      responses:
        '200':
          description: 재설명 문면(취약 여부로 맞춤)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReExplanationApiResponse'}
        '400':
          description: >
            REEXPLAIN_NOT_ELIGIBLE — 재설명 대상 아님(판정 없음 또는 이미 이해 U1).
            화면은 고객에게 아무것도 띄우지 않고 다음 항목으로 넘어간다.
            REVERIFY_EXHAUSTED — 재검증 상한 도달. 화면은 판정으로 넘어감을 고객에게 알린다
            (F-INT-004 "2회 실패 시 해당 항목 최종 상태 확정 후 게이트로 이관").
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /sessions/{id}/abort:
    post:
      summary: 세션 중단 (F-INT-001) — 고객 이탈 등 → ABORTED
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 중단된 세션
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionApiResponse'}

  /sessions/{id}/simulate:  {post: {summary: "손실 계산 (F-SIM-001)"}}

  /sessions/{id}/gate-preview:
    get:
      summary: 신호등 미리보기 (F-GTE-001) — 계산만, 기록하지 않음
      description: >
        기획서 7-2 [기능 1] "황색 판정 → 재설명 → 재검증 → 녹색 통과"를 성립시키는 경로다.
        판매자가 황색을 보려고 /judge 를 부르면 JUDGED 로 전이되고 거기서 RE_EXPLAIN 으로
        갈 수 없어 재설명 흐름 자체가 막힌다. 이 경로는 부수효과가 없다.
        GateEngine 이 순수 함수라(P2) 미리보기와 확정이 같은 입력에 같은 답을 낸다.
        이미 판정된 세션은 재계산하지 않고 기록값을 돌려준다(recorded=true).
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 현재 입력 기준 신호등
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GatePreviewApiResponse'}
        '404':
          description: 세션 없음
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /sessions/{id}/judge:
    post:
      summary: 게이트 판정 (F-GTE-001) — 세션에 쌓인 판정으로 신호등 산출
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 게이트 판정 결과
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GateApiResponse'}
        '409':
          description: >
            ILLEGAL_STATE_TRANSITION — 판정할 항목이 하나도 없다. JUDGED 는 CLOSE 외에
            나가는 전이가 없어 되돌릴 수 없으므로, 답변 0건 세션이 버튼 오작동 한 번으로
            끝나지 않게 막는다. 신호만 보려면 /gate-preview 를 쓴다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}
  /sessions/{id}/override:  {post: {summary: "적색 진행 요청 (F-GTE-002)"}}
  /sessions/{id}/override/approve: {post: {summary: "관리자 승인/반려"}}
  /sessions/{id}/report:    {get: {summary: "이해 기록 (F-GTE-004)"}}
  /dashboard/heatmap:       {get: {summary: "오해 지도 (F-DSH-001)"}}

components:
  schemas:
    # 공통 응답 봉투 — 모든 응답은 success + (data | error) 형태.
    ApiError:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          type: string
          description: >
            에러 코드. 프론트는 이 목록을 유니온 타입으로 들고 분기한다 —
            목록에 없는 코드를 서버가 내보내면 화면이 조용히 default로 떨어진다.
          enum:
            - NOT_FOUND                # 404 세션 등 리소스 없음
            - VALIDATION_ERROR         # 400 @Valid 실패
            - MALFORMED_REQUEST        # 400 본문 파싱 실패(잘못된 JSON·허용되지 않은 enum)
            - ILLEGAL_STATE_TRANSITION # 409 허용되지 않은 세션 상태 전이
            - REEXPLAIN_NOT_ELIGIBLE   # 400 재설명 대상 아님(판정 없음 또는 이미 이해 U1)
            - REVERIFY_EXHAUSTED       # 400 재검증 상한 도달 — 판정으로 진행
            - EVIDENCE_REQUIRED        # 502 P4 위반(근거 없는 판정) — 상류 ai-service 계약 위반
            - INTERNAL_ERROR           # 500 서버 내부 오류
        message:   {type: string}
        timestamp: {type: string, format: date-time}
    ErrorApiResponse:
      type: object
      required: [success, error]
      properties:
        success: {type: boolean, enum: [false]}
        data:    {type: object, nullable: true}
        error:   {$ref: '#/components/schemas/ApiError'}

    CreateSessionRequest:
      type: object
      description: 세션 생성 입력. 전부 비식별 — 성명·주민번호는 스키마에 존재하지 않는다 (P3).
      required: [productId, channel, ageBand]
      properties:
        productId:       {type: string, description: "상품 ID"}
        channel:         {type: string, enum: [FACE_TO_FACE, MOBILE, TM], description: "판매 채널(대면·모바일·TM)"}
        ageBand:         {type: string, description: "연령대(비식별, 예: 60대)"}
        experienceLevel: {type: string, nullable: true, description: "투자 경험 수준"}
        amountBand:      {type: string, nullable: true, description: "가입금액대(비식별)"}
        contractRef:     {type: string, nullable: true, description: "계약건 참조번호(비식별)"}
        surveyResult:    {type: object, nullable: true, additionalProperties: true, description: "적합성 설문 결과"}
    SessionResponse:
      type: object
      required: [sessionId, state, productId]
      properties:
        sessionId:   {type: string}
        state:       {type: string, enum: [CREATED, IN_PROGRESS, RE_EXPLAIN, RE_VERIFY, JUDGED, CLOSED, ABORTED]}
        productId:   {type: string}
        contractRef: {type: string, nullable: true}
    SessionApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/SessionResponse'}
        error:   {type: object, nullable: true}

    AnswerRequest:
      type: object
      description: F-INT-003 텍스트 응답. text는 서버에서 PII 마스킹 후 ai-service로.
      required: [itemId, text]
      properties:
        itemId:    {type: string}
        text:      {type: string, description: "고객 발화(서버에서 마스킹)"}
        inputMeta: {type: object, nullable: true, additionalProperties: true, description: "붙여넣기·지연·수정빈도 등(F-INT-003)"}

    # 웹 응답용 Judgment(camelCase). 내부 ai-service 계약은 judgment.schema.json(snake_case).
    JudgmentView:
      type: object
      required: [itemId, grade, confidence, evidence, reason]
      properties:
        itemId:     {type: string}
        grade:      {type: string, enum: [U1, U2, U3, U4]}
        confidence: {type: number, minimum: 0, maximum: 1}
        evidence:
          type: object
          required: [utteranceQuote, rubricClause]
          properties:
            utteranceQuote: {type: string}
            rubricClause:   {type: string}
        reason:            {type: string}
        misconceptionType: {type: string, nullable: true}
    JudgmentApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/JudgmentView'}
        error:   {type: object, nullable: true}

    GatePreview:
      type: object
      required: [signal, ruleTrace, recorded]
      properties:
        signal:    {type: string, enum: [GREEN, YELLOW, RED]}
        ruleTrace: {type: array, items: {type: string}, description: "발화한 룰 ID(예: R-01)"}
        recorded:
          type: boolean
          description: >
            감사 기준점으로 기록된 값인가. false 면 아직 확정이 아니다 — 화면이 이걸
            확정으로 보관하면 안 된다. /judge 를 부른 뒤에만 true 가 된다.
        judgedAt:
          type: string
          format: date-time
          nullable: true
          description: "기준점 확정 시각. null 이면 /judge 가 아직 호출되지 않은 세션이다"
    GatePreviewApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/GatePreview'}
        error:   {type: object, nullable: true}

    GateResult:
      type: object
      required: [signal, ruleTrace]
      properties:
        signal:    {type: string, enum: [GREEN, YELLOW, RED]}
        ruleTrace: {type: array, items: {type: string}, description: "발화한 룰 ID(예: R-01)"}
    GateApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/GateResult'}
        error:   {type: object, nullable: true}

    ReExplainRequest:
      type: object
      required: [itemId]
      properties:
        itemId: {type: string, description: "다시 설명할 이해항목"}
    ReExplanation:
      type: object
      required: [itemId, content, vulnerable, reverifyQuestion]
      properties:
        itemId:     {type: string}
        content:    {type: string, description: "재설명 문면(취약 시 고령자 모드)"}
        vulnerable:
          type: boolean
          description: >
            취약 고객 여부. 렌더링 힌트(큰 글씨·비유)이지 화면에 표시할 라벨이 아니다 —
            "취약 고객으로 분류됨"을 본인에게 보이지 않는다(기획서 7-4, 보호 목적으로만).
        reverifyQuestion:
          type: string
          description: >
            재설명 직후 같은 항목을 다시 물을 때 쓸 변형 질문(F-INT-002). 프론트는 직전 질문을
            재사용하지 말고 이 값을 띄운다. 서버 구현이 목인 동안에는 항목별 고정 문면이라
            기획서 7-4 1단계(우회 비용 상향)를 아직 만족하지 않는다 — 문서 자동 생성이
            붙어야 성립한다. 계약 형태는 그때도 바뀌지 않는다.
    ReExplanationApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/ReExplanation'}
        error:   {type: object, nullable: true}
