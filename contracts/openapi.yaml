openapi: 3.0.3
info:
  title: SphinX API
  version: 0.1.0
  description: >
    web ↔ server REST 계약. ai-service(내부망 전용)의 /internal/* 인터페이스는 여기 없다 —
    그 경계의 페이로드는 contracts/*.schema.json(judgment·risk_item·parsed_document)으로 계약한다.
paths:
  /products:
    get:
      summary: 상품 목록 (S-02 선택지)
      description: >
        나머지 /products/* 는 전부 productId 를 이미 알아야 부를 수 있다. 고를 수 있는
        상품을 주는 유일한 경로다. S-01(문서 업로드)이 붙으면 업로드한 상품이 여기에 나온다.
      responses:
        '200':
          description: 상품 목록
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductListApiResponse'}

  /products/documents:
    post:
      summary: 문서 업로드 (F-EXT-001)
      description: >
        올린 파일을 저장하고 상품ID 를 발급한 뒤 파싱한다 (이슈 #521).
        productId 는 **내용에서 나온다** — `doc-<파일명 슬러그>-<sha256 앞 16자>` 라,
        같은 파일을 두 번 올리면 같은 상품이고 문서가 한 바이트라도 다르면 다른 상품이다.
        ❗파일명이 한글뿐이면 ASCII 슬러그가 비므로 `doc-<sha256 앞 16자>` 다 — 상수로
        채우면(예전 `doc-unnamed-…`) 운영 코퍼스 거의 전부가 서로 구별이 안 된다.
        올린 파일 이름은 저장 경로와 응답 헤더가 든다.
        ❗**추출은 따로 부른다** — `POST /products/{id}/extract`. 파싱만 된 상태와 추출까지
        된 상태가 화면에서 갈려야 하고(고칠 자리가 다르다) 추출은 별개 권한이다.
        상한: 파일 20MB · 요청 25MB. 넘으면 400 VALIDATION_ERROR.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:        {type: string, format: binary, description: "PDF 만. 앞머리 5바이트가 %PDF- 여야 한다 — Content-Type 은 안 본다"}
                productType: {type: string, enum: [ELS, VARIABLE_INSURANCE], default: ELS, description: "파싱이 판별한 유형이 이 값과 다르면 판별값을 쓴다"}
      responses:
        '200':
          description: >
            업로드·파싱 결과. 문서를 못 연 경우(암호화·손상 PDF)도 200 이고
            `status: parse_failed` 다 — 그건 이 문서의 문제라 운영자가 문서를 다시 넣어
            고친다. ai-service 장애는 502 로 나간다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadApiResponse'}
        '400':
          description: PDF 아님 · 빈 파일 · 모르는 상품유형 · 크기 상한 초과 (VALIDATION_ERROR)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}
        '502':
          description: ai-service 에 닿지 못했다 (AI_SERVICE_UNAVAILABLE) — 문서 문제와 다르다
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /products/{id}/extract:
    post:
      summary: 위험요소 추출 (F-EXT-002)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 추출된 이해항목
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RiskItemsApiResponse'}

  /products/{id}/risk-items:
    get:
      summary: 추출 항목 조회
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 이해항목 목록
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RiskItemsApiResponse'}

  /products/{id}/document:
    get:
      summary: 상품 원문 문서 PDF — 브라우저 인라인 (F-EXT · 이슈 #412)
      description: >
        **응답이 공통 봉투가 아니다.** 본문이 PDF 바이트다 — `/report/preview` 와 같은
        선례다(base64 로 봉투에 접어 넣으면 브라우저가 뷰어로 못 열고 화면이 다시 풀어야
        한다). S-02 모달이 조항 원문·페이지·오프셋을 그려 놓고도 대조할 원본으로 갈 길이
        없던 것을 채운다(P6 원문 인용). `inline` 이라 모달이 이미 든 페이지 번호로
        `#page=N` 앵커를 붙여 열 수 있다(브라우저 PDF 뷰어 규약 — 서버가 할 일은 없다).
        **오류 응답은 봉투 그대로다**(403·404). 규약이 갈리는 것은 성공 본문뿐이다.
        권한: `product:read` — 원문 문서는 세션 데이터가 아니라 `/risk-items` 가 내는 것과
        같은 상품 카탈로그 데이터다(그 항목이 뽑혀 나온 바로 그 문서). 그래서 읽기 둘과 같은
        action 을 쓴다.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: "PDF 본문. `Content-Disposition: inline`"
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '403':
          description: 범위 밖 접근
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}
        '404':
          description: >
            등록된 문서가 없는 상품이거나 원본 파일이 사전적재되지 않았다. 둘을 한 코드로
            낸다 — 범위 밖 상품의 존재 여부를 알려주지 않는다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /sessions:
    post:
      summary: 세션 생성 (F-INT-001)
      description: 비식별 속성만 받는다 — 성명·주민번호 필드는 스키마에 존재하지 않는다 (P3).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSessionRequest'}
      responses:
        '200':
          description: 생성된 세션(상태 CREATED)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionApiResponse'}
        '400':
          description: 필수 속성 누락 또는 유효성 오류
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /sessions/{id}:
    get:
      summary: 세션 상태 조회 (F-INT-001)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 세션
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionApiResponse'}
        '404':
          description: 세션 없음
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /sessions/{id}/questions/next:
    post:
      summary: 다음 질문 + 진행 상태 (F-INT-002)
      description: >
        index/total 을 서버가 준다. 화면이 "추출된 항목 수"로 분모를 보완하면 서버가 물어볼
        항목 수와 어긋날 수 있고, 어긋나면 조용히 틀린 진행률이 보인다.
        done=true 가 인터뷰 종료 판단의 유일한 근거다.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 다음 질문(없으면 done=true)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NextQuestionApiResponse'}

  /sessions/{id}/risk-items:
    get:
      summary: 이 세션이 검증할 이해항목 (S-03 · S-04)
      description: >
        고객 화면이 항목을 받는 경로다. `/products/{id}/risk-items` 를 쓰지 않는 이유는
        그쪽이 `product:read`(scope org)라, 고객에게 열어 주면 자기 계약 건과 무관한
        상품까지 전 카탈로그를 열거할 수 있게 되기 때문이다(이슈 #158). 여기서는 대상이
        세션이므로 범위가 자연히 own_session 이 되고, productId 를 알려고 세션을 먼저
        조회하는 왕복도 없어진다.
        action 은 `session:read` 다 — 세션을 읽을 수 있으면 그 세션이 무엇을 묻는지도
        읽을 수 있다. 다만 CUST 에게 그 그랜트가 아직 없어서(결정 10.5 대기) 고객 화면은
        그랜트가 생겨야 열린다.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 이해항목 목록
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RiskItemsApiResponse'}
        '404':
          description: 세션 없음
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /sessions/{id}/judgments:
    get:
      summary: 세션에 쌓인 항목별 판정 목록 (S-05)
      description: >
        S-03(고객 화면)과 S-05(판매자 화면)는 다른 기기·다른 탭이라 화면이 메모리에 들고
        갈 수 없다. 새로고침에도 살아남아야 한다.
        항목별 signal 은 싣지 않는다 — 게이트 판정은 /judge 의 signal 이 단독 소유한다(P1).
        grade → 색 매핑은 표시 관례이며 판정이 아니다.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 항목 ID 오름차순 판정 목록
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JudgmentsApiResponse'}
        '404':
          description: 세션 없음
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /sessions/{id}/answers:
    post:
      summary: 텍스트 응답 제출 (F-INT-003) → 항목별 판정(측정값) 반환·세션에 기록
      description: >
        text는 서버에서 PII 마스킹 후 ai-service로 나간다. 반환 Judgment는 '측정값'이며
        게이트 판정이 아니다(P1). 웹 응답은 camelCase(내부 ai-service 계약 judgment.schema.json은 snake_case).
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AnswerRequest'}
      responses:
        '200':
          description: 항목별 이해도 판정
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JudgmentApiResponse'}
        '502':
          description: >
            EVIDENCE_REQUIRED — 상류(ai-service)가 근거 없는 판정을 반환해 차단됐다(P4).
            고객이 고칠 수 있는 입력 오류가 아니므로 400이 아니다. 화면은 재입력을 요구하지
            말고 재시도·황색 보수 처리로 간다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /sessions/{id}/skips:
    post:
      summary: 항목 건너뛰기 (E-INT-03) → 룰이 정한 U3 판정을 세션에 기록
      description: >
        고객이 「이 항목 건너뛰기」를 누른 경우다. **채점하지 않는다** — 발화가 없으면 잴 것이
        없고, 무응답의 등급은 명세 8절 E-INT-03 이 U3 로 정해 뒀다. 측정이 아니라 룰의
        결정이다(P1). 반환 Judgment 는 /answers 와 같은 모양이고 `source: SKIPPED` 로
        구별된다 — 문면으로는 측정된 U3 와 못 가른다.
        ❗**/answers 로 대신하면 안 된다.** 표시 문자열을 발화인 척 실어 보내면 ai-service 가
        인용할 발화 없이 근거를 만들어야 하고, 그 판정은 계약 위반이라 502(AI_SERVICE_UNAVAILABLE)
        가 된다 — 재판정으로도 안 풀린다(근거 검증이 아니라 스키마 단계에서 나므로).
        권한: `session:answer` — 고객이 자기 세션에서 누르는 버튼이라 답변과 같다.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SkipRequest'}
      responses:
        '200':
          description: 룰이 정한 U3 판정(세션·불변 기록에 반영됨)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JudgmentApiResponse'}
        '404':
          description: NOT_FOUND — 세션이 없거나 그 상품의 항목이 아니다(/answers 와 같은 규약)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /sessions/{id}/re-explain:
    post:
      summary: 재설명 (F-INT-004) — 이해 부족 항목을 다시 설명, 이후 같은 항목 재답변이 재검증
      description: >
        재검증 상한 도달 항목은 재설명 불가(400) → 판정으로 진행. 상한의 유일한 출처는
          gate_rules.yaml R-03(reverifyFailed >= N)의 N 이다(이슈 #66 · ADR-005).
        400의 두 경우는 화면 처리가 다르므로 error.code로 구분한다(메시지 문자열은 계약이 아니다).
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReExplainRequest'}
      responses:
        '200':
          description: 재설명 문면(취약 여부로 맞춤)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReExplanationApiResponse'}
        '400':
          description: >
            REEXPLAIN_NOT_ELIGIBLE — 재설명 대상 아님(판정 없음 또는 이미 이해 U1).
            화면은 고객에게 아무것도 띄우지 않고 다음 항목으로 넘어간다.
            REVERIFY_EXHAUSTED — 재검증 상한 도달. 화면은 판정으로 넘어감을 고객에게 알린다
            (F-INT-004 "2회 실패 시 해당 항목 최종 상태 확정 후 게이트로 이관").
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /sessions/{id}/re-explanations/current:
    get:
      summary: 진행 중인 재설명 조회 (F-INT-004) — 지금 보여주는 재설명 문면·재검증 질문
      description: >
        권한: `session:interview`. POST /re-explain 이 보여준 그 문면을 그대로 돌려준다 —
        서버가 재생성하지 않는다(LLM 산출물이라 비결정, P1). 화면은 이 GET 을 출처로 삼아
        저장소 인계(sessionStorage)에 기대지 않는다 — 새 창·새로고침·다른 기기에서 열어도
        판매자 화면과 같은 재설명·같은 재검증 질문이다.
        재설명 사이클(RE_EXPLAIN·RE_VERIFY) 밖이거나 아직 재설명한 적 없으면 404(NOT_FOUND).
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 지금 진행 중인 재설명(POST /re-explain 과 같은 형태)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReExplanationApiResponse'}
        '404':
          description: NOT_FOUND — 진행 중인 재설명이 없다(사이클 밖 또는 미기록) 또는 세션 없음.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /sessions/{id}/abort:
    post:
      summary: 세션 중단 (F-INT-001) — 고객 이탈 등 → ABORTED
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 중단된 세션
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionApiResponse'}
  /sessions/{id}/simulate:
    post:
      summary: 손실 계산 (F-SIM-001) — 가입금액을 넣으면 시나리오 3건
      description: >
        순수 함수다(P2). 같은 입력이면 항상 같은 출력이며 LLM 이 개입하지 않는다.
        금액은 `data/timeseries/` 실제 종가 시계열을 결정론적 로직에 대입해 산출하고,
        스냅샷은 `data/timeseries/VERSION` 의 sha256 으로 고정된다.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SimulateRequest'}
      responses:
        '200':
          description: 시나리오 3건 (severity 로 worst·mid·best 각 1건)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimulateApiResponse'}
        '404':
          description: 세션 없음
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}
  /sessions/{id}/gate-preview:
    get:
      summary: 신호등 미리보기 (F-GTE-001) — 계산만, 기록하지 않음
      description: >
        기획서 7-2 [기능 1] "황색 판정 → 재설명 → 재검증 → 녹색 통과"를 성립시키는 경로다.
        판매자가 황색을 보려고 /judge 를 부르면 JUDGED 로 전이되고 거기서 RE_EXPLAIN 으로
        갈 수 없어 재설명 흐름 자체가 막힌다. 이 경로는 부수효과가 없다.
        GateEngine 이 순수 함수라(P2) 미리보기와 확정이 같은 입력에 같은 답을 낸다.
        이미 판정된 세션은 재계산하지 않고 기록값을 돌려준다(recorded=true).
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 현재 입력 기준 신호등
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GatePreviewApiResponse'}
        '404':
          description: 세션 없음
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /sessions/{id}/judge:
    post:
      summary: 게이트 판정 (F-GTE-001) — 세션에 쌓인 판정으로 신호등 산출
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 게이트 판정 결과
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GateApiResponse'}
        '409':
          description: >
            ILLEGAL_STATE_TRANSITION — 판정할 항목이 하나도 없다. JUDGED 는 CLOSE 외에
            나가는 전이가 없어 되돌릴 수 없으므로, 답변 0건 세션이 버튼 오작동 한 번으로
            끝나지 않게 막는다. 신호만 보려면 /gate-preview 를 쓴다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}
  /sessions/{id}/override:
    post:
      summary: 적색 진행 요청 (F-GTE-002)
      description: >
        판매자가 사유를 붙여 적색 진행을 요청한다. status=PENDING_APPROVAL 로 돌아온다.
        적색 판정 세션에만 허용된다(그 외 409 OVERRIDE_NOT_ELIGIBLE). 사유 30자 미만은
        400 VALIDATION_ERROR.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OverrideRequest'}
      responses:
        '200':
          description: 오버라이드 상태(PENDING_APPROVAL)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OverrideApiResponse'}
        '400':
          description: VALIDATION_ERROR — 사유 30자 미만
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}
        '409':
          description: OVERRIDE_NOT_ELIGIBLE — 적색 판정 세션이 아니다
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /sessions/{id}/override/approve:
    post:
      summary: 관리자(MGR) 승인 (F-GTE-002)
      description: >
        MGR이 승인한다(ADR-002). 사유는 요청 시 이미 기록됐으므로 본문이 없다. 승인자는 인증
        주체에서 얻는다. 승인 시 불변 기록 append + COMPL 자동 통보가 일어난다. status=APPROVED.
        승인 대기(PENDING_APPROVAL) 상태가 아니면 409 OVERRIDE_NOT_ELIGIBLE.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 오버라이드 상태(APPROVED)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OverrideApiResponse'}
        '409':
          description: OVERRIDE_NOT_ELIGIBLE — 적색 아님 또는 요청 없이 승인
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /sessions/{id}/report:
    post:
      summary: 이해 기록 리포트 발행 (F-GTE-004)
      description: >
        append-only 해시 체인에 기록된 이력에서 리포트를 조립하고 **발행 사실을 체인에 남긴다.**
        발행을 GET 에서 분리한 이유는 감사다 — `report:read` 는 audited action 이라 GET 이
        발행까지 하면 로그에서 "읽었다" 와 "발행했다" 가 구별되지 않고, MGR·COMPL 이 남의
        세션을 열람하는 것만으로 발행 기록이 생긴다. 프리페치·재시도·브라우저 중복 요청이
        상태를 바꾸는 것도 막는다.
        내용이 그대로면 다시 발행하지 않고 기존 것을 돌려준다(멱등). 내용이 달라지면 새로
        발행하되 이전 발행 기록은 지우지 않는다 — "교부 시점에 무엇이 적혀 있었는가" 에
        답하려면 둘이 나란히 남아야 한다(ADR-004).
        권한: `report:issue` — **SELLER=own_session 뿐이다.** 조회(`report:read`)와 다른
        action 인 것이 위 문단의 요지다. MGR·COMPL 은 감독을 위해 남의 세션을 **읽지만**
        교부하지는 않는다 — 분쟁 시점에 답해야 하는 것은 "언제 누가 교부했는가" 다(이슈 #154).
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 발행된 리포트(이미 같은 내용이면 기존 것)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportApiResponse'}
        '403':
          description: >
              범위 밖 접근. `report:issue` 는 SELLER=own_session 뿐이다 — MGR·COMPL 도
              여기서 403 이다(읽기는 되지만 교부는 안 된다).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}
        '404':
          description: 세션 없음
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}
    get:
      summary: 발행된 이해 기록 리포트 조회 (F-GTE-004)
      description: >
        **조회만 한다. 상태를 바꾸지 않는다.** 발행한 적 없는 세션은 404 다 — "아직 교부하지
        않았다" 와 "교부했다" 는 감사에서 구별돼야 한다. 발행은 POST 다.
        권한: `report:read`.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 마지막으로 발행된 리포트
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportApiResponse'}
        '403':
          description: 범위 밖 접근
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}
        '404':
          description: >
            세션이 없거나 **아직 발행된 리포트가 없다.** 후자는 오류가 아니라 상태다 —
            화면은 "발행하기" 를 띄우면 된다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /sessions/{id}/report/preview:
    get:
      summary: 발행된 리포트 PDF — 브라우저 인라인 (F-GTE-004)
      description: >
        **응답이 공통 봉투가 아니다.** 본문이 PDF 바이트다 — base64 로 봉투에 접어 넣으면
        브라우저가 뷰어로 못 열고 화면이 다시 풀어야 한다. `ReportResponse.previewUrl` 이
        가리키는 곳이 여기다.
        **오류 응답은 봉투 그대로다**(403·404). 규약이 갈리는 것은 성공 본문뿐이다.
        `download` 와 **바이트가 같다** — 가르는 것은 `Content-Disposition` 하나다.
        권한: `report:read`.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: "PDF 본문. `Content-Disposition: inline`"
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '403':
          description: 범위 밖 접근
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}
        '404':
          description: >
            세션이 없거나 **아직 발행된 리포트가 없다.** GET `/report` 와 같은 이유로 둘을
            한 코드로 낸다 — 범위 밖 세션의 존재 여부를 알려주지 않는다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /sessions/{id}/report/download:
    get:
      summary: 발행된 리포트 PDF — 내려받기 (F-GTE-004)
      description: >
        `preview` 와 **같은 바이트**이고 `Content-Disposition` 만 `attachment` 다.
        파일명은 `sphinx-report-<reportId>.pdf` — 세션 ID 를 쓰면 같은 세션의 서로 다른
        발행이 같은 이름이 되어 받은 사람의 폴더에서 덮어써진다.
        응답 봉투 규약은 `preview` 와 같다. 권한: `report:read`.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: "PDF 본문. `Content-Disposition: attachment`"
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '403':
          description: 범위 밖 접근
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}
        '404':
          description: 세션이 없거나 아직 발행된 리포트가 없다
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /sessions/{id}/report/summary:
    get:
      summary: 고객 교부용 요약 (F-GTE-004)
      description: >
        `rbac_policy.yaml` 이 `report:summary:read`(CUST · own_session)를 별도 action 으로
        분리해 두었다. 판매자용 전문과 고객 교부용 요약은 같은 문서가 아니다.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 고객 교부용 요약
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportSummaryApiResponse'}
        '403':
          description: >
            `report:summary:read` 는 CUST=own_session 이다. 본인 세션이 아니면 거부.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}
        '404':
          description: 세션 없음
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}
  /dashboard/heatmap:
    get:
      summary: 오해 지도 히트맵 (F-DSH-001)
      description: >
        권한 `aggregate:heatmap:read` — COMPL=org · MGR=branch. SELLER·CUST·ADMIN 은
        의도적으로 부재다(ADR-001, 기획서 7-4). 소표본(n<30)은 셀을 제거하지 않고
        `masked: true` + `misrate: null` 로 내린다.
      parameters:
        - {name: product, in: query, required: false, schema: {type: string}}
        - {name: ageBand, in: query, required: false, schema: {type: string}}
        - {name: channel, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: 히트맵 셀
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HeatmapApiResponse'}
        '403':
          description: >
            범위 밖 접근. SELLER·CUST·ADMIN 은 집계에 접근할 수 없다(ADR-001 · 기획서 7-4).
            **화면이 "차단됨"을 그려야 하므로 계약에 선언한다** — 데모에서 역할 차단을 시연하는
            근거가 이 응답이다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /dashboard/audit-summary:
    get:
      summary: 접근 감사 집계 (F-CMN-002 · 이슈 #326 파트2)
      description: >
        권한: `audit:read` — COMPL=org 뿐이다(SELLER·MGR·CUST·ADMIN 부재).
        기간별 action·resultCode·차단(401·403) 역할별 건수를 낸다.
        ❗**개인 식별자(actorId·resource)는 담지 않는다** — 개방 모드에서 원시 엔트리를 열면
        무인증·공개 상태에서 "누가 무엇을 했는가" 가 읽힌다. 심사에 필요한 것은 `deniedByRole`
        (역할별 차단 건수 = 기획서 7-4 역이용 방지의 실물)이라는 숫자다.
        `from` 포함·`to` 제외(반열림). 둘 다 생략하면 전체. `unreadable` 은 payload 를 못 읽어
        어느 기간에도 못 넣은 건수 — total 이 "읽을 수 있었던 것" 으로 조용히 좁혀지지 않게 따로 센다.
      parameters:
        - {name: from, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: false, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: 기간별 접근 집계 (개인 식별자 없음)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditSummaryApiResponse'}
        '403':
          description: >
            범위 밖 접근. COMPL 만 감사 집계를 볼 수 있다(ADR-001 · 기획서 7-4). 화면이
            "차단됨"을 그려야 하므로 계약에 선언한다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /dashboard/audit-verify:
    get:
      summary: 감사 체인 무결성 검증 (F-CMN-002 · 이슈 #326 파트2)
      description: >
        권한: `audit:verify` — COMPL=org 뿐이다. 해시 체인을 재계산해 이어져 있는지(꼬리 절단까지)
        본다. 조회(`audit:read`)와 가른다 — "몇 건 있었나"(집계)와 "변조되지 않았나"(무결성)는
        다른 질문이다. 응답에 개인 식별자는 없다: `ok`(온전한가)·`checked`(검사 건수)·`brokenAt`/
        `brokenSeq`(끊긴 지점, ok 면 -1)·`reason`(사유, ok 면 빈 문자열).
      responses:
        '200':
          description: 체인 검증 결과 (개인 식별자 없음)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditVerifyApiResponse'}
        '403':
          description: >
            범위 밖 접근. COMPL 만 감사 체인을 검증할 수 있다(ADR-001 · 기획서 7-4).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /dashboard/evidence-metrics:
    get:
      summary: 실세션 운영 지표 (F-CMN-002 · 이슈 #327 · #479)
      description: >
        권한: `audit:read` — COMPL=org 뿐이다. 폴백률·confidence 분포·소요시간·재설명 전후 전환.
        ❗**실세션만 센다** — 합성 세션은 불변 기록을 안 쌓아(결정 5.16) 여기 없다. 오해 지도
        (합성)와 성질이 정반대라 섞이지 않는다. `unreadable` 은 payload 를 못 읽어 못 센 건수 —
        0 과 다르다(결정 5.40, 안 센 것과 0 을 가른다). evidence 가 프로세스 수명이라 이 값은
        "이 프로세스가 뜬 뒤로" 다.
      responses:
        '200':
          description: 실세션 지표 (합성 없음)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvidenceMetricsApiResponse'}
        '403':
          description: >
            범위 밖 접근. COMPL 만 운영 지표를 볼 수 있다(ADR-001 · 기획서 7-4).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /dashboard/vulnerability-contrast:
    get:
      summary: 취약 고객 대비 (F-DSH-001 · 이슈 #321)
      description: >
        취약 고객과 나머지의 오해율을 나란히 낸다. 권한은 히트맵과 **같은**
        `aggregate:heatmap:read` 다 — 같은 데이터를 다른 축으로 자른 것이라 action 을 가르면
        같은 사실에 그랜트가 둘이 되고 한쪽만 좁히는 실수가 난다.
        취약 여부의 근거는 `vulnerability_weights.yaml`(연령·가입금액대·투자경험·채널 네 요인의
        합 ≥ vulnerable-threshold)이고 서버가 판정한다 — **연령대만 보는 근사가 아니다.**
        화면이 자기 기준으로 다시 가르면 코칭 스코어와 갈린다.
        마스킹은 히트맵과 같다(n<30 이면 masked=true · misrate=null). **두 줄은 표본이 없어도
        항상 낸다** — 없는 줄을 빼면 화면이 대비를 못 그리고 가려졌다는 사실이 사라진다.
      parameters:
        - {name: product, in: query, required: false, schema: {type: string}}
        - {name: ageBand, in: query, required: false, schema: {type: string}}
        - {name: channel, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: 취약/비취약 두 줄
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContrastApiResponse'}
        '403':
          description: >
            범위 밖 접근. SELLER·CUST·ADMIN 은 집계에 접근할 수 없다(ADR-001 · 기획서 7-4).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /dashboard/decisions:
    get:
      summary: 게이트가 무엇을 결정했는가 (F-DSH-001 · 이슈 #321)
      description: >
        지금 대시보드가 내는 것은 전부 **오해율**이다 — "고객이 무엇을 모르는가".
        이 제품이 하는 일은 그다음이고(막았는가 · 되돌렸는가 · 예외를 뒀는가), 화면에 그
        답이 없었다. 이 뷰가 그 넷을 낸다.
        ★ **`reexplain` 이 본체다** — 재설명을 거친 항목 중 최종 이해(U1)에 도달한 비율.
        오해율은 문제 제기이고 이것은 성과다. "이 제품이 실제로 이해를 올렸다" 의 유일한
        정량 근거라 심사에서 가장 세다.
        권한은 히트맵과 **같은** `aggregate:heatmap:read` 다 — 같은 데이터를 다른 축으로
        자른 것이라 action 을 가르면 같은 사실에 그랜트가 둘이 된다.
        마스킹은 히트맵과 같다(표본 30 미만이면 masked=true · 비율은 null). ❗**비율이
        0 이 아니라 null 인 이유**는 "한 번도 없었다" 와 "셀 수 없다" 를 가르기 위해서다.
        세션 테이블만으로 계산된다 — `evidence/` 가 인메모리라 거기 기대면 재기동마다
        사라진다(이슈 #327).
      parameters:
        - {name: product, in: query, required: false, schema: {type: string}}
        - {name: ageBand, in: query, required: false, schema: {type: string}}
        - {name: channel, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: 신호 분포 · 오버라이드 · 재설명 효과 · 미측정
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DecisionApiResponse'}
        '403':
          description: >
            범위 밖 접근. SELLER·CUST·ADMIN 은 집계에 접근할 수 없다(ADR-001 · 기획서 7-4).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /dashboard/coaching-signals:
    get:
      summary: ★ 코칭 정황 — 기획서 7-4 2단계 사후 적발
      description: >
        기획서 7-4 는 판매 직원의 게이밍에 **2단계 대응**을 두고, 2단계(사후 적발)에서
        세 신호를 이름으로 적는다 — *"1차 응답 통과율이 비정상적으로 높거나, 답변의
        문장 유사도가 지나치게 균질하거나, 응답 지연시간 분포가 다른 곳과 다르면
        이상치로 표시해 컴플라이언스 부서에 이관한다"*.
        이 뷰가 **셋 다** 낸다. 셋째(지연 분포)는 입력 메타데이터가 불변 기록으로만 가고
        세션에 안 남아 한동안 못 셌는데, 총 입력 시간만 세션에 남겨 이었다.
        ❗**기존 이상치(`/leading-indicators`)로는 구조적으로 못 잡는다** — 그쪽은
        오해율이 **올라간** 것만 보는데 코칭은 반대 방향이다(통과율이 오르고 오해율이
        내려간다).
        ❗**개인을 지목하지 않는다.** `key` 는 가명이고 발화는 한 글자도 안 나간다.
        기획서가 *"개별 세션 단위로 코칭을 판별하기는 어려우나 집계 단위에서는 확인이
        가능하다"* 로 범위를 정해 뒀다. 세션 하나로 판정하기 시작하면 이 화면이
        ADR-001 이 막으려던 것이 된다.
        권한은 선행지표와 **같은** `aggregate:indicator:read` — COMPL=org · MGR=branch.
        SELLER 는 집계 그랜트가 없다: 코칭을 하는 쪽이 자기 정황을 보면 기능이 없는 것과
        같다.
      responses:
        '200':
          description: 판매자 가명별 1차 통과율 · 발화 균질도 · 이상치 사유
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoachingApiResponse'}
        '403':
          description: >
            범위 밖 접근. SELLER·CUST·ADMIN 은 집계에 접근할 수 없다(ADR-001 · 기획서 7-4).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /dashboard/leading-indicators:
    get:
      summary: 선행지표 뷰 (F-DSH-002)
      description: >
        지점·판매자·문항 단위 추이와 이상치. 권한 `aggregate:indicator:read` —
        COMPL=org · MGR=branch. 히트맵과 같은 마스킹 규칙을 적용한다.
      parameters:
        - name: groupBy
          in: query
          required: false
          schema: {type: string, enum: [branch, seller, item]}
          description: "집계 축. 데이터 범위(scope)와 다른 개념이다 — 범위는 요청자 역할이 정하고 응답의 scope 로 내려온다"
        - {name: periods, in: query, required: false, schema: {type: integer, default: 8}, description: "최근 N 주"}
      responses:
        '200':
          description: 추이 시계열 + 이상치
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LeadingIndicatorApiResponse'}
        '403':
          description: >
            범위 밖 접근. SELLER·CUST·ADMIN 은 집계에 접근할 수 없다(ADR-001 · 기획서 7-4).
            **화면이 "차단됨"을 그려야 하므로 계약에 선언한다** — 데모에서 역할 차단을 시연하는
            근거가 이 응답이다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /signals/unfair:
    get:
      summary: 불공정영업 신호 큐 (F-GTE-003 · 이슈 #63)
      description: >
        판정에 불공정영업 신호가 있으면 `UnfairSalesSignalEvent` 가 나고, 그것이
        append-only 스트림(`signal:unfair`)에 쌓인다. 이 경로가 그 큐를 읽는다.
        **상태를 바꾸지 않는다** — 큐가 append-only 라 "처리함" 으로 항목을 지우지 않는다.
        처리 상태가 필요해지면 지우는 것이 아니라 새 항목을 쌓는 방식이어야 한다.
        권한: `signal:unfair:read` — **COMPL 전용이다.** SELLER·MGR·ADMIN 이 부재이고,
        그건 권한을 안 준 것이 아니라 **줄 대상이 없는 것**이다(ADR-001 과 같은 결).
        판매자가 무엇이 탐지되는지 알면 문면만 바꿔 같은 영업을 한다(기획 7-4 역이용 방지).
      responses:
        '200':
          description: 쌓인 순서 그대로의 신호 목록
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UnfairSignalsApiResponse'}
        '403':
          description: >
            COMPL 이 아니다. **화면이 "차단됨" 을 그려야 하므로 계약에 선언한다** —
            데모에서 역할 차단을 시연하는 근거가 이 응답이다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

components:
  schemas:
    # 공통 응답 봉투 — 모든 응답은 success + (data | error) 형태.
    ApiError:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          type: string
          description: >
            에러 코드. 프론트는 이 목록을 유니온 타입으로 들고 분기한다 —
            목록에 없는 코드를 서버가 내보내면 화면이 조용히 default로 떨어진다.
          enum:
            - NOT_FOUND                # 404 세션 등 리소스 없음
            - VALIDATION_ERROR         # 400 @Valid 실패
            - MALFORMED_REQUEST        # 400 본문 파싱 실패(잘못된 JSON·허용되지 않은 enum)
            - ILLEGAL_STATE_TRANSITION # 409 허용되지 않은 세션 상태 전이
            - REEXPLAIN_NOT_ELIGIBLE   # 400 재설명 대상 아님(판정 없음 또는 이미 이해 U1)
            - REVERIFY_EXHAUSTED       # 400 재검증 상한 도달 — 판정으로 진행
            - OVERRIDE_NOT_ELIGIBLE    # 409 오버라이드 전제 위반(적색 아님 또는 요청 없이 승인)
            - UNAUTHORIZED             # 401 인증되지 않은 요청 — 로그인하면 해소된다
            - FORBIDDEN                # 403 권한 없음(F-CMN-002) — 로그인해도 해소되지 않는다
            - EVIDENCE_REQUIRED        # 502 P4 위반(근거 없는 판정) — 상류 ai-service 계약 위반
            - MEASUREMENT_INVALID      # 502 모델이 낸 측정값이 검증을 통과 못 함 — ① 인용이 실제 발화에 없음(지어냄) ② 루브릭 밖 조항 인용 ③ 신뢰도 누락·범위(0~1) 이탈. 상류 ai-service 계약 위반이고 EVIDENCE_REQUIRED(근거가 비었다)와 다르다
            - AI_SERVICE_UNAVAILABLE   # 502 ai-service 호출 실패(non-2xx·연결 오류·미구현) — 상류 의존성 문제
            - DOCUMENT_UNPROCESSABLE   # 400 이 문서로는 처리할 수 없다(못 열림·PII 입구 재검사 거부) — ai-service 는 멀쩡하다. 문서를 고쳐 다시 올린다. 업로드는 이 코드 대신 200 + status=parse_failed 로 답한다
            - INTERNAL_ERROR           # 500 서버 내부 오류
        message:   {type: string}
        timestamp: {type: string, format: date-time}
    UnfairSignal:
      type: object
      description: >
        불공정영업 신호 한 건. 저장 형태가 곧 이 모양이라 읽기와 쓰기가 갈리지 않는다.
      required: [sessionId, itemId, misconceptionType, utteranceQuote, at]
      properties:
        sessionId:  {type: string}
        itemId:     {type: string}
        misconceptionType:
          type: string
          description: "오해 라이브러리에서 escalate: compliance 인 유형 (예 M08-TYING)"
        utteranceQuote:
          type: string
          description: >
            고객이 실제로 한 말. **이 값이 이 큐의 실질이다** — 유형ID 만으로는 COMPL 이
            판단할 근거가 없다. 채점 경로에서 `PiiGateway.mask()` 를 거친 발화라 구성상
            마스킹 상태다(P3).
        at: {type: string, format: date-time}
    UnfairSignalsApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:
          type: object
          required: [total, signals]
          properties:
            total:   {type: integer}
            signals: {type: array, items: {$ref: '#/components/schemas/UnfairSignal'}}
        error:   {type: object, nullable: true}
    ErrorApiResponse:
      type: object
      required: [success, error]
      properties:
        success: {type: boolean, enum: [false]}
        data:    {type: object, nullable: true}
        error:   {$ref: '#/components/schemas/ApiError'}

    CreateSessionRequest:
      type: object
      description: 세션 생성 입력. 전부 비식별 — 성명·주민번호는 스키마에 존재하지 않는다 (P3).
      required: [productId, channel, ageBand]
      properties:
        productId:       {type: string, description: "상품 ID"}
        channel:         {type: string, enum: [FACE_TO_FACE, MOBILE, TM], description: "판매 채널(대면·모바일·TM)"}
        ageBand:
          type: string
          description: >
            연령대(비식별). 이 값은 server/src/main/resources/vulnerability_weights.yaml 이
            문자열 키로 가중을 매기는 대상이다. 목록에 없는 값을 보내면 400 이 아니라 조용히
            0점이 되고, 취약 고객이 일반 고객으로 분류된다. 그래서 enum 으로 고정한다.
            가중 대상이 아닌 값(20~40대)도 유효한 입력이므로 enum 에 포함한다.
          enum: ["20대", "30대", "40대", "50대", "60대", "70대", "80대"]
        experienceLevel:
          type: string
          nullable: true
          description: 투자 경험 수준. ageBand 와 같은 이유로 enum 고정.
          enum: ["없음", "1년미만", "3년미만", "3년이상"]
        amountBand:
          type: string
          nullable: true
          description: 가입금액대(비식별). ageBand 와 같은 이유로 enum 고정.
          enum: ["1천만원미만", "1천만원대", "3천만원대", "5천만원대", "1억원대", "3억원대이상"]
        contractRef:     {type: string, nullable: true, description: "계약건 참조번호(비식별)"}
        surveySchemaVersion: {type: string, nullable: true, description: "적합성 설문 문항 세트 버전 — 리포트가 어느 세트로 받았는지 판별(F-GTE-004)"}
        surveyResult:    {type: object, nullable: true, additionalProperties: true, description: "적합성 설문 결과(문항 식별자→답변)"}
    # data 의 모양을 소유자가 아직 정하지 않은 응답용 봉투. 봉투만 계약하고 안은 열어 둔다.
    # 프론트는 success 로 분기하고 data 는 해당 화면이 아는 형태로 읽는다.
    OpaqueApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {type: object, additionalProperties: true}
        error:   {type: object, nullable: true}

    ProductSummary:
      type: object
      required: [productId, name, productType, status]
      description: >
        S-02 선택 목록 항목. 업로드된 상품이 먼저(최근 업로드 순), 사전적재 데모 2종이 뒤다.
        ❗`parse_failed` 도 목록에 실린다 — 빼면 운영자가 올린 문서가 조용히 사라진다.
      properties:
        productId:   {type: string}
        name:        {type: string, description: "업로드본은 파일명에서 만든 표시명. 사전적재 2종은 가명(결정 1.11)"}
        productType: {type: string, enum: [ELS, VARIABLE_INSURANCE]}
        status:      {type: string, enum: [parsed, parse_failed]}
    ProductListApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {type: array, items: {$ref: '#/components/schemas/ProductSummary'}}
        error:   {type: object, nullable: true}

    UploadResponse:
      type: object
      required: [productId, status]
      properties:
        productId: {type: string, description: "발급된 상품ID. doc-<파일명 슬러그>-<sha256 앞 16자>. 슬러그가 비면 doc-<sha256 앞 16자>"}
        status:    {type: string, enum: [parsed, parse_failed], description: "parse_failed 는 문서를 못 열었다는 뜻 — 추출로 넘어가지 않고 문서를 다시 넣는다"}
    UploadApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/UploadResponse'}
        error:   {type: object, nullable: true}

    RiskItemsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 항목 스키마는 contracts/risk_item.schema.json (snake_case 계약의 camelCase 웹 표현)
          items: {type: object, additionalProperties: true}
    RiskItemsApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/RiskItemsResponse'}
        error:   {type: object, nullable: true}

    OverrideRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 30, description: "적색 진행 사유. 30자 미만 거부"}
    OverrideResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [PENDING_APPROVAL, APPROVED, REJECTED]
          description: >
            `REJECTED` 는 현재 **도달 불가**다 (이슈 #417 · ADR-002). MVP 는 반려 경로를 두지
            않는다 — 미승인 세션은 그대로 보류(적색)이고, 서버가 내는 값은 `PENDING_APPROVAL`·
            `APPROVED` 뿐이다(`domain/OverrideStatus` 에 `REJECTED` 가 없다). enum 값은 후속(반려
            엔드포인트, `POST …/override/reject`)을 위해 남기되, 지금 이 값을 기대하는 화면
            분기를 만들면 절대 안 오는 죽은 가지가 된다. 이 문면은 `OverrideStatus` javadoc 이
            하던 말을 계약으로 옮긴 것이다 — 계약이 낼 수 있다고 말하는 값과 실물이 어긋나지 않게.
    OverrideApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/OverrideResponse'}
        error:   {type: object, nullable: true}

    NextQuestion:
      type: object
      required: [index, total, done, vulnerable]
      properties:
        itemId:   {type: string, nullable: true, description: "done=true 면 null"}
        question: {type: string, nullable: true, description: "done=true 면 null"}
        index:    {type: integer, description: "1-based. done=true 면 total 과 같다"}
        total:    {type: integer, description: "서버가 물어볼 항목 수. 추출 항목 수와 다를 수 있다"}
        done:     {type: boolean, description: "더 물을 항목이 없다. 인터뷰 종료 판단의 유일한 근거"}
        vulnerable:
          type: boolean
          description: >
            취약 고객 여부. **`ReExplanation.vulnerable` 과 같은 값·같은 규칙이다** —
            렌더링 힌트(큰 글씨·비유)이지 화면에 표시할 라벨이 아니고, "취약 고객으로
            분류됨"을 본인에게 보이지 않는다(기획서 7-4).
            ❗**화면이 연령대로 대신 판정하지 않게 하려고 싣는다.** 근거는
            vulnerability_weights.yaml(연령·가입금액대·투자경험·채널 네 요인의 합 ≥
            임계값)이고 서버가 판정한다 — 연령대만 보는 근사가 아니다. 이 값이 없던
            동안 S-03 은 **재설명까지 한 번 실패한 뒤에야** 큰 글씨가 켜졌다(이슈 #319).
            done=true 여도 싣는다: 이 값은 이번 질문의 성질이 아니라 세션의 성질이라
            물을 것이 없는 응답에서만 비면 그 자리에서 힌트가 사라진다.
    NextQuestionApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/NextQuestion'}
        error:   {type: object, nullable: true}

    JudgmentsResponse:
      type: object
      required: [sessionId, state, judgments, reverify]
      properties:
        sessionId: {type: string}
        state:     {type: string, enum: [CREATED, IN_PROGRESS, RE_EXPLAIN, RE_VERIFY, JUDGED, CLOSED, ABORTED]}
        judgments:
          type: array
          description: 항목 ID 오름차순. 항목별 최신 판정만 담긴다(재검증 시 덮어씀)
          items: {$ref: '#/components/schemas/JudgmentView'}
        reverify:
          type: array
          description: >
            항목별 재검증 사용 상태 (#506). 재검증한 적 있는 항목만·ID 오름차순. 소진 여부를
            화면이 「눌러 봐야」 알던 것을 서버가 낸다 — sessionStorage/탭에 안 기댄다.
            ❗상한 N 은 안 싣는다(7-4 역이용 방지) — exhausted 불리언까지만.
          items: {$ref: '#/components/schemas/ReverifyStatus'}
    ReverifyStatus:
      type: object
      required: [itemId, used, exhausted]
      properties:
        itemId:    {type: string}
        used:      {type: integer, description: "이 항목에 쓴 재검증 횟수"}
        exhausted: {type: boolean, description: "상한 도달 — 재설명 불가, 판정으로 진행. 상한 값 자체는 안 실린다"}
    JudgmentsApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/JudgmentsResponse'}
        error:   {type: object, nullable: true}

    SessionResponse:
      type: object
      required: [sessionId, state, productId, overrideStatus]
      properties:
        sessionId:   {type: string}
        state:       {type: string, enum: [CREATED, IN_PROGRESS, RE_EXPLAIN, RE_VERIFY, JUDGED, CLOSED, ABORTED]}
        productId:   {type: string}
        contractRef: {type: string, nullable: true}
        # F-GTE-002 적색 오버라이드 — S-06 승인 화면이 사유·승인 대기 여부·승인자를 읽는다.
        overrideStatus:    {type: string, enum: [NONE, PENDING_APPROVAL, APPROVED], description: "오버라이드 없으면 NONE"}
        overrideReason:    {type: string, nullable: true, description: "판매자가 적은 진행 사유(30자 이상). 요청 전이면 null"}
        overrideApprover:  {type: string, nullable: true, description: "승인한 MGR. 승인 전이면 null"}
        overrideDecidedAt: {type: string, format: date-time, nullable: true, description: "승인 시각. 승인 전이면 null"}
    SessionApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/SessionResponse'}
        error:   {type: object, nullable: true}

    AnswerRequest:
      type: object
      description: F-INT-003 텍스트 응답. text는 서버에서 PII 마스킹 후 ai-service로.
      required: [itemId, text]
      properties:
        itemId:    {type: string}
        text:      {type: string, description: "고객 발화(서버에서 마스킹)"}
        inputMeta:
          $ref: '#/components/schemas/InputMeta'

    SkipRequest:
      type: object
      description: >-
        E-INT-03 항목 건너뛰기. **본문은 항목뿐이다.**
        ❗발화를 싣지 않는다 — 예전에는 화면이 `"(응답하지 않음)"` 을 AnswerRequest.text 에
        실어 보냈고, 그러면 인용할 발화가 없는 판정을 모델이 만들어야 해서 502 가 났다
        (judgment.schema.json 의 evidence.utterance_quote 는 빈 문자열을 안 받는다).
        그 표시 문자열은 이제 서버가 소유한다.
        ❗inputMeta 도 없다 — "어떻게 입력했나" 인데 입력이 없다. 0 을 남기면 기록에서
        "빈 입력을 쟀다" 로 읽히고, evidence 는 append-only 라 나중에 못 뺀다.
      required: [itemId]
      additionalProperties: false
      properties:
        itemId:    {type: string}

    InputMeta:
      type: object
      nullable: true
      additionalProperties: false
      description: >-
        F-INT-003 입력 메타데이터 — **무엇을 말했나가 아니라 어떻게 입력했나**.
        붙여넣기로 채운 되말하기는 발화 내용만 보면 완벽한 U1 로 채점되므로,
        텍스트로는 구분이 안 되고 이 값으로만 구분된다.
        ❗**측정이지 판정이 아니다**(P1) — 게이트에 안 물리고 불변 기록에만 쌓인다.
        ❗**판매자 응답에 안 실린다** — 판매자가 무엇이 잡히는지 알면 손으로 옮겨 적고,
        그러면 신호만 죽고 행동은 그대로다(#144 가 misconceptionType 을 뺀 것과 같은 결).
        ❗`additionalProperties: false` 다 — 서버가 타입으로 받으므로 모르는 키는 버려진다.
        evidence 는 append-only 라 화면이 실어 보낸 것이 그대로 박히면 못 뺀다.
        안 보내도 된다(null). 그때 기록에는 null 로 남아 "안 보냈다" 와 "0" 이 갈린다.
      properties:
        firstKeystrokeDelayMs: {type: integer, format: int64, minimum: 0, description: "질문이 뜨고 첫 타이핑까지"}
        totalInputMs:          {type: integer, format: int64, minimum: 0, description: "첫 타이핑부터 제출까지"}
        pasteDetected:         {type: boolean, description: "붙여넣기가 있었나"}
        backspaceCount:        {type: integer, minimum: 0}
        charCount:             {type: integer, minimum: 0, description: "공백을 뺀 글자 수"}
        elderlyMode:           {type: boolean, description: "지연·입력시간의 해석 기준이 달라진다"}

    # 웹 응답용 Judgment(camelCase). 내부 ai-service 계약은 judgment.schema.json(snake_case).
    #
    # ❗misconceptionType 은 여기 없다 (이슈 #144). 그 값이 불공정영업 신호 그 자체라서다 —
    #   UnfairSalesTypes.isSignal 이 보는 필드이고 M08-TYING 이면 COMPL 로 사건이 나간다.
    #   rbac_policy.yaml 이 signal:unfair:read 를 COMPL 로 좁혀 뒀는데 판정 응답으로 나가면
    #   그 좁힘이 무의미하다. 판매자가 무엇이 탐지되는지 알면 문면만 바꿔 우회한다(기획 7-4).
    #   신호일 때만 빼면 그 부재가 곧 신호이므로 항상 뺀다.
    #   내부 계약(judgment.schema.json)에는 그대로 있다 — 재설명 프롬프트가 쓰고 불변 기록에도
    #   남는다. 빠지는 것은 판매자 화면으로 가는 이 표현 하나다.
    JudgmentView:
      type: object
      required: [itemId, grade, confidence, evidence, reason]
      properties:
        itemId:     {type: string}
        grade:      {type: string, enum: [U1, U2, U3, U4]}
        confidence: {type: number, minimum: 0, maximum: 1}
        evidence:
          type: object
          required: [utteranceQuote, rubricClause]
          properties:
            utteranceQuote: {type: string}
            rubricClause:   {type: string}
        reason:            {type: string}
    JudgmentApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/JudgmentView'}
        error:   {type: object, nullable: true}

    ReExplainRequest:
      type: object
      required: [itemId]
      properties:
        itemId: {type: string, description: "다시 설명할 이해항목"}
    ReExplanation:
      type: object
      required: [itemId, content, vulnerable, reverifyQuestion]
      properties:
        itemId:     {type: string}
        content:    {type: string, description: "재설명 문면(취약 시 고령자 모드)"}
        vulnerable:
          type: boolean
          description: >
            취약 고객 여부. 렌더링 힌트(큰 글씨·비유)이지 화면에 표시할 라벨이 아니다 —
            "취약 고객으로 분류됨"을 본인에게 보이지 않는다(기획서 7-4, 보호 목적으로만).
        reverifyQuestion:
          type: string
          description: >
            재설명 직후 같은 항목을 다시 물을 때 쓸 변형 질문(F-INT-002). 프론트는 직전 질문을
            재사용하지 말고 이 값을 띄운다. 서버 구현이 목인 동안에는 항목별 고정 문면이라
            기획서 7-4 1단계(우회 비용 상향)를 아직 만족하지 않는다 — 문서 자동 생성이
            붙어야 성립한다. 계약 형태는 그때도 바뀌지 않는다.
    ReExplanationApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/ReExplanation'}
        error:   {type: object, nullable: true}
    GatePreview:
      type: object
      required: [signal, ruleTrace, recorded, suitabilityStatus]
      properties:
        signal:    {type: string, enum: [GREEN, YELLOW, RED]}
        ruleTrace:
          type: array
          items: {$ref: '#/components/schemas/RuleRef'}
          description: "발화한 룰 — 그 신호를 낸 사유 전부"
        recorded:
          type: boolean
          description: >
            감사 기준점으로 기록된 값인가. false 면 아직 확정이 아니다 — 화면이 이걸
            확정으로 보관하면 안 된다. /judge 를 부른 뒤에만 true 가 된다.
        judgedAt:
          type: string
          format: date-time
          nullable: true
          description: "기준점 확정 시각. null 이면 /judge 가 아직 호출되지 않은 세션이다"
        suitabilityStatus:
          type: string
          enum: [NOT_EVALUATED, NO_MISMATCH, MISMATCH, UNKNOWN]
          description: >
            적합성 모순 판정 상태 (F-DET-002). ❗미리보기는 모순을 평가하지 않으므로 보통
            NOT_EVALUATED 다 — 그 상태의 signal 은 모순 평가 전 값이라 /judge 에서
            YELLOW(UNKNOWN) · RED(MISMATCH) 로 갈릴 수 있다. NOT_EVALUATED 인 GREEN 을
            최종 통과로 그리면 안 되고, "적합성 미확인" 을 함께 보여야 한다.
    GatePreviewApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/GatePreview'}
        error:   {type: object, nullable: true}
    # ── F-SIM-001 손실 시뮬레이터 (소유: 정세현) ──────────────────────────────
    SimScenario:
      type: object
      required: [severity, result, name, payout, pnl, pathMeta]
      properties:
        severity:
          type: string
          enum: [worst, mid, best]
          description: >
            화면 배치·정렬 키다. **표시 라벨이 아니다** — 기획서 7-2 표는 평가어
            ("최선/중간/최악")를 버리고 금액 순으로 갔다. 그 이유는 스텝다운이 조기상환
            시점과 무관하게 연 수익률이 같고 총액만 달라서, 가장 자주 일어나는 전개가
            금액으로는 가장 작기 때문이다("최선이 왜 더 작은가"라는 잘못된 질문이 생긴다).
            화면은 명세 8절 S-04 의 3열 동일 비중 요건을 위해 이 키로 자리를 고정하고,
            사람에게 보일 문면은 `name` 을 쓴다.
        result:
          type: string
          description: "정확한 상환 유형. early_1..early_5 | maturity | loss (SimulatorService.Outcome.result 그대로)"
        name:   {type: string, description: "표시 문면(예: 낙인 45% 하회 후 만기 손실)"}
        payout: {type: integer, format: int64, description: "상환금액(원). 원 단위 절사"}
        pnl:    {type: integer, format: int64, description: "손익(원). 음수는 손실"}
        share:  {type: number, nullable: true, minimum: 0, maximum: 1, description: "역사 전 구간에서 이 전개가 발생한 비중"}
        pathMeta: {$ref: '#/components/schemas/PathMeta'}
    PathMeta:
      type: object
      description: >
        어느 실제 지수 구간을 썼는지. 명세 8절 S-04 의 "역사 구간 라벨" 을 그리는 데 쓰고,
        동시에 P2 재현성의 실물 근거가 된다 — 화면에 스냅샷을 박으면 "이 수치는 이
        스냅샷에서 나왔다"가 심사자에게 보인다.
      required: [startDate, endDate, underlyings, worstUnderlying, worstFinal, knockedIn]
      properties:
        startDate:       {type: string, format: date, description: "계약일"}
        endDate:         {type: string, format: date, description: "상환일(조기상환 또는 만기)"}
        underlyings:     {type: array, items: {type: string}, description: "기초자산 키(sp500·nikkei225·eurostoxx50)"}
        worstUnderlying: {type: string, description: "만기평가일 최저 종목 — 손실 판정의 기준"}
        worstFinal:      {type: number, description: "그 종목의 최초기준가격 대비 비율(예: 0.507)"}
        knockedIn:       {type: boolean, description: "낙인 배리어를 하회한 적이 있는가"}
    SimulateRequest:
      type: object
      description: >
        `amount` 에 서버 기본값을 두지 않는다. 금액은 화면이 슬라이더로 정하는 값이라
        서버가 임의 기본값을 갖고 있으면 프론트 버그가 조용히 그럴듯한 숫자로 덮인다.
      required: [amount]
      properties:
        amount: {type: integer, format: int64, minimum: 1, description: "가입금액(원, 양수)"}
    SimulateResponse:
      type: object
      required: [scenarios, timeseriesVersion, productName]
      properties:
        scenarios:
          type: array
          minItems: 3
          maxItems: 3
          items: {$ref: '#/components/schemas/SimScenario'}
          description: "severity 별로 정확히 1건씩"
        timeseriesVersion: {type: string, description: "data/timeseries/VERSION 의 snapshot(예: 2026-08-24). 화면에 표시한다"}
        productName:       {type: string, description: "상품 조건의 출처(예: 키움증권 제4181회 ELS)"}
    SimulateApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/SimulateResponse'}
        error:   {type: object, nullable: true}

    # ── F-GTE-004 이해 기록 리포트 (소유: 정세현) ─────────────────────────────
    ReportResponse:
      type: object
      required: [reportId, sessionId, generatedAt, contentHash]
      properties:
        reportId:    {type: string}
        sessionId:   {type: string}
        generatedAt: {type: string, format: date-time}
        contentHash:
          type: string
          description: >
            리포트 **내용**을 CanonicalJson 으로 직렬화한 sha256. 체인의 항목 해시가 아니다 —
            항목 해시는 앞 항목과 순번에 의존하므로 문서 한 장을 든 고객이 재계산할 수 없고,
            그러면 해시를 싣는 이유가 사라진다. 요약본과 같은 값이어야 하는 이유이기도 하다.
            발행 시각은 내용에 넣지 않는다 — 넣으면 같은 내용을 두 번 발행할 때마다 해시가
            달라져 "이 문서가 그 문서인가" 를 대조할 수 없다.
            검증은 두 층이다. (1) 체인이 온전한가는 `audit:verify`. (2) 이 문서가 그 기록에서
            나왔는가는 기록을 다시 조립해 이 해시와 대조한다. 발행 사실 자체는 체인에 남고
            그 항목의 payload 가 이 값을 담는다.
        previewUrl:
          type: string
          nullable: true
          description: >
            브라우저 미리보기(PDF 인라인) — `GET /sessions/{id}/report/preview`.
            **PDF 가 붙어서 이제 값이 있다**(이슈 #233 · PR #244). 예전에는 null 이 계약이었다:
            생성이 없는데 채우면 계약이 "이 URL 로 가면 문서가 있다" 를 보장하는데 404 가 나고,
            스키마 검증은 통과하며 화면은 링크를 그려서 눌러야 드러났다. 지금은 그 보장이
            참이다 — 발행된 리포트가 있어야 이 응답 자체가 만들어진다.
            ❗**이 값은 API 기준 경로다 — 사이트 기준이 아니다.** 브라우저에서 쓸 때는
            그 배포의 API 접두어를 앞에 붙인다(이 배포에서는 `/api`). 서버가 접두어를 지어내지
            않는 이유는 그것이 **프론트 배포의 값**이기 때문이다 — 서버가 알기 시작하면
            `client.ts` 의 `BASE` 와 두 벌이 되고, 갈리는 날 링크만 조용히 깨진다.
            ❗**안 붙이면 404 가 아니라 200 이다.** nginx 의 `location /` 이 `index.html` 로
            떨어뜨리므로 미리보기는 빈 탭, 내려받기는 PDF 대신 HTML 파일을 받는다 —
            눌러야 드러나고, 눌러도 원인이 안 보인다(PR #247 리뷰 실측).
            nullable 은 유지한다 — 키가 없는 것과 값이 null 인 것은 다르고, 화면이 옛 응답을
            만날 수 있다.
        downloadUrl:
          type: string
          nullable: true
          description: >
            PDF 내려받기 — `GET /sessions/{id}/report/download`. previewUrl 과 **같은 바이트**를
            가리키고 `Content-Disposition` 만 다르다.
    ReportApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/ReportResponse'}
        error:   {type: object, nullable: true}
    ReportSummaryResponse:
      type: object
      description: >
        고객 교부용 요약. 판매자용 전문(`ReportResponse`)과 **다른 문서**이므로 스키마를 나눈다 —
        경로를 나눈 근거가 두 문서가 다르다는 것이므로, 한쪽이 바뀔 때 다른 쪽 계약이 깨지면
        안 된다. 전문의 항목별 판정 이력·재설명 이력은 담지 않는다.
      required: [reportId, sessionId, generatedAt, contentHash, previewUrl]
      properties:
        reportId:    {type: string}
        sessionId:   {type: string}
        generatedAt: {type: string, format: date-time}
        contentHash:
          type: string
          description: >
            전문과 **같은 해시**다. 고객이 받은 문서를 나중에 대조할 수 있어야 하므로 요약본에도
            싣는다.
        previewUrl:
          type: string
          nullable: true
          description: >
            브라우저 미리보기(PDF 인라인) — `GET /sessions/{id}/report/preview`.
            **PDF 가 붙어서 이제 값이 있다**(이슈 #233 · PR #244 · #417 덧). 전문
            (`ReportResponse.previewUrl`)과 같은 PDF 를 가리키므로 성격이 다를 이유가 없다.
            예전에는 null 이 계약이었다(생성이 없는데 채우면 "이 URL 로 가면 문서가 있다" 를
            보장하는데 404 가 나고, 스키마 검증은 통과하며 화면은 링크를 그려 눌러야 드러났다).
            `nullable`·`required` 는 남긴다 — 발행 전 상태를 화면이 "아직 없다" 로 그릴 수 있어야
            하고, 키가 없는 것과 값이 null 인 것은 다르다.
        downloadUrl: {type: string, nullable: true, description: "교부 방식이 정해지기 전까지 nullable"}
    ReportSummaryApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/ReportSummaryResponse'}
        error:   {type: object, nullable: true}

    # ── F-DSH-001·002 대시보드 (집계 소유: 정세현) ────────────────────────────
    HeatmapCell:
      type: object
      required: [product, item, n, masked]
      properties:
        product: {type: string}
        item:    {type: string, description: "이해항목 item_id"}
        productName:
          type: string
          nullable: true
          description: >
            상품 **유형**의 표시명(예: VARIABLE_INSURANCE → "변액보험"). **유형 축에서만
            찬다** — 실제 상품ID 로 집계되는 축의 이름은 GET /products 가 이미 주므로
            여기서 null 이고 화면이 그쪽으로 그린다. 두 벌이 되는 자리를 안 만든다.
        itemName:
          type: string
          nullable: true
          description: >
            이해항목 표시명. **루브릭 이름이다** — 추출 이름("낙인 배리어 45%")은 이 회차
            값이라 상품을 넘어 합치는 축에 쓰면 같은 항목이 두 줄이 된다(결정 5.42).
            카탈로그에 없으면 null 이고 화면은 item 을 그대로 그린다 — 라벨이 없다고 집계를
            멈추지 않는다. required 가 아닌 이유가 그것이다.
        itemRequires:
          type: array
          items: {type: string}
          description: >
            **이 항목이 무엇을 재는가** — 고객이 말할 수 있어야 채점이 「이해」로 보는 요소들.
            채점 루브릭(ai-service/app/rubrics/*.yaml)의 required_elements 를 **글자 그대로**
            싣는다. itemName 의 다음 층이다: 이름(「전액손실 사례」)은 항목을 가리키기만 하고
            그 칸이 무엇을 센 것인지는 말하지 않아서, 축을 처음 보는 사람이 거기서 멈춘다.
            요약본을 실으면 화면이 채점 기준과 다른 말을 하게 되므로 원문 그대로다.
            카탈로그에 없으면 빈 배열 — 그때 화면은 이름만 그린다.
        misrate: {type: number, nullable: true, minimum: 0, maximum: 1, description: "오해율. masked 면 null"}
        n:       {type: integer, minimum: 0, description: "표본 수. 마스킹돼도 내려준다"}
        masked:
          type: boolean
          description: >
            소표본(n<30) 마스킹 여부. **셀을 제거하지 않는다** — 제거하면 화면이
            "데이터 없음"과 "가려짐"을 구분할 수 없고, 감사·심사 관점에서는 가려졌다는
            사실 자체가 마스킹이 동작한 증거다. 근거: rbac_policy.yaml 집계 절.
        grades:
          allOf: [{$ref: '#/components/schemas/GradeDistribution'}]
          nullable: true
          description: >
            등급 분포. **masked 면 null 이다 — misrate 와 같은 규칙이다.**
            분포만 남기면 U4 건수 ÷ n 으로 misrate 가 그대로 복원되므로 마스킹이 뚫린다.
    GradeDistribution:
      type: object
      required: [u1, u2, u3, u4]
      description: >
        등급별 **건수**(비율이 아니다. 이슈 #177). 건수로 주면 화면이 비율·합계를 다 만들 수
        있고 `u1+u2+u3+u4 == n` 검산이 성립한다 — 비율이면 반올림 때문에 그 검산이 사라진다.
        misrate(U4 비율) 하나만으로는 화면이 **"이해했는가"** 를 말할 수 없다: 41% 만 보이면
        "59%는 이해했다" 로 읽히는데 그 안에 부분이해·미이해가 섞여 있고 U1 이 0 건이어도
        같은 값이 나온다. 개인 식별자는 나가지 않는다 — 등급별 건수는 집계 수치다(기획 7-4).
      properties:
        u1: {type: integer, minimum: 0, description: "이해"}
        u2: {type: integer, minimum: 0, description: "부분이해"}
        u3: {type: integer, minimum: 0, description: "미이해"}
        u4: {type: integer, minimum: 0, description: "오해 — 이 건수가 misrate 의 분자다"}
    HeatmapResponse:
      type: object
      required: [synthetic, scope, cells]
      properties:
        synthetic:
          type: boolean
          description: "합성 세션 기반이면 true — 화면에 워터마크를 상시 노출한다(연출 금지)"
        scope:
          type: string
          enum: [branch, org]
          description: >
            **데이터 범위**다. `rbac_policy.yaml` 의 `own_session`/`branch`/`org` 와 같은 어휘이며
            요청자 역할이 결정한다(MGR=branch · COMPL=org). 집계 축(`groupBy`)과 혼동하지 말 것 —
            화면에 표시해 무엇을 보고 있는지 드러낸다.
        cells: {type: array, items: {$ref: '#/components/schemas/HeatmapCell'}}
    ContrastRow:
      type: object
      required: [band, misrate, n, masked, grades]
      properties:
        band:
          type: string
          enum: [vulnerable, other]
          description: >
            취약/비취약. 판정 근거는 vulnerability_weights.yaml 이고 서버가 정한다.
        misrate:
          type: number
          nullable: true
          description: U4 비율. masked 면 null 이다.
        n: {type: integer, description: 표본 수. masked 여도 내려간다}
        masked: {type: boolean, description: "n < 30 이면 true"}
        grades:
          allOf: [{$ref: '#/components/schemas/GradeDistribution'}]
          nullable: true
          description: 등급 분포. **masked 면 null 이다** — 히트맵 셀과 같은 규칙이다.

    ContrastResponse:
      type: object
      required: [synthetic, scope, rows]
      properties:
        synthetic: {type: boolean}
        scope: {type: string}
        rows:
          type: array
          minItems: 2
          maxItems: 2
          description: >
            **언제나 두 줄이다** — vulnerable 이 먼저, other 가 뒤. 표본이 0 이어도 자리를 지운다면
            화면이 대비를 못 그린다.
          items: {$ref: '#/components/schemas/ContrastRow'}

    ContrastApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/ContrastResponse'}
        error:   {type: object, nullable: true}

    HeatmapApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/HeatmapResponse'}
        error:   {type: object, nullable: true}
    AuditSummary:
      type: object
      required: [total, unreadable, byAction, byResultCode, deniedByRole]
      description: >
        접근 감사 집계 (#326 파트2). ❗개인 식별자(actorId·resource)를 담지 않는다 — 집계만.
      properties:
        from: {type: string, format: date-time, nullable: true, description: "포함. null 이면 처음부터"}
        to:   {type: string, format: date-time, nullable: true, description: "제외(반열림). null 이면 끝까지"}
        total:      {type: integer, format: int64, description: "그 기간에 읽어 센 접근 수"}
        unreadable: {type: integer, format: int64, description: "payload 를 못 읽어 어느 기간에도 못 넣은 건수 — total 과 따로 센다"}
        byAction:     {type: object, additionalProperties: {type: integer, format: int64}, description: "action → 건수"}
        byResultCode: {type: object, additionalProperties: {type: integer, format: int64}, description: "resultCode → 건수"}
        deniedByRole:
          type: object
          additionalProperties: {type: integer, format: int64}
          description: "401·403 으로 끝난 접근의 역할별 건수 — 기획서 7-4(역이용 방지)의 실물 숫자"
    AuditSummaryApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/AuditSummary'}
        error:   {type: object, nullable: true}
    AuditVerify:
      type: object
      required: [ok, checked, brokenAt, brokenSeq, reason]
      description: "감사 해시 체인 검증 결과 (#326 파트2). 개인 식별자 없음."
      properties:
        ok:        {type: boolean, description: "체인이 온전한가"}
        checked:   {type: integer, description: "검사한 항목 수"}
        brokenAt:  {type: integer, description: "끊긴 인덱스. ok 면 -1"}
        brokenSeq: {type: integer, format: int64, description: "끊긴 seq. ok 면 -1"}
        reason:    {type: string, description: "끊긴 사유. ok 면 빈 문자열"}
    AuditVerifyApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/AuditVerify'}
        error:   {type: object, nullable: true}
    EvidenceMetrics:
      type: object
      required: [sessions, judgments, unreadable, questionSource, confidence, sessionDuration, reexplainTransitions]
      description: "실세션 운영 지표 (#327 · #479). 합성 세션은 없음. 프로세스 수명 값."
      properties:
        sessions:   {type: integer, format: int64, description: "실세션 수(불변 기록 기준)"}
        judgments:  {type: integer, format: int64}
        unreadable: {type: integer, format: int64, description: "payload 를 못 읽어 못 센 건수 — 0 과 다르다(결정 5.40)"}
        questionSource: {type: object, additionalProperties: {type: integer, format: int64}, description: "llm · template_fallback · (미기록) → 건수"}
        confidence:     {type: object, additionalProperties: {type: integer, format: int64}, description: "confidence 값 → 건수"}
        sessionDuration:
          type: object
          required: [sessions]
          properties:
            sessions:      {type: integer, description: "소요시간을 잰 세션 수"}
            minSeconds:    {type: integer, format: int64, nullable: true}
            medianSeconds: {type: integer, format: int64, nullable: true}
            maxSeconds:    {type: integer, format: int64, nullable: true}
        reexplainTransitions: {type: object, additionalProperties: {type: integer, format: int64}, description: "재설명 전후 등급 전환 → 건수"}
    EvidenceMetricsApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/EvidenceMetrics'}
        error:   {type: object, nullable: true}
    IndicatorPoint:
      type: object
      required: [period, n, masked]
      properties:
        period:  {type: string, description: "ISO 주 단위(예: 2026-W32)"}
        misrate: {type: number, nullable: true, minimum: 0, maximum: 1}
        n:       {type: integer, minimum: 0}
        masked:  {type: boolean, description: "히트맵과 같은 규칙(n<30)"}
    IndicatorSeries:
      type: object
      required: [groupBy, key, points]
      properties:
        groupBy: {type: string, enum: [branch, seller, item], description: "집계 축. 데이터 범위(scope)가 아니다"}
        key:     {type: string, description: "지점·판매자·항목 식별자. 판매자는 비식별 대체키"}
        itemName:
          type: string
          nullable: true
          description: >
            사람이 읽는 이름. **`groupBy: item` 에서만 찬다** — 나머지 축은 null 이고 화면이
            `key` 를 그대로 그린다. 값은 채점 루브릭의 항목명이고 HeatmapCell.itemName 과
            **같은 출처·같은 규칙**이다(결정 5.42 — 추출 이름은 회차 값이라 상품을 넘어
            합치는 축에 쓰면 같은 항목이 두 줄이 된다).
            ❗**판매자 축에는 이름이 있으면 안 된다.** `key` 가 비식별 대체키인 이유가
            그것이라, 그 자리에 이름을 실으면 계약이 대체키를 쓰는 뜻이 사라진다.
            카탈로그에 없으면 null 이다 — 라벨이 없다고 집계를 멈추지 않는다.
        points: {type: array, items: {$ref: '#/components/schemas/IndicatorPoint'}}
    IndicatorOutlier:
      type: object
      required: [groupBy, key, reason]
      properties:
        groupBy: {type: string, enum: [branch, seller, item], description: "집계 축. 데이터 범위(scope)가 아니다"}
        key:     {type: string}
        itemName:
          type: string
          nullable: true
          description: >
            사람이 읽는 이름. **`groupBy: item` 에서만 찬다** — 나머지 축은 null 이고 화면이
            `key` 를 그대로 그린다. 값은 채점 루브릭의 항목명이고 HeatmapCell.itemName 과
            **같은 출처·같은 규칙**이다(결정 5.42 — 추출 이름은 회차 값이라 상품을 넘어
            합치는 축에 쓰면 같은 항목이 두 줄이 된다).
            ❗**판매자 축에는 이름이 있으면 안 된다.** `key` 가 비식별 대체키인 이유가
            그것이라, 그 자리에 이름을 실으면 계약이 대체키를 쓰는 뜻이 사라진다.
            카탈로그에 없으면 null 이다 — 라벨이 없다고 집계를 멈추지 않는다.
        reason: {type: string, description: "사람이 읽는 사유(예: 직전 4주 대비 +18%p)"}
        delta:  {type: number, nullable: true, description: "기계 판독용 변화량"}
    LeadingIndicatorResponse:
      type: object
      required: [synthetic, scope, series, outliers]
      properties:
        synthetic: {type: boolean, description: "히트맵과 동일 — 두 뷰 모두 워터마크 상시 노출"}
        scope:     {type: string, enum: [branch, org], description: "데이터 범위(히트맵과 동일 의미). 집계 축은 groupBy 다"}
        series:    {type: array, items: {$ref: '#/components/schemas/IndicatorSeries'}}
        outliers:  {type: array, items: {$ref: '#/components/schemas/IndicatorOutlier'}}
    LeadingIndicatorApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/LeadingIndicatorResponse'}
        error:   {type: object, nullable: true}

    RuleRef:
      type: object
      required: [id, label]
      description: >-
        발화한 게이트 룰 하나. `label` 은 gate_rules.yaml 이 들고 있고 판정 시점의 값이
        기록에 남는다 — 룰 파일이 바뀌어도 옛 판정의 문면은 안 바뀐다.
        ❗label 은 **결과만 말하고 조건은 말하지 않는다**. 판매자가 읽는 글이라 임계값이
        새면 그 위를 겨냥할 수 있다(기획서 7-4 역이용 방지).
      properties:
        id:    {type: string, description: "룰 ID (예: R-00). 감사·심사에서 이것 자체가 근거다"}
        label: {type: string, description: "사람이 읽는 문면 (예: 채점되지 않은 항목이 있습니다)"}

    DecisionView:
      type: object
      required: [synthetic, scope, gate, override, reexplain, unmeasured]
      properties:
        synthetic: {type: boolean, description: "합성 데이터 표기 — 항상 true (기획서)"}
        scope:     {type: string, enum: [org, branch]}
        gate:
          type: array
          items: {$ref: '#/components/schemas/SignalCount'}
          description: "게이트 신호 분포. 판정된 세션만 센다 — 진행 중 세션은 결정이 없다"
        override:  {$ref: '#/components/schemas/OverrideCount'}
        reexplain: {$ref: '#/components/schemas/ReexplainEffect'}
        unmeasured: {$ref: '#/components/schemas/UnmeasuredCount'}

    SignalCount:
      type: object
      required: [signal, n, share]
      properties:
        signal: {type: string, enum: [GREEN, YELLOW, RED]}
        n:      {type: integer, minimum: 0}
        share:  {type: number, nullable: true, description: "판정된 세션 대비. 표본 부족이면 null"}

    CoachingSignal:
      type: object
      required: [groupBy, key, sessions, firstPassRate, homogeneity, medianInputMs, orgFirstPassRate, orgHomogeneity, orgMedianInputMs, reasons, masked]
      description: >-
        판매자 한 명(가명)의 코칭 정황. **판정이 아니라 이관 대상 표시**다 —
        `reasons` 가 비어 있으면 이상치가 아니고, 줄은 그대로 남는다(가려진 것과
        아무 일 없는 것을 화면이 구별할 수 있어야 한다).
      properties:
        groupBy: {type: string, enum: [seller]}
        key:     {type: string, description: "가명. 같은 판매자는 늘 같은 값이지만 역산되지 않는다"}
        sessions: {type: integer, minimum: 0, description: "표본 — 이 판매자의 세션 수"}
        firstPassRate:
          type: number
          nullable: true
          description: "재검증 없이 첫 답에 U1 이 된 비율. 표본 30 미만이면 null"
        homogeneity:
          type: number
          nullable: true
          description: >-
            같은 항목에 대한 **서로 다른 세션** 발화들의 평균 겹침(문자 바이그램).
            코칭이 없는 상태의 기준선은 라벨 코퍼스 212쌍 실측으로 평균 0.055 · 최대 0.444다.
        medianInputMs:
          type: integer
          nullable: true
          description: >-
            답변 입력 시간의 중앙값(ms). 값을 안 보낸 답변은 안 센다 — 0 으로 채우면
            화면이 옛 버전인 세션이 전부 "즉답" 이 되어 그 판매자가 이상치로 뜬다.
            ❗**빠른 쪽만 이상치로 본다.** 느린 것은 대개 취약 고객이 많은 것이고
            그건 이상이 아니다 — 양쪽을 다 물면 보호하려던 지점을 이관하게 된다.
        orgFirstPassRate: {type: number, nullable: true, description: "같은 범위 전체의 통과율 — 「다른 곳과 다르다」의 기준"}
        orgHomogeneity:   {type: number, nullable: true}
        orgMedianInputMs: {type: integer, nullable: true, description: "같은 범위 전체의 입력 시간 중앙값"}
        reasons:
          type: array
          items: {type: string}
          description: "이상치로 본 사유. 비어 있으면 이상치가 아니다"
        masked: {type: boolean, description: "표본 30 미만 — 두 비율이 null 이다"}

    CoachingView:
      type: object
      required: [synthetic, scope, rows]
      properties:
        synthetic: {type: boolean, description: "합성 데이터 표기 — 항상 true (기획서)"}
        scope:     {type: string, enum: [org, branch]}
        rows:
          type: array
          items: {$ref: '#/components/schemas/CoachingSignal'}

    CoachingApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/CoachingView'}
        error:   {type: object, nullable: true}

    OverrideCount:
      type: object
      required: [requested, approved, judged, masked]
      description: >-
        적색 오버라이드. **요청과 승인을 가른다** — 요청만 하고 승인 안 된 건수가
        그 자체로 신호다(ADR-002: 요청자 ≠ 승인자). 분모는 판정된 세션이다 —
        오버라이드는 RED 판정 뒤에만 생기고, 가림 판단도 같은 표본으로 한다.
      properties:
        requested: {type: integer, minimum: 0}
        approved:  {type: integer, minimum: 0}
        judged:    {type: integer, minimum: 0, description: "분모 — 판정된 세션 수"}
        masked:    {type: boolean}

    ReexplainEffect:
      type: object
      required: [items, resolved, rate, masked]
      description: >-
        ★ 재설명을 거친 항목 중 최종 이해(U1)에 도달한 비율. 이 제품이 실제로 이해를
        올렸다는 유일한 정량 근거다.
      properties:
        items:    {type: integer, minimum: 0, description: "재설명을 거친 (세션, 항목) 수"}
        resolved: {type: integer, minimum: 0, description: "그중 최종 U1"}
        rate:     {type: number, nullable: true, description: "표본 부족이면 null — 0 과 다르다"}
        masked:   {type: boolean}

    UnmeasuredCount:
      type: object
      required: [sessions, judged, share, masked]
      description: "못 잰 항목이 있는 채로 판정된 세션 — gate_rules R-00 이 무는 자리다."
      properties:
        sessions: {type: integer, minimum: 0}
        judged:   {type: integer, minimum: 0}
        share:    {type: number, nullable: true}
        masked:   {type: boolean}

    DecisionApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/DecisionView'}
        error:   {type: object, nullable: true}

    GateResult:
      type: object
      required: [signal, ruleTrace, unmeasured, rulesVersion]
      properties:
        signal:    {type: string, enum: [GREEN, YELLOW, RED]}
        ruleTrace:
          type: array
          items: {$ref: '#/components/schemas/RuleRef'}
          description: "발화한 룰 — 그 신호를 낸 사유 전부. 하나가 아닐 수 있다"
        unmeasured:
          type: integer
          minimum: 0
          description: >-
            판정 시점의 미측정 항목 수 — 질문을 보냈는데 판정이 안 돌아온 항목.
            1 이상이면 R-00 이 RED 를 낸다. 판정 뒤에 그 항목이 마저 채점돼도
            이 값은 안 바뀐다(재계산값이 아니라 그때의 기록값).
        rulesVersion:
          type: integer
          description: >-
            판정에 쓴 gate_rules.yaml 의 version. 임계값이 바뀐 뒤의 판정과
            그 전의 판정을 감사 시점에 가르는 값이다.
    GateApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/GateResult'}
        error:   {type: object, nullable: true}
