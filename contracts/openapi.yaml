openapi: 3.0.3
info:
  title: SphinX API
  version: 0.1.0
  description: >
    web ↔ server REST 계약. ai-service(내부망 전용)의 /internal/* 인터페이스는 여기 없다 —
    그 경계의 페이로드는 contracts/*.schema.json(judgment·risk_item·parsed_document)으로 계약한다.
paths:
  /products:
    get:
      summary: 상품 목록 (S-02 선택지)
      description: >
        나머지 /products/* 는 전부 productId 를 이미 알아야 부를 수 있다. 고를 수 있는
        상품을 주는 유일한 경로다. S-01(문서 업로드)이 붙으면 업로드한 상품이 여기에 나온다.
      responses:
        '200':
          description: 상품 목록
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductListApiResponse'}

  /products/documents:
    post:
      summary: 문서 업로드 (F-EXT-001)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:        {type: string, format: binary}
                productType: {type: string, enum: [ELS, VARIABLE_INSURANCE], default: ELS}
      responses:
        '200':
          description: 업로드·파싱 결과
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadApiResponse'}

  /products/{id}/extract:
    post:
      summary: 위험요소 추출 (F-EXT-002)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 추출된 이해항목
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RiskItemsApiResponse'}

  /products/{id}/risk-items:
    get:
      summary: 추출 항목 조회
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 이해항목 목록
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RiskItemsApiResponse'}

  /sessions:
    post:
      summary: 세션 생성 (F-INT-001)
      description: 비식별 속성만 받는다 — 성명·주민번호 필드는 스키마에 존재하지 않는다 (P3).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSessionRequest'}
      responses:
        '200':
          description: 생성된 세션(상태 CREATED)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionApiResponse'}
        '400':
          description: 필수 속성 누락 또는 유효성 오류
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /sessions/{id}:
    get:
      summary: 세션 상태 조회 (F-INT-001)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 세션
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionApiResponse'}
        '404':
          description: 세션 없음
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /sessions/{id}/questions/next:
    post:
      summary: 다음 질문 + 진행 상태 (F-INT-002)
      description: >
        index/total 을 서버가 준다. 화면이 "추출된 항목 수"로 분모를 보완하면 서버가 물어볼
        항목 수와 어긋날 수 있고, 어긋나면 조용히 틀린 진행률이 보인다.
        done=true 가 인터뷰 종료 판단의 유일한 근거다.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 다음 질문(없으면 done=true)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NextQuestionApiResponse'}

  /sessions/{id}/judgments:
    get:
      summary: 세션에 쌓인 항목별 판정 목록 (S-05)
      description: >
        S-03(고객 화면)과 S-05(판매자 화면)는 다른 기기·다른 탭이라 화면이 메모리에 들고
        갈 수 없다. 새로고침에도 살아남아야 한다.
        항목별 signal 은 싣지 않는다 — 게이트 판정은 /judge 의 signal 이 단독 소유한다(P1).
        grade → 색 매핑은 표시 관례이며 판정이 아니다.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 항목 ID 오름차순 판정 목록
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JudgmentsApiResponse'}
        '404':
          description: 세션 없음
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /sessions/{id}/answers:
    post:
      summary: 텍스트 응답 제출 (F-INT-003) → 항목별 판정(측정값) 반환·세션에 기록
      description: >
        text는 서버에서 PII 마스킹 후 ai-service로 나간다. 반환 Judgment는 '측정값'이며
        게이트 판정이 아니다(P1). 웹 응답은 camelCase(내부 ai-service 계약 judgment.schema.json은 snake_case).
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AnswerRequest'}
      responses:
        '200':
          description: 항목별 이해도 판정
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JudgmentApiResponse'}

  /sessions/{id}/re-explain: {post: {summary: "재설명 (F-INT-004)"}}
  /sessions/{id}/simulate:
    post:
      summary: 손실 계산 (F-SIM-001)
      description: >
        data 안의 시나리오 스키마는 F-SIM-001 소유자가 정한다(논의 중). 봉투는 전역 규약이라
        스키마 확정과 무관하게 먼저 맞춰 둔다.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: amount, in: query, required: false, schema: {type: integer, format: int64, default: 50000000}}
      responses:
        '200':
          description: 시나리오별 손익
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpaqueApiResponse'}

  /sessions/{id}/judge:
    post:
      summary: 게이트 판정 (F-GTE-001) — 세션에 쌓인 판정으로 신호등 산출
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 게이트 판정 결과
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GateApiResponse'}
  /sessions/{id}/override:
    post:
      summary: 적색 진행 요청 (F-GTE-002)
      description: 사유 30자 미만은 거부한다(400 VALIDATION_ERROR).
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OverrideRequest'}
      responses:
        '200':
          description: 오버라이드 상태
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OverrideApiResponse'}
        '400':
          description: VALIDATION_ERROR — 사유 30자 미만
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorApiResponse'}

  /sessions/{id}/override/approve:
    post:
      summary: 관리자 승인/반려 (F-GTE-002)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OverrideRequest'}
      responses:
        '200':
          description: 오버라이드 상태
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OverrideApiResponse'}

  /sessions/{id}/report:
    get:
      summary: 이해 기록 (F-GTE-004)
      description: data 안의 리포트 스키마는 F-GTE-004 소유자가 정한다(논의 중). 봉투만 확정.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 리포트 참조
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpaqueApiResponse'}

  /dashboard/heatmap:
    get:
      summary: 오해 지도 (F-DSH-001)
      description: >
        data 안의 셀 스키마는 집계 소유자가 정한다(논의 중). 봉투만 확정.
        집계는 개인 식별자를 담지 않으며 소표본(n<30)은 마스킹된다.
      responses:
        '200':
          description: 히트맵 셀
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpaqueApiResponse'}

components:
  schemas:
    # 공통 응답 봉투 — 모든 응답은 success + (data | error) 형태.
    ApiError:
      type: object
      required: [code, message, timestamp]
      properties:
        code:      {type: string, description: "에러 코드(NOT_FOUND·VALIDATION_ERROR·MALFORMED_REQUEST·ILLEGAL_STATE_TRANSITION·INTERNAL_ERROR)"}
        message:   {type: string}
        timestamp: {type: string, format: date-time}
    ErrorApiResponse:
      type: object
      required: [success, error]
      properties:
        success: {type: boolean, enum: [false]}
        data:    {type: object, nullable: true}
        error:   {$ref: '#/components/schemas/ApiError'}

    CreateSessionRequest:
      type: object
      description: 세션 생성 입력. 전부 비식별 — 성명·주민번호는 스키마에 존재하지 않는다 (P3).
      required: [productId, channel, ageBand]
      properties:
        productId:       {type: string, description: "상품 ID"}
        channel:         {type: string, enum: [FACE_TO_FACE, MOBILE, TM], description: "판매 채널(대면·모바일·TM)"}
        ageBand:
          type: string
          description: >
            연령대(비식별). 이 값은 server/src/main/resources/vulnerability_weights.yaml 이
            문자열 키로 가중을 매기는 대상이다. 목록에 없는 값을 보내면 400 이 아니라 조용히
            0점이 되고, 취약 고객이 일반 고객으로 분류된다. 그래서 enum 으로 고정한다.
            가중 대상이 아닌 값(20~40대)도 유효한 입력이므로 enum 에 포함한다.
          enum: ["20대", "30대", "40대", "50대", "60대", "70대", "80대"]
        experienceLevel:
          type: string
          nullable: true
          description: 투자 경험 수준. ageBand 와 같은 이유로 enum 고정.
          enum: ["없음", "1년미만", "3년미만", "3년이상"]
        amountBand:
          type: string
          nullable: true
          description: 가입금액대(비식별). ageBand 와 같은 이유로 enum 고정.
          enum: ["1천만원미만", "1천만원대", "3천만원대", "5천만원대", "1억원대", "3억원대이상"]
        contractRef:     {type: string, nullable: true, description: "계약건 참조번호(비식별)"}
        surveyResult:    {type: object, nullable: true, additionalProperties: true, description: "적합성 설문 결과"}
    # data 의 모양을 소유자가 아직 정하지 않은 응답용 봉투. 봉투만 계약하고 안은 열어 둔다.
    # 프론트는 success 로 분기하고 data 는 해당 화면이 아는 형태로 읽는다.
    OpaqueApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {type: object, additionalProperties: true}
        error:   {type: object, nullable: true}

    ProductSummary:
      type: object
      required: [productId, name, productType, status]
      properties:
        productId:   {type: string}
        name:        {type: string}
        productType: {type: string, enum: [ELS, VARIABLE_INSURANCE]}
        status:      {type: string, enum: [parsed, parse_failed]}
    ProductListApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {type: array, items: {$ref: '#/components/schemas/ProductSummary'}}
        error:   {type: object, nullable: true}

    UploadResponse:
      type: object
      required: [productId, status]
      properties:
        productId: {type: string}
        status:    {type: string, enum: [parsed, parse_failed]}
    UploadApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/UploadResponse'}
        error:   {type: object, nullable: true}

    RiskItemsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 항목 스키마는 contracts/risk_item.schema.json (snake_case 계약의 camelCase 웹 표현)
          items: {type: object, additionalProperties: true}
    RiskItemsApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/RiskItemsResponse'}
        error:   {type: object, nullable: true}

    OverrideRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 30, description: "적색 진행 사유. 30자 미만 거부"}
    OverrideResponse:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [PENDING_APPROVAL, APPROVED, REJECTED]}
    OverrideApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/OverrideResponse'}
        error:   {type: object, nullable: true}

    NextQuestion:
      type: object
      required: [index, total, done]
      properties:
        itemId:   {type: string, nullable: true, description: "done=true 면 null"}
        question: {type: string, nullable: true, description: "done=true 면 null"}
        index:    {type: integer, description: "1-based. done=true 면 total 과 같다"}
        total:    {type: integer, description: "서버가 물어볼 항목 수. 추출 항목 수와 다를 수 있다"}
        done:     {type: boolean, description: "더 물을 항목이 없다. 인터뷰 종료 판단의 유일한 근거"}
    NextQuestionApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/NextQuestion'}
        error:   {type: object, nullable: true}

    JudgmentsResponse:
      type: object
      required: [sessionId, state, judgments]
      properties:
        sessionId: {type: string}
        state:     {type: string, enum: [CREATED, IN_PROGRESS, RE_EXPLAIN, RE_VERIFY, JUDGED, CLOSED, ABORTED]}
        judgments:
          type: array
          description: 항목 ID 오름차순. 항목별 최신 판정만 담긴다(재검증 시 덮어씀)
          items: {$ref: '#/components/schemas/JudgmentView'}
    JudgmentsApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/JudgmentsResponse'}
        error:   {type: object, nullable: true}

    SessionResponse:
      type: object
      required: [sessionId, state, productId]
      properties:
        sessionId:   {type: string}
        state:       {type: string, enum: [CREATED, IN_PROGRESS, RE_EXPLAIN, RE_VERIFY, JUDGED, CLOSED, ABORTED]}
        productId:   {type: string}
        contractRef: {type: string, nullable: true}
    SessionApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/SessionResponse'}
        error:   {type: object, nullable: true}

    AnswerRequest:
      type: object
      description: F-INT-003 텍스트 응답. text는 서버에서 PII 마스킹 후 ai-service로.
      required: [itemId, text]
      properties:
        itemId:    {type: string}
        text:      {type: string, description: "고객 발화(서버에서 마스킹)"}
        inputMeta: {type: object, nullable: true, additionalProperties: true, description: "붙여넣기·지연·수정빈도 등(F-INT-003)"}

    # 웹 응답용 Judgment(camelCase). 내부 ai-service 계약은 judgment.schema.json(snake_case).
    JudgmentView:
      type: object
      required: [itemId, grade, confidence, evidence, reason]
      properties:
        itemId:     {type: string}
        grade:      {type: string, enum: [U1, U2, U3, U4]}
        confidence: {type: number, minimum: 0, maximum: 1}
        evidence:
          type: object
          required: [utteranceQuote, rubricClause]
          properties:
            utteranceQuote: {type: string}
            rubricClause:   {type: string}
        reason:            {type: string}
        misconceptionType: {type: string, nullable: true}
    JudgmentApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/JudgmentView'}
        error:   {type: object, nullable: true}

    GateResult:
      type: object
      required: [signal, ruleTrace]
      properties:
        signal:    {type: string, enum: [GREEN, YELLOW, RED]}
        ruleTrace: {type: array, items: {type: string}, description: "발화한 룰 ID(예: R-01)"}
    GateApiResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:    {$ref: '#/components/schemas/GateResult'}
        error:   {type: object, nullable: true}
