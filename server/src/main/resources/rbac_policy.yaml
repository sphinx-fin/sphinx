# F-CMN-002 접근 정책 (선언적, 버전 관리). 소유: 정세현 — 정책 변경 = PR 필수(감사 대상)
#
# 이 파일이 역할·권한·데이터 범위의 유일한 근거다. Java 상수로 중복 정의하지 않는다.
# 컨트롤러의 @PreAuthorize(강희진)는 여기 정의된 action 이름만 참조한다.
# role 이름 변경은 security/Role.java와 동시에 — 강희진 멘션 필수 (계약 소유: 정세현).
#
# 역이용 방지(기획서 7-4)는 두 층으로 구현된다:
#   ① 역할 부재 — 본부 영업·마케팅에 대응하는 역할이 존재하지 않는다 (명세서 0.4, ADR-001)
#   ② 범위 분리 — 역할이 있어도 집계 데이터에 닿는 범위가 제한된다 (아래 scope)
# ①만으로는 부족하다. SELLER 권한으로 대시보드가 열리면 같은 구멍이 난다.
version: 8

roles: [CUST, SELLER, MGR, COMPL, ADMIN]

# 의도적으로 만들지 않은 역할. 추가 요청이 오면 이 항목을 근거로 거절하고,
# 그래도 필요하면 Role.java 수정 → PR → ADR-001·기획서 7-4 재검토 순서를 밟는다.
absent_by_design:
  - name: 본부 영업·마케팅
    reason: >
      집계된 이해도 데이터는 "설득하기 쉬운 고객" 목록이 될 수 있다. 이를 소비할 수 있는
      유일한 주체이므로 역할 자체를 만들지 않는다 (ADR-001, 기획서 7-4).

# 데이터 범위. action·역할 조합마다 어디까지 보이는지 고정한다 — 이 경계가 7-4의 실물이다.
scopes:
  # ❗**본인이 진행한** 세션이다. 괄호로 "또는 본인이 당사자인" 을 적어 뒀었는데 그 두 번째
  #    뜻은 구현돼 있지 않다 — 대조하는 값이 `Session.sellerId` 하나뿐이고 세션에 고객을
  #    가리키는 필드가 없다(이슈 #166). 문면이 하지 못하는 것을 약속하고 있었다.
  own_session: 본인이 **진행한** 개별 세션에 한정 (대조 값은 sellerId 다. 이슈 #166)
  branch:      소속 지점에 한정
  org:         전체

# ADR-001 데이터 범위 표
#   역할     | 개별 세션        | 집계(오해 지도·선행지표)
#   SELLER  | 본인 진행분만     | 접근 불가
#   MGR     | 자기 지점 범위    | 자기 지점 범위
#   COMPL   | 전체            | 전체
#   CUST    | (도달 불가 #166) | 접근 불가
#   ADMIN   | 접근 불가        | 접근 불가

# action → 허용 그랜트 목록. 역할별로 범위가 다르므로 그랜트를 나열한다.
# scope 없는 그랜트는 만들지 않는다. 미정의 action은 기본 거부.
permissions:
  session:create:
    - { roles: [SELLER], scope: own_session }
  # 읽기와 진행을 가른다 (이슈 #124).
  #
  # `session:interview` 하나가 GET /{sid} · questions/next · re-explain · abort 넷을 덮고
  # 있었다. 그래서 "승인자가 승인 대상을 못 읽는다" 를 고치려고 MGR 그랜트를 여기 붙이면
  # **읽기만 열리는 게 아니라 면담 진행과 중단까지 열린다.** MGR 이 지점 내 적색 세션을
  # 중단하거나 질문을 다시 돌릴 수 있게 되는데, 그건 운영 압박이 들어왔을 때 정확히
  # 문제가 되는 권한이다(기획 7-4 · ADR-001). 승인하려고 읽어야 하는 것과 세션을 몰 수
  # 있는 것은 다르다.
  #
  # 그래서 action 을 가른다. GET 은 `session:read`, 나머지 셋은 `session:interview` 로
  # 남는다. 범위 삼단(SELLER own_session / MGR branch / COMPL org)은 `session:judgment:read`
  # 와 같은 모양이다 — 같은 성격의 읽기이므로 새 모양을 만들지 않는다.
  session:read:                                      # GET /sessions/{sid} — 조회만
    - { roles: [SELLER], scope: own_session }
    - { roles: [MGR],    scope: branch }
    - { roles: [COMPL],  scope: org }
  session:interview:                                 # 면담을 **진행**한다 — 질문·재설명·중단
    - { roles: [SELLER], scope: own_session }
  # ❗**CUST 그랜트는 현재 도달 불가다** (이슈 #166). 지우지 않는 이유는 아래에 적는다.
  #
  # `own_session` 은 `Target.ownerId` 와 행위자 id 를 비교하는데, `AccessGuard.targetOf` 가
  # 거기 넣는 값은 언제나 `Session.sellerId` 다. 세션에 고객을 가리키는 필드가 없으므로
  # (`contractRef` 는 비식별 참조번호지 행위자가 아니다) **어떤 고객도 이 비교를 통과할 수
  # 없다.** enforce=true 로 실측했다 — CUST 는 403 이고, 역할이 CUST 여도 이름이 sellerId 와
  # 같으면 통과한다. 즉 막는 것은 역할이 아니라 이름 대조다.
  #
  # 그리고 오늘 대면 채널에서는 **인증 주체가 SELLER 하나**다 — S-02 에서 세션을 만든 판매자가
  # 같은 브라우저로 S-03 을 열어 단말을 넘겨준다. 그러니 지금 이 그랜트가 도달 불가인 것이
  # 기능을 막고 있지도 않다.
  #
  # **그래도 지운다는 선택은 하지 않았다.** `MOBILE` 채널은 정의상 고객이 자기 기기로 들어오고,
  # 그때 같은 문제가 그대로 돌아온다. 역할이 있는 것과 그 역할에 그랜트가 있는 것은 다르고
  # (ADR-001 과 같은 결), 없앴다가 다시 만드는 것은 코드에 남지 않는다. 대신 **도달 불가라는
  # 사실을 여기 적고 테스트로 붙들어 둔다** — `AccessPolicyTest.CustIsUnreachable` 이 이 상태를
  # 고정하므로, 누가 #166 을 고치면 그 테스트가 먼저 깨져서 이 주석을 같이 고치게 된다.
  session:answer:                                    # F-INT-003 고객 응답 입력 (S-03)
    - { roles: [CUST, SELLER], scope: own_session }  # CUST 는 도달 불가 (#166)
  session:judge:
    - { roles: [SELLER], scope: own_session }
  session:judgment:read:                             # S-05 판정 결과
    - { roles: [SELLER], scope: own_session }
    - { roles: [MGR],    scope: branch }
    - { roles: [COMPL],  scope: org }

  # 손실 시뮬레이터 (F-SIM-001 · S-04) — 이슈 #214. 정책 밖에 있던 마지막 세션 경로다.
  #
  # ── 왜 `session:read` 삼단이 아니라 SELLER 하나인가 ─────────────────────────
  #
  # 읽기(`session:read`·`session:judgment:read`)에 MGR·COMPL 이 붙는 이유는 **그 세션에서
  # 무슨 일이 있었는지를 감독·점검하기 위해서**다. 시뮬레이션은 그 성격이 아니다 —
  # 결과가 세션 기록의 일부가 아니라 (금액, 상품 조건, 지수 스냅샷) 의 순수 함수이고(P2),
  # 남의 세션에 대해 돌려도 **그 세션에 관해 알게 되는 것이 없다.** 감독에 필요한 것은
  # `report:read` 가 이미 준다.
  #
  # 그리고 이건 POST 다. 고객 앞 화면을 띄우는 **면담 진행 행위**라 `session:interview` 와
  # 같은 결이고, `session:read` 를 interview 에서 갈라낸 이유(이슈 #124 — 읽으려고 준
  # 권한이 세션을 몰 수 있는 권한까지 열면 안 된다)가 여기도 그대로 적용된다.
  #
  # 넓히는 것은 나중에 PR 로 할 수 있고 그 PR 이 기록에 남는다. 반대 방향은 그렇지 않다.
  # (ADR-001 이 역할을 아예 안 만드는 것과 같은 결)
  #
  # CUST 그랜트는 두지 않는다. 대면 채널에서 S-04 를 돌리는 것은 판매자이고(`#166`·`#171`),
  # `session:answer` 가 CUST 를 가진 이유 — 고객이 직접 입력하는 화면 — 가 여기엔 없다.
  # MOBILE 에서 누가 행위자인지는 `#166` 이 정할 문제지 이 action 이 앞서갈 자리가 아니다.
  session:simulate:                                  # POST /sessions/{sid}/simulate (S-04)
    - { roles: [SELLER], scope: own_session }

  report:read:                                       # F-GTE-004 이해 기록 리포트 조회
    - { roles: [SELLER], scope: own_session }
    - { roles: [MGR],    scope: branch }
    - { roles: [COMPL],  scope: org }
  # 발행(교부)은 조회와 다른 action 이다. 이유가 둘이다.
  #
  # ① 감사에서 갈려야 한다. AuditInterceptor 가 @PreAuthorize 의 action 이름으로 기록하므로,
  #    조회와 발행이 같은 이름이면 로그에서 "읽었다"와 "교부했다"가 구별되지 않는다. 분쟁
  #    시점에 답해야 하는 것은 "언제 누가 교부했는가"이지 "누가 열어봤는가"가 아니다.
  # ② MGR·COMPL 을 빼는 것이 요지다. 그쪽은 감독·점검을 위해 남의 세션을 *읽는* 역할이고
  #    (branch·org 범위), 교부는 그 세션을 진행한 창구 직원이 한다. 조회와 같은 action 이면
  #    COMPL 이 org 전체 세션에 대해 발행할 수 있다 — 권한을 안 주는 것과 줄 수 있는 대상이
  #    없는 것은 다르다(ADR-001 과 같은 결).
  report:issue:                                      # F-GTE-004 발행(교부) — PR #94 리뷰
    - { roles: [SELLER], scope: own_session }
  report:summary:read:                               # 고객 교부용 요약
    - { roles: [CUST], scope: own_session }          # 도달 불가 (#166). 엔드포인트도 아직 없다

  override:request:
    - { roles: [SELLER], scope: own_session }
  override:approve:                                  # 요청자 ≠ 승인자. 한계는 ADR-002
    - { roles: [MGR], scope: branch }

  audit:read:
    - { roles: [COMPL], scope: org }
  audit:verify:                                      # 해시 체인 재계산 검증
    - { roles: [COMPL], scope: org }

  # 집계 — SELLER·CUST·ADMIN 부재가 핵심이다. 여기에 역할을 추가하면 역이용 경로가 열린다.
  # MGR은 자기 지점 범위만 (ADR-001). 소표본 마스킹(n<30)은 집계 파이프라인이 적용한다.
  aggregate:heatmap:read:                            # 오해 지도 (F-DSH-001)
    - { roles: [COMPL], scope: org }
    - { roles: [MGR],   scope: branch }
  aggregate:indicator:read:                          # 선행지표 (F-DSH-002)
    - { roles: [COMPL], scope: org }
    - { roles: [MGR],   scope: branch }

  # 상품 카탈로그 — 읽기와 등록·추출을 가른다 (이슈 #69, 결정 10.36).
  #
  # `POST /products/documents`(문서 업로드)·`POST /products/{id}/extract`(위험항목 생성)가
  # 미인증으로 열려 있던 것을 닫는다. 읽기 둘과 성격이 다르다 — **`extract` 는 게이트가 물을
  # 항목을 만든다.** 항목이 곧 질문이고 판정의 분모이므로, 항목을 줄이면 게이트가 조용히
  # 느슨해진다. 기획 7-4 가 막으려는 경로 중 가장 짧은 것이고, 역할 부재 원칙(ADR-001)이
  # 지키려는 것과 같은 자리다 — 판매 라인이 자기가 답해야 할 질문의 목록을 편집할 수 있으면
  # 안 된다.
  #
  # 그래서 등록·추출을 **판매 라인에서 떼어놓는다.** SELLER·MGR 은 읽기만 한다.
  product:read:                                      # 상품 목록·위험항목 조회 (S-02)
    - { roles: [SELLER, MGR, COMPL, ADMIN], scope: org }
  product:manage:                                    # 문서 업로드 · 위험항목 추출
    - { roles: [ADMIN], scope: org }

  # 불공정영업 신호 (F-GTE-003) — 판매자 화면 비노출이 요건이므로 SELLER·MGR 부재
  signal:unfair:read:
    - { roles: [COMPL], scope: org }

  # 시스템 운영 — 데이터가 아니라 계정·설정만. 여기에 데이터 action을 추가하면
  # ADMIN이 ADR-001의 우회 경로가 된다.
  #
  # `product:manage`(위 상품 절)는 이 금지에 걸리지 않는다. ADR-001 데이터 범위 표가 ADMIN
  # 에게 닫아 둔 것은 **개별 세션과 집계** — 고객이 무엇을 오해했는가 — 이고, 상품 카탈로그는
  # 그 둘 중 어느 것도 아니다. 상품설명서 문면은 고객 데이터가 아니고 판매자별로 집계되지도
  # 않는다. 반대로 그것을 SELLER 쪽에 두면 판매 라인이 자기 질문 목록을 편집하게 되므로,
  # ADMIN 에 두는 것이 ADR-001 이 지키려는 것과 같은 방향이다. **데이터 action 을 ADMIN 에
  # 붙이지 않는다는 규칙은 그대로다** — 세션·집계 action 은 여전히 여기 오지 않는다.
  admin:role:assign:
    - { roles: [ADMIN], scope: org }

# AuditInterceptor가 기록할 대상. 여기 없는 요청은 로그를 남기지 않는다.
audited:
  - override:request
  - override:approve
  - report:read
  - report:issue
  - audit:read
  - audit:verify
  - aggregate:heatmap:read
  - aggregate:indicator:read
  - signal:unfair:read
  - admin:role:assign
  # 상품 등록·추출은 게이트의 분모를 바꾼다 — 누가 언제 했는지가 남아야 한다 (결정 10.36).
  - product:manage
  # ❗S-04 를 **띄운 사실**이 남아야 한다 (`#76` · 기획 7-2 — "누가 무엇을 봤는지 남는다").
  # 비audited 인 `session:interview` 를 재사용하면 그 요건이 안 채워진다(이슈 #214).
  #
  # 여기 넣으면 로그가 는다 — S-04 가 range 슬라이더 + 150ms 디바운스라 금액을 움직일 때마다
  # POST 가 나간다(`web/src/pages/S04_Simulator.tsx`). **그래도 줄이는 자리는 여기가 아니다.**
  # 감사 로그는 append-only 이고 일어난 일을 그대로 적는다 — 같은 action 을 접어서 적으면
  # 로그가 사실과 달라지고, 그건 `audit:verify` 가 지키려는 것을 정면으로 깬다.
  # 호출 횟수 자체를 줄이는 것은 화면 몫이다(이슈로 뗀다).
  - session:simulate
