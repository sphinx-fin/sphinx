# F-GTE-001 게이트 룰셋 (선언적, 버전 관리). 소유: 강희진 — 룰 변경 = PR 필수(감사 대상)
version: 1
rules:
  - id: R-01
    if: "anyGrade == 'U4'"
    then: RED
  - id: R-02
    if: "suitabilityMismatch == true"
    then: RED
  # 재검증 상한 도달·실패 → RED. 임계값은 application.yml sphinx.scoring.max-reverify와
  # 같은 논리값이어야 한다(상한만큼 실패하면 게이트가 잡는다). 어긋나면 ReverifyThresholdSyncTest가
  # 실패시킨다 — 한쪽만 바꾸면 상한과 게이트가 따로 논다.
  - id: R-03
    if: "reverifyFailed >= 2"
    then: RED
  - id: R-04
    if: "anyGrade in ['U2','U3']"
    then: YELLOW
  # 신뢰도 기반 황색 강등 — 이해했다지만 채점 신뢰도가 낮으면 통과시키지 않는다.
  # U4 예외는 순서로 보장(R-01이 U4를 이미 RED로 잡음). 임계값의 단일 출처는 여기다.
  - id: R-05
    if: "anyConfidenceBelow 0.7"
    then: YELLOW
  - id: R-06
    if: "allGrade == 'U1'"
    then: GREEN
