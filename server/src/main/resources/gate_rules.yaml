# F-GTE-001 게이트 룰셋 (선언적, 버전 관리). 소유: 강희진 — 룰 변경 = PR 필수(감사 대상)
# 룰이 늘거나 순서가 바뀌면 판정이 바뀐다 — 번호를 올린다(감사 기준).
# 2: R-02b(suitabilityUnknown → YELLOW) 추가 (결정 10.9)
version: 2
rules:
  - id: R-01
    if: "anyGrade == 'U4'"
    then: RED
  - id: R-02
    if: "suitabilityMismatch == true"
    then: RED
  # 재검증 상한 도달·실패 → RED.
  #
  # ❗이 N 이 **재검증 상한의 유일한 출처**다 (이슈 #66 · ADR-005). SessionService 가
  #   GateEngine.reverifyThreshold() 로 여기서 읽으므로, 이 숫자를 고치면 재설명 상한도
  #   같이 움직인다 — 다른 데를 손댈 필요가 없고, 손대면 안 된다.
  #
  #   전에는 application.yml 에도 같은 숫자가 있었고 대조 테스트로 묶어 뒀는데, 그건
  #   **어긋난 뒤에 잡는 것**이었다. 고칠 자리가 둘이면 언젠가 한 곳만 바뀐다.
  - id: R-03
    if: "reverifyFailed >= 2"
    then: RED
  - id: R-04
    if: "anyGrade in ['U2','U3']"
    then: YELLOW
  # 적합성 모순을 **판정하지 못한** 경우 → 황색 (결정 10.9).
  # RED 가 아닌 이유: 모순이 확인된 게 아니라 확인하지 못한 것이다. 판매 보류가 아니라
  # 재확인이 비례하고, 황색이면 F-INT-004 루프가 설문을 다시 받는다.
  # GREEN 이 아닌 이유: 계약(suitability_mismatch.schema.json)이 스스로 경고한 지점이다 —
  # status=insufficient_input 이면 mismatch 는 항상 false 인데, 그 false 를 적합으로 읽으면
  # 판정 실패가 통과가 된다. R-02 앞이 아니라 뒤에 두는 것은 모순이 확인된 경우가 먼저
  # 잡혀야 하기 때문이다(확인된 RED > 확인 못 한 YELLOW).
  # ⚠️ ID 는 도입 순서이고 **우선순위는 파일 순서다.** R-02 옆으로 옮기면 판정이 바뀐다 —
  #    suitabilityUnknown 이면서 재검증 상한에 도달한 세션이 R-03(RED) 대신 여기서 YELLOW 로
  #    잡힌다. 확정 RED 가 가려진다.
  - id: R-02b
    if: "suitabilityUnknown == true"
    then: YELLOW
  # 신뢰도 기반 황색 강등 — 이해했다지만 채점 신뢰도가 낮으면 통과시키지 않는다.
  # U4 예외는 순서로 보장(R-01이 U4를 이미 RED로 잡음). 임계값의 단일 출처는 여기다.
  - id: R-05
    if: "anyConfidenceBelow 0.7"
    then: YELLOW
  - id: R-06
    if: "allGrade == 'U1'"
    then: GREEN
