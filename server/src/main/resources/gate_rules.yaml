# F-GTE-001 게이트 룰셋 (선언적, 버전 관리). 소유: 강희진 — 룰 변경 = PR 필수(감사 대상)
# 룰이 늘거나 순서가 바뀌면 판정이 바뀐다 — 번호를 올린다(감사 기준).
# 2: R-02b(suitabilityUnknown → YELLOW) 추가 (결정 10.9)
version: 2
rules:
  # ❗**측정 자체가 안 된 항목이 있으면 판정하지 않는다** (이슈 #280 ②).
  #
  # ❗**황색 룰들보다 앞이어야 한다.** R-01 앞인 것은 덤이다 — 둘 다 RED 라 순서를 바꿔도
  # 답이 같다(trace 는 이긴 신호와 같은 룰을 전부 담으므로 둘 다 남는다). 실제로 무는 곳은
  # **R-04·R-02b·R-05 앞**이다: 못 잰 항목이 있으면서 U2 도 있는 세션이 뒤에 두면 R-04 가
  # 먼저 물어 **YELLOW** 가 되고, 그러면 R-00 은 신호가 달라 trace 에도 안 남는다.
  # 재설명 루프로 보내는 것과 판정을 세우는 것은 다르다 — 못 잰 것은 재설명으로 안 풀린다.
  #
  # 이 룰이 없던 동안 **13항목 중 12개 U1 + 1개 채점 실패가 GREEN 이었다.** judgments 에
  # 12건이 들어오고 전부 U1 이라 R-06 이 물었다. 0건 가드는 SessionService 에 있었지만
  # 부분은 아무도 안 막았고, 기록에 남는 것이 signal·ruleTrace 뿐이라 조용했다.
  #
  # `unmeasured` 는 **질문을 보냈는데 판정이 없는 항목 수**다. "몇 항목이어야 하는가"(추출
  # 결과)가 아직 목이라 그것을 안 쓴다 — 물어본 것조차 못 잰 상태가 제일 나쁘다.
  - id: R-00
    if: "unmeasured > 0"
    then: RED
  - id: R-01
    if: "anyGrade == 'U4'"
    then: RED
  - id: R-02
    if: "suitabilityMismatch == true"
    then: RED
  # 재검증 상한 도달·실패 → RED.
  #
  # ❗이 N 이 **재검증 상한의 유일한 출처**다 (이슈 #66 · ADR-005). SessionService 가
  #   GateEngine.reverifyThreshold() 로 여기서 읽으므로, 이 숫자를 고치면 재설명 상한도
  #   같이 움직인다 — 다른 데를 손댈 필요가 없고, 손대면 안 된다.
  #
  #   전에는 application.yml 에도 같은 숫자가 있었고 대조 테스트로 묶어 뒀는데, 그건
  #   **어긋난 뒤에 잡는 것**이었다. 고칠 자리가 둘이면 언젠가 한 곳만 바뀐다.
  - id: R-03
    if: "reverifyFailed >= 2"
    then: RED
  - id: R-04
    if: "anyGrade in ['U2','U3']"
    then: YELLOW
  # 적합성 모순을 **판정하지 못한** 경우 → 황색 (결정 10.9).
  # RED 가 아닌 이유: 모순이 확인된 게 아니라 확인하지 못한 것이다. 판매 보류가 아니라
  # 재확인이 비례하고, 황색이면 F-INT-004 루프가 설문을 다시 받는다.
  # GREEN 이 아닌 이유: 계약(suitability_mismatch.schema.json)이 스스로 경고한 지점이다 —
  # status=insufficient_input 이면 mismatch 는 항상 false 인데, 그 false 를 적합으로 읽으면
  # 판정 실패가 통과가 된다. R-02 앞이 아니라 뒤에 두는 것은 모순이 확인된 경우가 먼저
  # 잡혀야 하기 때문이다(확인된 RED > 확인 못 한 YELLOW).
  # ⚠️ ID 는 도입 순서이고 **우선순위는 파일 순서다.** R-02 옆으로 옮기면 판정이 바뀐다 —
  #    suitabilityUnknown 이면서 재검증 상한에 도달한 세션이 R-03(RED) 대신 여기서 YELLOW 로
  #    잡힌다. 확정 RED 가 가려진다.
  - id: R-02b
    if: "suitabilityUnknown == true"
    then: YELLOW
  # 신뢰도 기반 황색 강등. U4 예외는 순서로 보장(R-01이 U4를 이미 RED로 잡음).
  # 임계값의 단일 출처는 여기다.
  #
  # ❗**오늘 이 룰을 발동시키는 것은 모델이 아니라 복창 탐지다** (이슈 #268).
  #
  # ADR-005 「관측된 한계」가 *"프롬프트 v2 에서 confidence 정의를 바꿔 재측정하고, 그때 이
  # 임계값을 다시 본다"* 고 약속했다. v2 가 들어갔고(PR #114) 재측정이 끝났다 — dev set 24건을
  # 두 모델로 채점한 결과다.
  #
  #     gemini-3.5-flash-lite   모델이 부른 고유값 [0.7, 0.9, 1.0]   < 0.7  0건
  #     gpt-5-mini              모델이 부른 고유값 [0.9, 1.0]        < 0.7  0건
  #
  # v2 가 confidence 를 등급과 **직교하는 축**(같은 발화를 다른 채점자가 봐도 같은 등급인가)에
  # 놓았는데도 **모델 자기보고로는 여전히 한 번도 안 걸린다.** v2 가 기대한 *"U1 인데 낮은
  # 경우"* 가 24건에서 관측되지 않았다. 값의 가짓수가 둘·셋뿐인 것도 모델이 확신을 **재는**
  # 것이 아니라 상투값을 **고르는** 것에 가깝다는 뜻이다.
  #
  # 실제로 걸리는 전건은 우리 후처리다.
  #
  #     PARROTED-RUBRIC-CLAUSE   모델 raw 1.0  →  cap_confidence_if_echoed  →  0.3
  #
  # 그래서 임계값을 올리지 않는다. 최빈값이 1.0 이라 0.9 로 올려도 거의 안 걸리고, 올리면
  # **모델이 아무 값이나 부를 때 게이트가 그걸 따라 움직인다** — P1(AI는 측정, 룰은 결정)이
  # 막으려는 방향이다. 지금 구조는 **우리가 계산한 값**에만 반응하고 그게 맞다.
  #
  # ❗**0.7 은 이제 복창 캡(0.3)이 통과하도록 잡는 숫자다.** 두 값이 서로를 모르고 있어서
  # `EchoCapBelowR05Test` 가 묶어 둔다 — 캡을 0.7 이상으로 올리면 R-05 는 **아무것도 안 잡는
  # 상태가 되는데 테스트도 게이트도 아무 말을 안 한다.**
  #
  # 남는 사각: 복창이 아닌 형태로 얕게 이해한 답변은 R-04(U2·U3)가 받고, R-05 의 두 번째 겹은
  # 지금 비어 있다. 계산된 신호를 하나 더 만드는 것은 3주차 이후다(#268 (d)).
  - id: R-05
    if: "anyConfidenceBelow 0.7"
    then: YELLOW
  - id: R-06
    if: "allGrade == 'U1'"
    then: GREEN
