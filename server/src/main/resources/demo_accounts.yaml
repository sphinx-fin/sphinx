# F-CMN-002 역할별 계정 명부. 소유: 정세현 — 명부 변경 = PR 필수(감사 대상)
#
# 결정 10.5. 지금까지 basic auth 단일 계정이라 **감사 로그의 "누가" 가 한 명**이었다.
# SELLER 가 한 것과 COMPL 이 한 것이 같은 사람으로 남고, ADR-001 시연(SELLER 로 집계 접근
# → 차단)이 성립하지 않는다. 9/3 리허설에 직접 걸린다.
#
# ── 이 파일이 무엇이고 무엇이 아닌가 ───────────────────────────────────────────
#
# **비밀번호는 여기 없다.** 명부는 "누가 있고 무엇인가" 이고 자격증명은 환경변수다.
# 레포에 비밀번호가 들어가면 그 값이 곧 배포 자격증명이 되고, 파일을 지워도 git 이력에 남는다.
#
# **역할·범위 규칙도 여기 없다.** 그건 rbac_policy.yaml 이 유일한 근거다. 이 파일은
# "이 계정의 역할이 무엇인가" 까지만 말하고, 그 역할이 무엇을 할 수 있는지는 말하지 않는다.
# 두 파일이 같은 것을 말하기 시작하면 정책이 두 벌이 된다.
#
# ── branchId 가 계정에 실려야 하는 이유 ────────────────────────────────────────
#
# `scope: branch` 는 **행위자의 지점**과 대상 세션의 지점을 비교한다. 그 값을 요청에서
# 받으면 MGR 이 자기 지점을 바꿔 적을 수 있고, 그러면 지점 제한이 견제가 아니라 자기 신고가
# 된다(`CurrentActor` 가 진행 주체를 본문에서 안 받는 것과 같은 이유).
#
# 지금은 `CurrentActor.branchId()` 가 null 을 돌려주므로 `AccessPolicy` 가 MGR 요청을 전부
# **"판단할 수 없다"로 거부**한다. 안전한 방향이지만 "막고 있다" 와 구별되지 않는다.
version: 1

# 지점. 세션의 `branchId` 와 같은 값이어야 비교가 성립한다.
branches:
  BR-001: 강남지점
  BR-002: 판교지점

# 계정. actorId 는 감사 로그의 행위자 값과 같다.
#
# ❗**이 명부는 데모 시나리오가 성립하도록 짜여 있다.** 계정을 지우기 전에
# `DemoAccountsTest` 가 무엇을 고정하는지 본다 — 네 시연이 각각 특정 계정 쌍에 의존한다.
accounts:
  # 같은 지점의 SELLER 둘. **한 명으로는 own_session 이 시연되지 않는다** —
  # 자기 세션만 있으면 "막혔다"를 보여줄 대상이 없다.
  - { id: seller-01, role: SELLER, branch: BR-001, name: 김창구 }
  - { id: seller-02, role: SELLER, branch: BR-001, name: 이창구 }

  # 다른 지점의 SELLER. MGR 의 branch 범위가 **실제로 좁히는지**를 보려면 범위 밖 세션을
  # 만들 사람이 있어야 한다. 같은 지점만 있으면 branch 와 org 가 구별되지 않는다.
  - { id: seller-03, role: SELLER, branch: BR-002, name: 박창구 }

  # 지점 관리자 — BR-001 만 본다. 오버라이드 승인자이기도 하다(요청자 ≠ 승인자, ADR-002).
  - { id: mgr-01, role: MGR, branch: BR-001, name: 최지점장 }

  # 준법감시 — org 범위. 지점이 없다. **지점을 주면 안 된다** — `scope: org` 는 지점을
  # 보지 않으므로 값이 있어도 무의미하고, 있으면 다음 사람이 "COMPL 도 지점이 있으니
  # branch 로 좁혀도 되겠다" 고 읽는다.
  - { id: compl-01, role: COMPL, name: 정준법 }

  # 시스템 관리자 — 계정·설정과 상품 등록(product:manage). 세션·집계는 안 읽는다(ADR-001).
  - { id: admin-01, role: ADMIN, name: 한관리 }

  # 고객 — ❗**현재 도달 경로가 없다. 데모에서 이 계정으로 로그인하지 않는다** (이슈 #166).
  #
  # 전에는 *"본인 세션의 응답(S-03)과 교부용 요약뿐"* 이라고 적혀 있었는데 **둘 다 안 된다.**
  # `rbac_policy.yaml` 이 CUST 에게 `session:answer`·`report:summary:read` 그랜트를 주지만,
  # `own_session` 이 대조하는 값이 세션에 없다 — `AccessGuard.targetOf` 가 만드는 Target 의
  # ownerId 는 **언제나 sellerId** 이므로 CUST 는 어느 세션에서도 통과하지 못한다.
  # 실측: `GET /sessions/{sid}` · `POST /answers` · `GET /report` 셋 다 403.
  #
  # ❗**잠금 모드에서는 주석이 아니라 실물이 문제다.** `#213` 으로 이 명부의 모든 계정이 배포
  # 인증에 실리므로 **이 계정으로 로그인이 되고, 그러면 무엇을 눌러도 403** 이다. 그게 시연
  # 항목인 정상 차단(SELLER→집계 · seller-02→남의 세션)과 화면에서 구별되지 않는다.
  #
  # **alpha 는 개방 모드라 여기 해당하지 않는다**(결정 10.57 · `deploy.yml:73-79` 가
  # `demo_open=1` 을 alpha 에만 준다). 개방 모드에서는 `auth_basic` 이 꺼지고
  # (`$sphinx_auth_realm = off`) nginx 가 경로별로 seller-01 · compl-01 · mgr-01 중 하나를
  # `Authorization` 에 **주입한다** — 클라이언트가 보낸 값을 덮어쓰므로 `cust-01` 로는
  # 닿을 경로 자체가 없다. 로그인 창도 안 뜬다.
  #
  # 그러니 위 경고가 실제로 걸리는 곳은 **prod 와 손으로 띄우는 compose** 다.
  # (`#260` 리뷰 — 오준서가 개방 모드를 짚었다.)
  #
  # 계정을 지우지 않는 이유는 그랜트를 안 지우는 이유와 같다(ADR-001 과 같은 결) — 역할이
  # 있는 것과 도달 경로가 있는 것은 다르고, 지우면 `MOBILE`(2순위)이 붙는 날 *"왜 없었나"* 가
  # 코드에서 사라진다. 도달 경로를 여는 것은 "채널별 인증 주체" 결정이다(#166 · A안).
  - { id: cust-01, role: CUST, name: 고객A }

# ── 데모에서 보여야 하는 것 (기획 7-4) ────────────────────────────────────────
#
# 이 명부가 없으면 아래 넷이 전부 "계정이 하나라서" 로 뭉개진다. `DemoAccountsTest` 가
# 각 시연에 필요한 계정이 실제로 명부에 있는지 대조한다.
#
#   1. SELLER 로 집계 → 차단          seller-01 · aggregate:heatmap:read
#   2. 남의 세션 → 차단               seller-02 가 seller-01 의 세션
#   3. MGR 은 자기 지점만              mgr-01(BR-001) 이 seller-03(BR-002) 의 세션
#   4. COMPL 은 전체                   compl-01
