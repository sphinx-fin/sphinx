server:
  port: 8000

spring:
  datasource:
    url: jdbc:h2:mem:sphinx;DB_CLOSE_DELAY=-1   # MVP: 인메모리 H2 → 영속 필요 시 jdbc:h2:file:./data/sphinx
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update                          # MVP: 엔티티 기준 스키마 자동 생성 → 운영은 마이그레이션 도구로 교체
    open-in-view: false                         # OSIV 비활성(지연로딩을 뷰까지 끌지 않음)
    properties:
      hibernate:
        format_sql: true
  # ❗**기본 프로파일에서는 끈다.** flyway-core 가 클래스패스에 있으면 Spring Boot 가
  # 자동으로 켜는데, `db/migration/V1__init.sql` 은 **MySQL 문법**이라(enum·bit(1)·
  # ENGINE=InnoDB) H2 에서 파싱부터 실패한다. runtimeOnly 는 테스트 런타임에도 올라오므로
  # 안 끄면 `./gradlew test` 가 통째로 죽는다.
  #
  # 로컬·테스트의 스키마는 위 ddl-auto: update 가 계속 만든다. 마이그레이션은 배포 DB
  # 하나만 상대한다 — prod 프로파일에서 켠다(application-prod.yml).
  flyway:
    enabled: false
  h2:
    console:
      enabled: true                             # 개발용 DB 콘솔: http://localhost:8000/h2-console
      path: /h2-console

# actuator: 헬스체크만 노출
management:
  endpoints:
    web:
      exposure:
        include: health,info

sphinx:
  ai-service:
    base-url: http://localhost:8100      # ai-service (FastAPI, 윤지석)
    # #41③ /internal/* 공유 시크릿(결정 10.4). 비어 있으면(로컬 목) 헤더를 안 붙인다 —
    # 받는 쪽(ai-service PR #198)도 SPHINX_INTERNAL_TOKEN 이 비면 인증을 끄므로 대칭이다.
    # 배포에서는 양쪽에 같은 값을 주입한다(ai-service도 같은 env 이름을 읽는다).
    internal-token: ${SPHINX_INTERNAL_TOKEN:}
  gate:
    rules-path: classpath:gate_rules.yaml
  deployment:
    # ❗**로컬은 빈 문자열이 정상이다** — 색이 없는 것이 정상이고, 그걸 「모른다」로 그리면
    # 로컬 콘솔이 상시 경고가 된다. 그래서 SimulatorProperties 처럼 빈 값을 세우지 않는다.
    # 배포에서는 compose 가 넘긴다(blue 또는 green) — 지금 그 값을 아는 것은 배포 스크립트뿐
    # 이라 「라이브가 어느 색인가」를 화면에서 볼 방법이 없었다(이슈 #522).
    stack: ${SPHINX_STACK:}
  documents:
    # 상품 원문(PDF) 조회(GET /products/{id}/document, 이슈 #412)가 파일을 찾는 기준 디렉토리.
    # ProductRiskItems.DEMO_DOCUMENTS 의 경로가 이 디렉토리 상대(documents/…)다 — ai-service
    # SPHINX_DATA_DIR 규약과 같은 기준이라 같은 환경변수를 읽는다. 시뮬레이터 시계열과 같은
    # 이유로 클래스패스에 굽지 않고 파일 경로로 읽는다(P2). 기본값은 레포 루트 기준(작업
    # 디렉토리 server/). 컨테이너는 읽기 전용 볼륨 마운트 지점을 환경변수로 주입한다.
    data-dir: ${SPHINX_DATA_DIR:../data}
  simulator:
    # F-SIM-001 지수 시계열 디렉토리. 클래스패스 리소스로 복사하지 않는다 — 18,089줄을 한 벌
    # 더 커밋하면 data/timeseries/VERSION 의 sha256 으로 고정한 원본과 조용히 갈라지고,
    # 시뮬레이터 출력이 달라진 원인이 코드인지 데이터인지 구분할 수 없게 된다(P2).
    # 기본값은 레포 루트 기준(작업 디렉토리 server/). 컨테이너는 읽기 전용 볼륨 마운트 지점을
    # 환경변수로 주입한다.
    timeseries-dir: ${SPHINX_TIMESERIES_DIR:../data/timeseries}
  scoring:
    # 신뢰도 임계값은 gate_rules.yaml R-05가 단일 출처(게이트가 황색 강등을 결정, P1).
    # ❗max-reverify 는 여기 없다 (이슈 #66). gate_rules.yaml R-03(reverifyFailed>=N)의 N 이
    # 유일한 출처이고 SessionService 가 GateEngine.reverifyThreshold() 로 읽는다.
    #
    # 전에는 이 파일에도 같은 숫자가 있었다. 둘이 어긋나면 상한과 게이트가 따로 논다 —
    # 상한 3인데 게이트가 2에서 RED 면 3번째 재설명 기회가 무의미해진다. 대조 테스트로
    # 막고 있었지만 그건 어긋난 뒤에 잡는 것이고, 고칠 자리가 둘이면 언젠가 한 곳만 바뀐다.
    # ADR-005 가 임계값의 단일 출처를 gate_rules.yaml 로 정해 뒀으니 그쪽으로 접었다.

  retention:
    # 기획서 437행 "원문 발화는 보관기간을 한정하고, 이후에는 판정 결과만 남긴다".
    # 지우는 것은 발화 전문(session_utterance)이고, 판정과 그 근거 인용은 남는다 —
    # 인용을 지우면 P4(근거 없는 판정은 무효)가 깨지고 해시 체인도 끊긴다.
    # 근거와 한계는 evidence/RetentionService 주석.
    raw-answer-months: 6                 # 원문 응답 보존 기간 (팀 결정 후 조정)
    # ❗스케줄이 없던 동안 정책이 **한 번도 안 돌았다**(evidence/RetentionScheduler).
    # 매일 03:15. 값을 비우면 기동이 실패한다 — 조용히 안 도는 것보다 낫다.
    cron: "0 15 3 * * *"
    # 되돌릴 수 없는 삭제라 기본은 꺼둔다. 꺼져 있으면 기동 로그에 남긴다 —
    # 조용히 안 돌면 "정책이 있다"고 착각하게 된다(security.enforce 와 같은 이유).
    enforce: false
