plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.sphinxfin'
version = '0.1.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'   // F-CMN-002 RBAC
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'   // 헬스체크·메트릭(/actuator/health)
    runtimeOnly 'com.h2database:h2'                       // MVP: H2 → 필요 시 교체
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml' // gate_rules.yaml 로드

    // F-GTE-004 PDF 리포트 (이슈 #233). Apache-2.0 이라 제출물에서 답할 것이 없다.
    //
    // ❗**HTML→PDF(openhtmltopdf 계열)를 안 고른 이유는 라이선스만이 아니다.** 그쪽은 CSS
    // 레이아웃 엔진을 거치므로 **엔진·폰트 판본이 바뀌면 같은 내용이 다른 지면**이 된다.
    // 이 리포트는 contentHash 를 지면에 찍고 그 해시로 불변 기록과 대조하는 문서라
    // (ADR-003·ADR-008), 렌더가 입력의 함수가 아니게 되는 순간 그 대조의 뜻이 흐려진다.
    // PDFBox 는 우리가 그리는 대로 나온다 — 레이아웃 코드가 느는 대신 그 성질을 얻는다.
    //
    // 한글 줄바꿈은 의존성이 더 필요 없다. PDFBox 에 줄바꿈기가 없다는 것이 곧 직접 짜야
    // 한다는 뜻은 아니다 — java.text.BreakIterator.getLineInstance(Locale.KOREAN) 이 끊을 수
    // 있는 자리를 준다. 실측하면 한글은 음절마다(한국어 조판이 원래 그렇다), 라틴 낱말은
    // 통째로(`ELS`·`barrier`), 문장부호는 앞 글자에 붙여서(`다.`·`100%)`) 끊는다.
    //   "홍콩H지수 ELS 상품의 knock-in barrier 는 45% 입니다."
    //   → [홍, 콩, H, 지, 수 , ELS , 상, 품, 의 , knock-, in , barrier , 는 , 45% , 입, 니, 다.]
    // 글자 단위로 자르면 `ELS` 가 갈리고 마침표가 다음 줄로 떨어진다.
    //
    // ❗commons-logging 을 뺀다. PDFBox 가 그걸 끌고 오는데 Spring Boot 는 **같은 패키지**를
    // spring-jcl 로 제공한다(둘 다 org/apache/commons/logging/*.class 를 담는다 — 실측:
    // spring-jcl 15개 · commons-logging 27개). 둘이 같이 오르면 클래스패스 순서가 이기는
    // 쪽을 정하고, 그러면 로그가 Logback 을 안 거치거나 두 번 찍힌다 — **기동은 되고 로그만
    // 조용히 틀린다.** Spring Boot 가 자기 스타터에서 이걸 빼 두는 것과 같은 조치다.
    implementation('org.apache.pdfbox:pdfbox:3.0.3') {
        exclude group: 'commons-logging', module: 'commons-logging'
    }

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // sphinx.* 설정(@ConfigurationProperties) 메타데이터 생성 → IDE 자동완성
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // 개발 중 자동 재시작(운영 빌드엔 미포함)
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'   // 보안 엔드포인트 테스트(F-CMN-002)
}

tasks.named('test') {
    useJUnitPlatform()

    // ErrorCodeContractTest가 소스셋 밖의 contracts/를 읽는다. 입력으로 선언하지 않으면
    // 계약 파일만 바뀌었을 때 Gradle이 test를 UP-TO-DATE로 건너뛰어, 하필 계약 어긋남을
    // 잡아야 할 상황에서 테스트가 돌지 않는다.
    inputs.files(fileTree('../contracts'))
            .withPropertyName('contracts')
            .withPathSensitivity(PathSensitivity.RELATIVE)

    // CLAUDE.md 도 같은 이유로 입력이다. ErrorCodeContractTest 가 그 문서의 코드 목록을
    // 대조하므로(#109), 여기 없으면 문서만 바꿨을 때 test 가 UP-TO-DATE 로 건너뛴다 —
    // 실측했다: 코드를 하나 지워도 "4 actionable tasks: 4 up-to-date" 로 통과한다.
    // 대조 테스트를 붙여놓고 정작 어긋난 순간에 안 도는 것은 없느니만 못하다.
    inputs.file('../CLAUDE.md')
            .withPropertyName('claudeMd')
            .withPathSensitivity(PathSensitivity.RELATIVE)

    // web/src/api/types.ts 의 ErrorCode 유니온이 계약의 **네 번째 사본**이다.
    // ErrorCodeContractTest 가 대조하는데, 안 걸면 그 파일만 고친 PR 에서 안 돈다 (이슈 #316).
    inputs.file('../web/src/api/types.ts')
            .withPropertyName('webErrorCodeUnion')
            .withPathSensitivity(PathSensitivity.RELATIVE)

    // docs/functional-spec-v1.1.md 의 강제 지점 색인이 실재하는 룰을 가리키는지
    // SpecEnforcementIndexTest 가 대조한다. 안 걸면 **그 문서만 고친 PR 에서 UP-TO-DATE 로
    // 안 돈다** — survey.ts 때 실제로 밟은 함정이다(#186 · 결정 9.26).
    inputs.file('../docs/functional-spec-v1.1.md')
            .withPropertyName('specEnforcementIndex')
            .withPathSensitivity(PathSensitivity.RELATIVE)

    // web/src/lib/survey.ts 도 같은 이유다. SurveyIsOptionOnlyTest 가 그 파일을 읽어
    // "전 문항이 선택지다" 를 잠근다 — surveyResult 를 불변 기록에 원문으로 싣는 근거가
    // 그것 하나이기 때문이다(이슈 #169). 그 파일만 바뀌었을 때가 정확히 이 단정이 필요한
    // 순간인데, 입력이 아니면 그때 UP-TO-DATE 로 건너뛴다.
    //
    // 실측했다: 자유서술 문항을 넣어도 BUILD SUCCESSFUL 이고, --rerun-tasks 로 강제해야
    // FAILED 가 난다. 단정은 맞는데 안 도는 상태였다.
    inputs.file('../web/src/lib/survey.ts')
            .withPropertyName('surveySet')
            .withPathSensitivity(PathSensitivity.RELATIVE)

    // 개방 모드 계정 지도도 같은 이유다. DemoModeAccountMapTest 가 이 파일을 읽어
    // rbac_policy.yaml 과 대조하는데, 안 걸면 **지도만 고친 PR 에서 UP-TO-DATE 로 안 돈다**
    // — 정작 갈리는 그 PR 에서 검사가 빠진다(이슈 #263).
    inputs.file('../web/docker-entrypoint.d/15-demo-mode.sh')
            .withPropertyName('demoModeAccountMap')
    // ai-service 의 복창 캡도 같은 이유다. EchoCapBelowR05Test 가 그 값을 읽어 R-05
    // 임계값과 부등호를 대조하는데, 안 걸면 **그 파일만 고친 PR 에서 안 돈다**(이슈 #268).
    //
    // ❗값이 scoring.py 에서 scoring_thresholds.yaml 로 옮겨졌다(#368). 이 줄이 안
    // 따라오면 **"값만 조정" PR 에서 가드가 통째로 꺼진다** — 튜닝을 코드 변경이 아니게
    // 만드는 것이 그 PR 의 목적이라, 정확히 그때부터 안 돈다.
    inputs.file('../ai-service/app/scoring_thresholds.yaml')
            .withPropertyName('echoConfidenceCap')
            .withPathSensitivity(PathSensitivity.RELATIVE)

    // 루브릭도 같은 이유다. RiskItemCatalogMirrorsRubricsTest 가 risk_item_catalog.yaml 이
    // 그 디렉토리의 name·product_type 과 같은지 대조한다(이슈 #346).
    //
    // ❗**여기가 안 걸리면 정확히 필요한 순간에 안 돈다** — 루브릭만 고친 PR 이 곧 사본이
    // 뒤처지는 PR 이다. 그리고 어긋남은 화면에서 안 보인다: 표시명이 없으면 ID 로
    // 되돌아가는 것이 설계라, 새 항목 하나가 ID 원문으로 뜨는 것과 #346 이전 상태가
    // 똑같이 생겼다. 사람 눈이 아니라 이 대조가 유일한 신호다.
    inputs.files(fileTree('../ai-service/app/rubrics'))
            .withPropertyName('riskItemNames')
            .withPathSensitivity(PathSensitivity.RELATIVE)

    // ❗이 목록 자신을 지키는 입력이다. CiServerFilterMirrorsGradleInputsTest 가 위
    // inputs.file 경로들을 ci.yml 의 server 판별과 대조한다(이슈 #285) — 안 걸면
    // **ci.yml 만 고친 PR 에서 UP-TO-DATE 로 안 돈다.** 잡은 뜬다(워크플로 자신이 바뀌면
    // 3모듈 전부 실행이므로) 그런데 Gradle 이 건너뛰는, #186 과 같은 모양이다.
    //
    // 그리고 이 경로는 위 대조의 **예외**다 — 조기 종료가 필터보다 먼저 server=true 로
    // 끝내므로 server_extra 에 넣을 필요가 없다. 그 예외는 테스트의 EXEMPT 에 이유와
    // 함께 적혀 있다. 조용히 빼면 다음 사람이 왜 하나만 빠졌는지 못 읽는다.
    inputs.file('../.github/workflows/ci.yml')
            .withPropertyName('ciServerFilter')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}
